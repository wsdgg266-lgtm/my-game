name: Deploy to GitHub Pages

# github-pages 環境のブランチ制限により、デプロイはデフォルトブランチからしか成功しない。
# 機能ブランチをここに足すと push のたびに失敗する実行が残るだけなので入れないこと
# (機能ブランチの内容はデフォルトブランチにマージした時点で公開される)。
on:
  push:
    branches:
      - main
      - claude/shopping-reminder-app-7xpyg5
      - claude/sports-schedule-results-app-th4n6j
      - claude/fashion-app-spec-kr6a32
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
