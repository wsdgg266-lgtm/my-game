<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2e7d5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="かいわすれナシ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<title>かいわすれナシ！ - 買い忘れ防止アプリ</title>
<style>
  :root {
    --green: #2e7d5b;
    --green-dark: #1f5c42;
    --green-light: #e6f4ee;
    --bg: #f7f8f7;
    --card: #ffffff;
    --text: #26332d;
    --text-sub: #7a8a82;
    --line: #e3e9e6;
    --danger: #d05252;
    --amber: #f0a840;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 90px;
  }
  header {
    background: var(--green);
    color: #fff;
    padding: calc(14px + env(safe-area-inset-top)) 16px 10px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  header h1 {
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .store-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .store-tabs {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    flex: 1;
  }
  .store-tabs::-webkit-scrollbar { display: none; }
  .store-tab {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 13px;
    border-radius: 99px;
    border: 1.5px solid rgba(255,255,255,.4);
    background: rgba(255,255,255,.12);
    color: #fff;
    font-size: .88rem;
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
  }
  .store-tab.active {
    background: #fff;
    color: var(--green-dark);
    border-color: #fff;
    font-weight: 700;
  }
  .store-tab .badge {
    background: var(--amber);
    color: #4a3300;
    font-size: .72rem;
    font-weight: 700;
    border-radius: 99px;
    padding: 1px 7px;
    min-width: 20px;
    text-align: center;
  }
  .store-tab .gear { font-size: .85rem; opacity: .8; }
  .store-add-btn {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1.5px dashed rgba(255,255,255,.6);
    background: transparent;
    color: #fff;
    font-size: 1.15rem;
    line-height: 1;
    cursor: pointer;
  }
  .progress-wrap { margin-top: 10px; }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: .78rem;
    opacity: .95;
    margin-bottom: 4px;
  }
  .progress-bar {
    height: 8px;
    background: rgba(255,255,255,.25);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #ffd764;
    border-radius: 99px;
    width: 0%;
    transition: width .35s ease;
  }
  main { max-width: 560px; margin: 0 auto; padding: 14px 14px 0; }

  .add-form { margin-bottom: 10px; }
  .add-form .row-full {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    font-size: 1rem;
    background: var(--card);
    outline: none;
    margin-bottom: 8px;
  }
  .add-form .row-full:focus { border-color: var(--green); }
  .add-row2 { display: flex; gap: 8px; }
  .add-form select {
    padding: 0 8px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
    font-size: .85rem;
    color: var(--text);
    outline: none;
    max-width: 100px;
    height: 44px;
  }
  .add-form input[type="number"] {
    flex: 1;
    min-width: 0;
    padding: 0 12px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    font-size: .95rem;
    background: var(--card);
    outline: none;
    height: 44px;
  }
  .add-form input[type="number"]:focus { border-color: var(--green); }
  .add-form button {
    padding: 0 18px;
    border: none;
    border-radius: var(--radius);
    background: var(--green);
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    height: 44px;
  }
  .add-form button:active { background: var(--green-dark); }

  .total-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-bottom: 12px;
  }
  .total-main { font-size: 1rem; font-weight: 700; }
  .total-sub { font-size: .78rem; color: var(--text-sub); text-align: right; }

  .quick-add { margin-bottom: 16px; }
  .quick-add h2 {
    font-size: .8rem;
    color: var(--text-sub);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 7px 14px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 99px;
    font-size: .88rem;
    cursor: pointer;
    color: var(--text);
    transition: all .15s;
    user-select: none;
  }
  .chip:active { transform: scale(.95); }
  .chip.in-list {
    background: var(--green-light);
    border-color: var(--green);
    color: var(--green-dark);
    opacity: .6;
  }

  .cat-group { margin-bottom: 14px; }
  .cat-header {
    font-size: .82rem;
    font-weight: 700;
    color: var(--green-dark);
    background: var(--green-light);
    padding: 5px 12px;
    border-radius: 8px;
    margin-bottom: 6px;
    display: inline-block;
  }
  ul.items { list-style: none; }
  li.item {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 12px;
    margin-bottom: 7px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: opacity .2s;
  }
  li.item.done { opacity: .55; }
  li.item.done .name { text-decoration: line-through; color: var(--text-sub); }
  .checkbox {
    width: 26px;
    height: 26px;
    border: 2px solid var(--green);
    border-radius: 8px;
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    color: #fff;
    background: transparent;
    transition: background .15s;
  }
  li.item.done .checkbox { background: var(--green); border-color: var(--green); }
  .item-body { flex: 1; min-width: 0; cursor: pointer; }
  .name { font-size: 1rem; word-break: break-all; }
  .price-tag {
    display: inline-block;
    margin-top: 3px;
    padding: 2px 10px;
    border: 1px solid var(--line);
    border-radius: 99px;
    background: var(--bg);
    font-size: .78rem;
    color: var(--text-sub);
    cursor: pointer;
  }
  .price-tag.has-price { color: var(--green-dark); border-color: var(--green-light); background: var(--green-light); font-weight: 700; }
  .qty-ctrl {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .qty-btn {
    width: 28px;
    height: 28px;
    border: 1.5px solid var(--line);
    background: var(--bg);
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    color: var(--text);
    line-height: 1;
  }
  .qty { font-size: .95rem; font-weight: 700; min-width: 22px; text-align: center; }
  .del-btn {
    border: none;
    background: none;
    color: var(--text-sub);
    font-size: 1.1rem;
    cursor: pointer;
    padding: 4px 6px;
    flex-shrink: 0;
  }
  .del-btn:active { color: var(--danger); }

  .empty {
    text-align: center;
    color: var(--text-sub);
    padding: 40px 20px;
    font-size: .95rem;
    line-height: 1.8;
  }
  .empty .big { font-size: 2.5rem; display: block; margin-bottom: 8px; }
  .empty button {
    margin-top: 14px;
    padding: 12px 26px;
    border: none;
    border-radius: var(--radius);
    background: var(--green);
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }

  .footer-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    border-top: 1px solid var(--line);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .footer-bar button {
    flex: 1;
    max-width: 260px;
    padding: 12px 6px;
    border-radius: var(--radius);
    border: 1.5px solid var(--line);
    background: var(--bg);
    font-size: .82rem;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
  }
  .footer-bar button.primary {
    background: var(--amber);
    border-color: var(--amber);
    color: #4a3300;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 18px;
    padding: 22px 20px;
    max-width: 420px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal h3 { font-size: 1.05rem; margin-bottom: 6px; }
  .modal p.sub { font-size: .85rem; color: var(--text-sub); margin-bottom: 14px; }
  .modal ul { list-style: none; margin-bottom: 16px; }
  .modal li {
    padding: 10px 12px;
    background: #fdf3e3;
    border: 1px solid #f3ddb0;
    border-radius: 10px;
    margin-bottom: 6px;
    font-size: .95rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .modal .all-done {
    text-align: center;
    padding: 20px 0;
    font-size: 1rem;
    color: var(--green-dark);
    line-height: 1.9;
  }
  .modal .all-done .big { font-size: 2.6rem; display: block; }
  .modal input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    font-size: 1rem;
    outline: none;
    margin-bottom: 14px;
  }
  .modal input[type="text"]:focus { border-color: var(--green); }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns.column { flex-direction: column; }
  .modal-btns button {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    font-size: .92rem;
    font-weight: 700;
    cursor: pointer;
    border: 1.5px solid var(--line);
    background: var(--bg);
    color: var(--text);
  }
  .modal-btns button.primary {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .modal-btns button.danger {
    background: #fdeaea;
    border-color: #f0c0c0;
    color: var(--danger);
  }
  a.link-btn {
    display: block;
    padding: 13px 12px;
    border-radius: 12px;
    font-size: .92rem;
    font-weight: 700;
    text-align: center;
    text-decoration: none;
    border: 1.5px solid var(--line);
    background: var(--bg);
    color: var(--text);
    margin-bottom: 10px;
  }
  a.link-btn.primary {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .flyer-note {
    font-size: .76rem;
    color: var(--text-sub);
    line-height: 1.7;
    margin-bottom: 14px;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 100px;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: #fff;
    padding: 10px 20px;
    border-radius: 99px;
    font-size: .85rem;
    opacity: 0;
    pointer-events: none;
    transition: all .3s;
    z-index: 200;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>🛒 かいわすれナシ！</h1>
  <div class="store-bar">
    <div class="store-tabs" id="storeTabs"></div>
    <button class="store-add-btn" id="storeAddBtn" aria-label="お店を追加">＋</button>
  </div>
  <div class="progress-wrap">
    <div class="progress-label">
      <span id="progressText">リストは空です</span>
      <span id="progressPct"></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</header>

<main>
  <form class="add-form" id="addForm">
    <input type="text" id="itemInput" class="row-full" placeholder="買うものを入力…" autocomplete="off" enterkeyhint="done">
    <div class="add-row2">
      <select id="catSelect">
        <option value="食品">食品</option>
        <option value="日用品">日用品</option>
        <option value="飲み物">飲み物</option>
        <option value="その他" selected>その他</option>
      </select>
      <input type="number" id="priceInput" placeholder="金額(任意)" inputmode="numeric" min="0">
      <button type="submit">追加</button>
    </div>
  </form>

  <div class="total-bar" id="totalBar" hidden>
    <span class="total-main" id="totalMain"></span>
    <span class="total-sub" id="totalSub"></span>
  </div>

  <section class="quick-add" id="quickAddSection" hidden>
    <h2>⭐ このお店でよく買うもの(タップで追加・長押しで削除)</h2>
    <div class="chips" id="quickChips"></div>
  </section>

  <section id="listSection"></section>
</main>

<div class="footer-bar">
  <button id="checkBtn" class="primary">🔍 買い忘れ</button>
  <button id="flyerBtn">📰 チラシ</button>
  <button id="clearDoneBtn">✅ 購入済み削除</button>
</div>

<!-- 買い忘れチェック -->
<div class="overlay" id="checkOverlay">
  <div class="modal">
    <div id="modalContent"></div>
    <div class="modal-btns">
      <button id="closeModalBtn">閉じる</button>
      <button id="finishBtn" class="primary" hidden>買い物を終了する</button>
    </div>
  </div>
</div>

<!-- お店の追加・編集 -->
<div class="overlay" id="storeOverlay">
  <div class="modal">
    <h3 id="storeModalTitle">お店を追加</h3>
    <p class="sub" id="storeModalSub">お店の名前を入力してください(例:〇〇スーパー、ドラッグストア)</p>
    <input type="text" id="storeNameInput" placeholder="お店の名前" autocomplete="off" enterkeyhint="done">
    <div class="modal-btns column">
      <button id="storeSaveBtn" class="primary">追加する</button>
      <button id="storeDeleteBtn" class="danger" hidden>このお店を削除</button>
      <button id="storeCancelBtn">キャンセル</button>
    </div>
  </div>
</div>

<!-- 近くのチラシ -->
<div class="overlay" id="flyerOverlay">
  <div class="modal">
    <h3>📰 近くのチラシを探す</h3>
    <p class="sub">住所を保存しておくと、検索に自動で含まれて近所の店舗が見つかりやすくなります。</p>
    <input type="text" id="addressInput" placeholder="例:横浜市青葉区(任意)" autocomplete="off">
    <div id="flyerLinks"></div>
    <p class="flyer-note">※ チラシはトクバイ・Shufoo! などの外部サイトで表示されます。初回はサイト内で地域を設定すると、次回から近所のチラシがすぐ見られます。</p>
    <div class="modal-btns">
      <button id="flyerCloseBtn">閉じる</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var KEY_V2 = 'kaiwasure.v2';
  var KEY_V1_ITEMS = 'kaiwasure.items.v1';
  var KEY_V1_FREQ = 'kaiwasure.freq.v1';
  var CAT_ORDER = ['食品', '飲み物', '日用品', 'その他'];
  var CAT_ICON = { '食品': '🍎', '飲み物': '🧃', '日用品': '🧻', 'その他': '📦' };

  /**
   * state = {
   *   stores: [{id, name}],
   *   items: [{id, storeId, name, cat, qty, done, price}],  // price: 円(null = 未入力)
   *   freq: { storeId: { name: {cat, count, price} } },  // 店ごとの追加回数と前回の金額
   *   current: storeId | null,
   *   address: string  // チラシ検索用の住所(任意)
   * }
   */
  var state = loadState();

  function loadState() {
    try {
      var raw = localStorage.getItem(KEY_V2);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && s.stores) {
          if (typeof s.address !== 'string') s.address = '';
          return s;
        }
      }
    } catch (e) { /* fall through */ }
    return migrateV1();
  }

  // v1(店の概念なし)からの引き継ぎ:既存データは「いつものお店」に移す
  function migrateV1() {
    var s = { stores: [], items: [], freq: {}, current: null, address: '' };
    var oldItems = null, oldFreq = null;
    try {
      oldItems = JSON.parse(localStorage.getItem(KEY_V1_ITEMS) || 'null');
      oldFreq = JSON.parse(localStorage.getItem(KEY_V1_FREQ) || 'null');
    } catch (e) { /* 破損データは無視 */ }
    if ((oldItems && oldItems.length) || (oldFreq && Object.keys(oldFreq).length)) {
      var store = { id: uid(), name: 'いつものお店' };
      s.stores.push(store);
      s.current = store.id;
      (oldItems || []).forEach(function (it) {
        s.items.push({ id: it.id || uid(), storeId: store.id, name: it.name, cat: it.cat || 'その他', qty: it.qty || 1, done: !!it.done, price: null });
      });
      s.freq[store.id] = oldFreq || {};
      try {
        localStorage.removeItem(KEY_V1_ITEMS);
        localStorage.removeItem(KEY_V1_FREQ);
      } catch (e) { /* ignore */ }
      saveState(s);
    }
    return s;
  }

  function saveState(s) {
    try { localStorage.setItem(KEY_V2, JSON.stringify(s || state)); } catch (e) { /* プライベートモード等 */ }
  }
  function save() { saveState(state); }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function yen(n) {
    return '¥' + Number(n).toLocaleString('ja-JP');
  }
  // 入力文字列を金額に変換(空・不正はnull)
  function parsePrice(v) {
    if (v === null || v === undefined) return null;
    v = String(v).trim();
    if (v === '') return null;
    var n = parseInt(v, 10);
    return (isNaN(n) || n < 0) ? null : n;
  }
  function currentStore() {
    for (var i = 0; i < state.stores.length; i++) {
      if (state.stores[i].id === state.current) return state.stores[i];
    }
    return null;
  }
  function storeItems(storeId) {
    return state.items.filter(function (it) { return it.storeId === storeId; });
  }

  var $ = function (id) { return document.getElementById(id); };
  var toastEl = $('toast');
  var toastTimer = null;

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  // ---- お店 ----
  var storeModalMode = 'add'; // 'add' | 'edit'
  var storeOverlay = $('storeOverlay');

  function openStoreModal(mode) {
    storeModalMode = mode;
    var input = $('storeNameInput');
    if (mode === 'add') {
      $('storeModalTitle').textContent = 'お店を追加';
      $('storeModalSub').textContent = 'お店の名前を入力してください(例:〇〇スーパー、ドラッグストア)';
      $('storeSaveBtn').textContent = '追加する';
      $('storeDeleteBtn').hidden = true;
      input.value = '';
    } else {
      var st = currentStore();
      if (!st) return;
      $('storeModalTitle').textContent = 'お店の設定';
      $('storeModalSub').textContent = '名前の変更、またはこのお店の削除ができます。';
      $('storeSaveBtn').textContent = '名前を変更';
      $('storeDeleteBtn').hidden = false;
      input.value = st.name;
    }
    storeOverlay.classList.add('show');
    setTimeout(function () { input.focus(); }, 100);
  }
  function closeStoreModal() { storeOverlay.classList.remove('show'); }

  $('storeAddBtn').addEventListener('click', function () { openStoreModal('add'); });
  $('storeCancelBtn').addEventListener('click', closeStoreModal);
  storeOverlay.addEventListener('click', function (e) {
    if (e.target === storeOverlay) closeStoreModal();
  });

  $('storeSaveBtn').addEventListener('click', function () {
    var name = $('storeNameInput').value.trim();
    if (!name) { showToast('お店の名前を入力してください'); return; }
    var dup = state.stores.some(function (st) { return st.name === name && st.id !== (storeModalMode === 'edit' ? state.current : null); });
    if (dup) { showToast('「' + name + '」はすでに登録されています'); return; }
    if (storeModalMode === 'add') {
      var store = { id: uid(), name: name };
      state.stores.push(store);
      state.current = store.id;
      showToast('「' + name + '」を追加しました');
    } else {
      var st = currentStore();
      if (st) st.name = name;
    }
    save();
    closeStoreModal();
    render();
  });

  $('storeNameInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); $('storeSaveBtn').click(); }
  });

  $('storeDeleteBtn').addEventListener('click', function () {
    var st = currentStore();
    if (!st) return;
    var count = storeItems(st.id).length;
    var msg = '「' + st.name + '」を削除しますか?' + (count ? '\nリストの ' + count + ' 点も一緒に削除されます。' : '');
    if (!confirm(msg)) return;
    state.stores = state.stores.filter(function (x) { return x.id !== st.id; });
    state.items = state.items.filter(function (it) { return it.storeId !== st.id; });
    delete state.freq[st.id];
    state.current = state.stores.length ? state.stores[0].id : null;
    save();
    closeStoreModal();
    render();
    showToast('「' + st.name + '」を削除しました');
  });

  function renderStoreTabs() {
    var tabs = $('storeTabs');
    tabs.innerHTML = '';
    state.stores.forEach(function (st) {
      var remaining = storeItems(st.id).filter(function (it) { return !it.done; }).length;
      var tab = document.createElement('button');
      tab.type = 'button';
      tab.className = 'store-tab' + (st.id === state.current ? ' active' : '');
      tab.innerHTML = '🏪 ' + esc(st.name) +
        (remaining ? ' <span class="badge">' + remaining + '</span>' : '') +
        (st.id === state.current ? ' <span class="gear">⚙︎</span>' : '');
      tab.addEventListener('click', function () {
        if (st.id === state.current) {
          openStoreModal('edit');
        } else {
          state.current = st.id;
          save();
          render();
        }
      });
      tabs.appendChild(tab);
    });
    // 選択中タブを見える位置へ
    var active = tabs.querySelector('.store-tab.active');
    if (active && active.scrollIntoView) {
      active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }
  }

  // ---- 商品 ----
  function addItem(name, cat, price) {
    var st = currentStore();
    if (!st) { showToast('先にお店を追加してください'); return; }
    name = name.trim();
    if (!name) return;
    var exists = storeItems(st.id).some(function (it) { return it.name === name && !it.done; });
    if (exists) {
      showToast('「' + name + '」はもうリストにあります');
      return;
    }
    state.items.push({ id: uid(), storeId: st.id, name: name, cat: cat, qty: 1, done: false, price: price === undefined ? null : price });
    if (!state.freq[st.id]) state.freq[st.id] = {};
    var f = state.freq[st.id];
    if (!f[name]) f[name] = { cat: cat, count: 0, price: null };
    f[name].count += 1;
    f[name].cat = cat;
    if (price !== undefined && price !== null) f[name].price = price;
    save();
    render();
  }

  function render() {
    renderStoreTabs();
    renderProgress();
    renderTotals();
    renderQuickAdd();
    renderList();
  }

  function renderTotals() {
    var bar = $('totalBar');
    var st = currentStore();
    var list = st ? storeItems(st.id) : [];
    var priced = list.filter(function (it) { return it.price !== null && it.price !== undefined; });
    if (!st || priced.length === 0) { bar.hidden = true; return; }
    bar.hidden = false;
    var total = 0, remaining = 0;
    priced.forEach(function (it) {
      var sub = it.price * it.qty;
      total += sub;
      if (!it.done) remaining += sub;
    });
    var noPrice = list.length - priced.length;
    $('totalMain').textContent = '🧾 合計 ' + yen(total);
    $('totalSub').textContent = '残り ' + yen(remaining) +
      (noPrice > 0 ? '(金額未入力 ' + noPrice + ' 点)' : '');
  }

  function renderProgress() {
    var st = currentStore();
    var list = st ? storeItems(st.id) : [];
    var total = list.length;
    var done = list.filter(function (it) { return it.done; }).length;
    var remaining = total - done;
    if (!st) {
      $('progressText').textContent = 'お店を追加してください';
      $('progressPct').textContent = '';
      $('progressFill').style.width = '0%';
    } else if (total === 0) {
      $('progressText').textContent = st.name + ':リストは空です';
      $('progressPct').textContent = '';
      $('progressFill').style.width = '0%';
    } else {
      $('progressText').textContent = st.name + ':' + (remaining === 0
        ? '全部そろいました！'
        : 'あと ' + remaining + ' 点(全 ' + total + ' 点)');
      var pct = Math.round(done / total * 100);
      $('progressPct').textContent = pct + '%';
      $('progressFill').style.width = pct + '%';
    }
  }

  function renderQuickAdd() {
    var st = currentStore();
    var section = $('quickAddSection');
    var freq = st ? (state.freq[st.id] || {}) : {};
    var names = Object.keys(freq)
      .sort(function (a, b) { return freq[b].count - freq[a].count; })
      .slice(0, 12);
    if (!st || names.length === 0) { section.hidden = true; return; }
    section.hidden = false;
    var chips = $('quickChips');
    chips.innerHTML = '';
    names.forEach(function (name) {
      var inList = storeItems(st.id).some(function (it) { return it.name === name && !it.done; });
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (inList ? ' in-list' : '');
      chip.textContent = (CAT_ICON[freq[name].cat] || '') + ' ' + name;
      var pressTimer = null;
      var longPressed = false;
      function startPress() {
        longPressed = false;
        pressTimer = setTimeout(function () {
          longPressed = true;
          if (confirm('「' + name + '」を「よく買うもの」から削除しますか?')) {
            delete freq[name];
            save();
            render();
          }
        }, 600);
      }
      function cancelPress() { clearTimeout(pressTimer); }
      chip.addEventListener('touchstart', startPress, { passive: true });
      chip.addEventListener('touchend', cancelPress);
      chip.addEventListener('touchmove', cancelPress, { passive: true });
      chip.addEventListener('mousedown', startPress);
      chip.addEventListener('mouseup', cancelPress);
      chip.addEventListener('mouseleave', cancelPress);
      chip.addEventListener('click', function () {
        if (longPressed) return;
        if (inList) { showToast('すでにリストにあります'); return; }
        var f = freq[name] || {};
        addItem(name, f.cat || 'その他', parsePrice(f.price));
        showToast('「' + name + '」を追加しました');
      });
      chips.appendChild(chip);
    });
  }

  function renderList() {
    var listSection = $('listSection');
    listSection.innerHTML = '';
    var st = currentStore();
    if (!st) {
      var div = document.createElement('div');
      div.className = 'empty';
      div.innerHTML = '<span class="big">🏪</span>まずお店を登録しましょう。<br>お店ごとに買い物リストを分けて管理できます。';
      var btn = document.createElement('button');
      btn.textContent = '＋ お店を追加';
      btn.addEventListener('click', function () { openStoreModal('add'); });
      div.appendChild(btn);
      listSection.appendChild(div);
      return;
    }
    var list = storeItems(st.id);
    if (list.length === 0) {
      listSection.innerHTML =
        '<div class="empty"><span class="big">📝</span>' +
        esc(st.name) + ' で買うものを追加してください。<br>一度追加したものは「よく買うもの」から<br>ワンタップで再追加できます。</div>';
      return;
    }
    CAT_ORDER.forEach(function (cat) {
      var group = list.filter(function (it) { return it.cat === cat; });
      if (group.length === 0) return;
      // 未購入を上に
      group.sort(function (a, b) { return (a.done ? 1 : 0) - (b.done ? 1 : 0); });
      var wrap = document.createElement('div');
      wrap.className = 'cat-group';
      var header = document.createElement('div');
      header.className = 'cat-header';
      header.textContent = (CAT_ICON[cat] || '') + ' ' + cat;
      wrap.appendChild(header);
      var ul = document.createElement('ul');
      ul.className = 'items';
      group.forEach(function (it) { ul.appendChild(renderItem(it)); });
      wrap.appendChild(ul);
      listSection.appendChild(wrap);
    });
  }

  function renderItem(it) {
    var li = document.createElement('li');
    li.className = 'item' + (it.done ? ' done' : '');
    var hasPrice = it.price !== null && it.price !== undefined;
    var priceLabel = hasPrice
      ? yen(it.price) + (it.qty > 1 ? ' ×' + it.qty + ' = ' + yen(it.price * it.qty) : '')
      : '¥ 金額を入力';
    li.innerHTML =
      '<div class="checkbox">' + (it.done ? '✓' : '') + '</div>' +
      '<div class="item-body"><div class="name">' + esc(it.name) + '</div>' +
        '<button type="button" class="price-tag' + (hasPrice ? ' has-price' : '') + '" data-act="price">' + priceLabel + '</button>' +
      '</div>' +
      '<div class="qty-ctrl">' +
        '<button class="qty-btn" data-act="minus" aria-label="数量を減らす">−</button>' +
        '<span class="qty">' + it.qty + '</span>' +
        '<button class="qty-btn" data-act="plus" aria-label="数量を増やす">＋</button>' +
      '</div>' +
      '<button class="del-btn" data-act="del" aria-label="削除">🗑</button>';

    function toggle() {
      it.done = !it.done;
      save();
      render();
    }
    li.querySelector('.checkbox').addEventListener('click', toggle);
    li.querySelector('.item-body').addEventListener('click', toggle);
    li.querySelector('[data-act="price"]').addEventListener('click', function (e) {
      e.stopPropagation();
      var input = prompt('「' + it.name + '」の金額(円)を入力してください。\n空欄にすると金額を消せます。', hasPrice ? it.price : '');
      if (input === null) return; // キャンセル
      it.price = parsePrice(input);
      // 次回のクイック追加にも同じ金額を使う
      var f = state.freq[it.storeId];
      if (f && f[it.name]) f[it.name].price = it.price;
      save();
      render();
    });
    li.querySelector('[data-act="plus"]').addEventListener('click', function () {
      it.qty += 1;
      save();
      render();
    });
    li.querySelector('[data-act="minus"]').addEventListener('click', function () {
      if (it.qty > 1) { it.qty -= 1; save(); render(); }
    });
    li.querySelector('[data-act="del"]').addEventListener('click', function () {
      state.items = state.items.filter(function (x) { return x.id !== it.id; });
      save();
      render();
    });
    return li;
  }

  // ---- 買い忘れチェック(選択中のお店のみ) ----
  var overlay = $('checkOverlay');
  var finishBtn = $('finishBtn');

  $('checkBtn').addEventListener('click', function () {
    var st = currentStore();
    var content = $('modalContent');
    if (!st) {
      content.innerHTML = '<div class="all-done"><span class="big">🏪</span>まずお店を追加してください。</div>';
      finishBtn.hidden = true;
      overlay.classList.add('show');
      return;
    }
    var list = storeItems(st.id);
    var remaining = list.filter(function (it) { return !it.done; });
    if (list.length === 0) {
      content.innerHTML = '<div class="all-done"><span class="big">🤷</span>' + esc(st.name) + ' のリストが空です。<br>まず買うものを追加しましょう。</div>';
      finishBtn.hidden = true;
    } else if (remaining.length === 0) {
      content.innerHTML = '<div class="all-done"><span class="big">🎉</span>' + esc(st.name) + ' での買い忘れはありません!<br>全 ' + list.length + ' 点そろいました。</div>';
      finishBtn.hidden = false;
    } else {
      var remainTotal = 0;
      remaining.forEach(function (it) {
        if (it.price !== null && it.price !== undefined) remainTotal += it.price * it.qty;
      });
      content.innerHTML =
        '<h3>⚠️ ' + esc(st.name) + ' でまだ買っていないものが ' + remaining.length + ' 点あります</h3>' +
        '<p class="sub">レジに行く前にもう一度確認してください。' +
          (remainTotal > 0 ? '残りの合計は約 ' + yen(remainTotal) + ' です。' : '') + '</p>' +
        '<ul>' + remaining.map(function (it) {
          var hasPrice = it.price !== null && it.price !== undefined;
          return '<li>' + (CAT_ICON[it.cat] || '') + ' ' + esc(it.name) +
            (it.qty > 1 ? ' × ' + it.qty : '') +
            (hasPrice ? '(' + yen(it.price * it.qty) + ')' : '') + '</li>';
        }).join('') + '</ul>';
      finishBtn.hidden = true;
    }
    overlay.classList.add('show');
  });

  finishBtn.addEventListener('click', function () {
    var st = currentStore();
    if (st) {
      state.items = state.items.filter(function (it) { return it.storeId !== st.id; });
      save();
    }
    render();
    overlay.classList.remove('show');
    showToast('おつかれさまでした!リストをリセットしました');
  });

  $('closeModalBtn').addEventListener('click', function () {
    overlay.classList.remove('show');
  });
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) overlay.classList.remove('show');
  });

  $('clearDoneBtn').addEventListener('click', function () {
    var st = currentStore();
    if (!st) { showToast('先にお店を追加してください'); return; }
    var doneItems = storeItems(st.id).filter(function (it) { return it.done; });
    if (doneItems.length === 0) { showToast('購入済みのものはありません'); return; }
    var doneIds = {};
    doneItems.forEach(function (it) { doneIds[it.id] = true; });
    state.items = state.items.filter(function (it) { return !doneIds[it.id]; });
    save();
    render();
    showToast('購入済み ' + doneItems.length + ' 点を削除しました');
  });

  $('addForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = $('itemInput');
    var priceInput = $('priceInput');
    addItem(input.value, $('catSelect').value, parsePrice(priceInput.value));
    input.value = '';
    priceInput.value = '';
    input.focus();
  });

  // ---- 近くのチラシ ----
  var flyerOverlay = $('flyerOverlay');

  function renderFlyerLinks() {
    var st = currentStore();
    var address = state.address.trim();
    var keyword = (st ? st.name : 'スーパー') + (address ? ' ' + address : '') + ' チラシ';
    var links = $('flyerLinks');
    links.innerHTML =
      '<a class="link-btn primary" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(keyword) + '">' +
        '🔎 「' + esc(st ? st.name : 'スーパー') + ' のチラシ」を検索</a>' +
      '<a class="link-btn" target="_blank" rel="noopener" href="https://tokubai.co.jp/">トクバイを開く(チラシ・特売情報)</a>' +
      '<a class="link-btn" target="_blank" rel="noopener" href="https://www.shufoo.net/">Shufoo! を開く(電子チラシ)</a>';
  }

  $('flyerBtn').addEventListener('click', function () {
    $('addressInput').value = state.address;
    renderFlyerLinks();
    flyerOverlay.classList.add('show');
  });
  $('addressInput').addEventListener('input', function () {
    state.address = this.value;
    save();
    renderFlyerLinks();
  });
  $('flyerCloseBtn').addEventListener('click', function () {
    flyerOverlay.classList.remove('show');
  });
  flyerOverlay.addEventListener('click', function (e) {
    if (e.target === flyerOverlay) flyerOverlay.classList.remove('show');
  });

  render();

  // PWA: オフライン対応(file://直開きでは無効、HTTPS配信時のみ)
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(function () { /* 未対応環境では無視 */ });
  }
})();
</script>
</body>
</html>
