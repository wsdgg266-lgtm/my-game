<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2e7d5b">
<title>かいわすれナシ！ - 買い忘れ防止アプリ</title>
<style>
  :root {
    --green: #2e7d5b;
    --green-dark: #1f5c42;
    --green-light: #e6f4ee;
    --bg: #f7f8f7;
    --card: #ffffff;
    --text: #26332d;
    --text-sub: #7a8a82;
    --line: #e3e9e6;
    --danger: #d05252;
    --amber: #f0a840;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 90px;
  }
  header {
    background: var(--green);
    color: #fff;
    padding: 18px 16px 14px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  header h1 {
    font-size: 1.15rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .progress-wrap { margin-top: 10px; }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: .78rem;
    opacity: .95;
    margin-bottom: 4px;
  }
  .progress-bar {
    height: 8px;
    background: rgba(255,255,255,.25);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #ffd764;
    border-radius: 99px;
    width: 0%;
    transition: width .35s ease;
  }
  main { max-width: 560px; margin: 0 auto; padding: 14px 14px 0; }

  .add-form {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .add-form input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    font-size: 1rem;
    background: var(--card);
    outline: none;
    min-width: 0;
  }
  .add-form input[type="text"]:focus { border-color: var(--green); }
  .add-form select {
    padding: 0 8px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
    font-size: .85rem;
    color: var(--text);
    outline: none;
    max-width: 100px;
  }
  .add-form button {
    padding: 0 18px;
    border: none;
    border-radius: var(--radius);
    background: var(--green);
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
  }
  .add-form button:active { background: var(--green-dark); }

  .quick-add { margin-bottom: 16px; }
  .quick-add h2, .section-title {
    font-size: .8rem;
    color: var(--text-sub);
    font-weight: 700;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 7px 14px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 99px;
    font-size: .88rem;
    cursor: pointer;
    color: var(--text);
    transition: all .15s;
    user-select: none;
  }
  .chip:active { transform: scale(.95); }
  .chip.in-list {
    background: var(--green-light);
    border-color: var(--green);
    color: var(--green-dark);
    opacity: .6;
  }
  .chip .x {
    margin-left: 6px;
    color: var(--text-sub);
    font-size: .8rem;
  }

  .cat-group { margin-bottom: 14px; }
  .cat-header {
    font-size: .82rem;
    font-weight: 700;
    color: var(--green-dark);
    background: var(--green-light);
    padding: 5px 12px;
    border-radius: 8px;
    margin-bottom: 6px;
    display: inline-block;
  }
  ul.items { list-style: none; }
  li.item {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 12px;
    margin-bottom: 7px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: opacity .2s;
  }
  li.item.done { opacity: .55; }
  li.item.done .name { text-decoration: line-through; color: var(--text-sub); }
  .checkbox {
    width: 26px;
    height: 26px;
    border: 2px solid var(--green);
    border-radius: 8px;
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    color: #fff;
    background: transparent;
    transition: background .15s;
  }
  li.item.done .checkbox { background: var(--green); border-color: var(--green); }
  .item-body { flex: 1; min-width: 0; cursor: pointer; }
  .name { font-size: 1rem; word-break: break-all; }
  .qty-ctrl {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .qty-btn {
    width: 28px;
    height: 28px;
    border: 1.5px solid var(--line);
    background: var(--bg);
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    color: var(--text);
    line-height: 1;
  }
  .qty { font-size: .95rem; font-weight: 700; min-width: 22px; text-align: center; }
  .del-btn {
    border: none;
    background: none;
    color: var(--text-sub);
    font-size: 1.1rem;
    cursor: pointer;
    padding: 4px 6px;
    flex-shrink: 0;
  }
  .del-btn:active { color: var(--danger); }

  .empty {
    text-align: center;
    color: var(--text-sub);
    padding: 40px 20px;
    font-size: .95rem;
    line-height: 1.8;
  }
  .empty .big { font-size: 2.5rem; display: block; margin-bottom: 8px; }

  .footer-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    border-top: 1px solid var(--line);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .footer-bar button {
    flex: 1;
    max-width: 260px;
    padding: 12px;
    border-radius: var(--radius);
    border: 1.5px solid var(--line);
    background: var(--bg);
    font-size: .9rem;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
  }
  .footer-bar button.primary {
    background: var(--amber);
    border-color: var(--amber);
    color: #4a3300;
  }

  /* 買い忘れチェックモーダル */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 18px;
    padding: 22px 20px;
    max-width: 420px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal h3 { font-size: 1.05rem; margin-bottom: 6px; }
  .modal p.sub { font-size: .85rem; color: var(--text-sub); margin-bottom: 14px; }
  .modal ul { list-style: none; margin-bottom: 16px; }
  .modal li {
    padding: 10px 12px;
    background: #fdf3e3;
    border: 1px solid #f3ddb0;
    border-radius: 10px;
    margin-bottom: 6px;
    font-size: .95rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .modal .all-done {
    text-align: center;
    padding: 20px 0;
    font-size: 1rem;
    color: var(--green-dark);
    line-height: 1.9;
  }
  .modal .all-done .big { font-size: 2.6rem; display: block; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns button {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    font-size: .92rem;
    font-weight: 700;
    cursor: pointer;
    border: 1.5px solid var(--line);
    background: var(--bg);
    color: var(--text);
  }
  .modal-btns button.primary {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 100px;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: #fff;
    padding: 10px 20px;
    border-radius: 99px;
    font-size: .85rem;
    opacity: 0;
    pointer-events: none;
    transition: all .3s;
    z-index: 200;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>🛒 かいわすれナシ！</h1>
  <div class="progress-wrap">
    <div class="progress-label">
      <span id="progressText">リストは空です</span>
      <span id="progressPct"></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</header>

<main>
  <form class="add-form" id="addForm">
    <input type="text" id="itemInput" placeholder="買うものを入力…" autocomplete="off" enterkeyhint="done">
    <select id="catSelect">
      <option value="食品">食品</option>
      <option value="日用品">日用品</option>
      <option value="飲み物">飲み物</option>
      <option value="その他" selected>その他</option>
    </select>
    <button type="submit">追加</button>
  </form>

  <section class="quick-add" id="quickAddSection" hidden>
    <h2>⭐ よく買うもの(タップで追加・長押しで削除)</h2>
    <div class="chips" id="quickChips"></div>
  </section>

  <section id="listSection"></section>
</main>

<div class="footer-bar">
  <button id="checkBtn" class="primary">🔍 買い忘れチェック</button>
  <button id="clearDoneBtn">✅ 購入済みを削除</button>
</div>

<div class="overlay" id="checkOverlay">
  <div class="modal">
    <div id="modalContent"></div>
    <div class="modal-btns">
      <button id="closeModalBtn">閉じる</button>
      <button id="finishBtn" class="primary" hidden>買い物を終了する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'kaiwasure.items.v1';
  var FREQ_KEY = 'kaiwasure.freq.v1';
  var CAT_ORDER = ['食品', '飲み物', '日用品', 'その他'];
  var CAT_ICON = { '食品': '🍎', '飲み物': '🧃', '日用品': '🧻', 'その他': '📦' };

  /** @type {{id:string, name:string, cat:string, qty:number, done:boolean}[]} */
  var items = load(STORAGE_KEY, []);
  /** name -> {cat, count} 追加回数を記録して「よく買うもの」を出す */
  var freq = load(FREQ_KEY, {});

  function load(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      return fallback;
    }
  }
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      localStorage.setItem(FREQ_KEY, JSON.stringify(freq));
    } catch (e) { /* プライベートモード等では保存不可 */ }
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function esc(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var $ = function (id) { return document.getElementById(id); };
  var listSection = $('listSection');
  var toastEl = $('toast');
  var toastTimer = null;

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  function addItem(name, cat) {
    name = name.trim();
    if (!name) return;
    var exists = items.some(function (it) { return it.name === name && !it.done; });
    if (exists) {
      showToast('「' + name + '」はもうリストにあります');
      return;
    }
    items.push({ id: uid(), name: name, cat: cat, qty: 1, done: false });
    if (!freq[name]) freq[name] = { cat: cat, count: 0 };
    freq[name].count += 1;
    freq[name].cat = cat;
    save();
    render();
  }

  function render() {
    renderProgress();
    renderQuickAdd();
    renderList();
  }

  function renderProgress() {
    var total = items.length;
    var done = items.filter(function (it) { return it.done; }).length;
    var remaining = total - done;
    if (total === 0) {
      $('progressText').textContent = 'リストは空です';
      $('progressPct').textContent = '';
      $('progressFill').style.width = '0%';
    } else {
      $('progressText').textContent = remaining === 0
        ? '全部そろいました！'
        : 'あと ' + remaining + ' 点(全 ' + total + ' 点)';
      var pct = Math.round(done / total * 100);
      $('progressPct').textContent = pct + '%';
      $('progressFill').style.width = pct + '%';
    }
  }

  function renderQuickAdd() {
    var names = Object.keys(freq)
      .sort(function (a, b) { return freq[b].count - freq[a].count; })
      .slice(0, 12);
    var section = $('quickAddSection');
    if (names.length === 0) { section.hidden = true; return; }
    section.hidden = false;
    var chips = $('quickChips');
    chips.innerHTML = '';
    names.forEach(function (name) {
      var inList = items.some(function (it) { return it.name === name && !it.done; });
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (inList ? ' in-list' : '');
      chip.textContent = (CAT_ICON[freq[name].cat] || '') + ' ' + name;
      var pressTimer = null;
      var longPressed = false;
      function startPress() {
        longPressed = false;
        pressTimer = setTimeout(function () {
          longPressed = true;
          if (confirm('「' + name + '」を「よく買うもの」から削除しますか?')) {
            delete freq[name];
            save();
            render();
          }
        }, 600);
      }
      function cancelPress() { clearTimeout(pressTimer); }
      chip.addEventListener('touchstart', startPress, { passive: true });
      chip.addEventListener('touchend', cancelPress);
      chip.addEventListener('touchmove', cancelPress, { passive: true });
      chip.addEventListener('mousedown', startPress);
      chip.addEventListener('mouseup', cancelPress);
      chip.addEventListener('mouseleave', cancelPress);
      chip.addEventListener('click', function () {
        if (longPressed) return;
        if (inList) { showToast('すでにリストにあります'); return; }
        addItem(name, freq[name] ? freq[name].cat : 'その他');
        showToast('「' + name + '」を追加しました');
      });
      chips.appendChild(chip);
    });
  }

  function renderList() {
    listSection.innerHTML = '';
    if (items.length === 0) {
      listSection.innerHTML =
        '<div class="empty"><span class="big">📝</span>' +
        '買うものを追加してください。<br>一度追加したものは「よく買うもの」から<br>ワンタップで再追加できます。</div>';
      return;
    }
    CAT_ORDER.forEach(function (cat) {
      var group = items.filter(function (it) { return it.cat === cat; });
      if (group.length === 0) return;
      // 未購入を上に
      group.sort(function (a, b) { return (a.done ? 1 : 0) - (b.done ? 1 : 0); });
      var wrap = document.createElement('div');
      wrap.className = 'cat-group';
      var header = document.createElement('div');
      header.className = 'cat-header';
      header.textContent = (CAT_ICON[cat] || '') + ' ' + cat;
      wrap.appendChild(header);
      var ul = document.createElement('ul');
      ul.className = 'items';
      group.forEach(function (it) { ul.appendChild(renderItem(it)); });
      wrap.appendChild(ul);
      listSection.appendChild(wrap);
    });
  }

  function renderItem(it) {
    var li = document.createElement('li');
    li.className = 'item' + (it.done ? ' done' : '');
    li.innerHTML =
      '<div class="checkbox">' + (it.done ? '✓' : '') + '</div>' +
      '<div class="item-body"><div class="name">' + esc(it.name) + '</div></div>' +
      '<div class="qty-ctrl">' +
        '<button class="qty-btn" data-act="minus" aria-label="数量を減らす">−</button>' +
        '<span class="qty">' + it.qty + '</span>' +
        '<button class="qty-btn" data-act="plus" aria-label="数量を増やす">＋</button>' +
      '</div>' +
      '<button class="del-btn" data-act="del" aria-label="削除">🗑</button>';

    function toggle() {
      it.done = !it.done;
      save();
      render();
    }
    li.querySelector('.checkbox').addEventListener('click', toggle);
    li.querySelector('.item-body').addEventListener('click', toggle);
    li.querySelector('[data-act="plus"]').addEventListener('click', function () {
      it.qty += 1;
      save();
      render();
    });
    li.querySelector('[data-act="minus"]').addEventListener('click', function () {
      if (it.qty > 1) { it.qty -= 1; save(); render(); }
    });
    li.querySelector('[data-act="del"]').addEventListener('click', function () {
      items = items.filter(function (x) { return x.id !== it.id; });
      save();
      render();
    });
    return li;
  }

  // ---- 買い忘れチェック ----
  var overlay = $('checkOverlay');
  var finishBtn = $('finishBtn');

  $('checkBtn').addEventListener('click', function () {
    var remaining = items.filter(function (it) { return !it.done; });
    var content = $('modalContent');
    if (items.length === 0) {
      content.innerHTML = '<div class="all-done"><span class="big">🤷</span>リストが空です。<br>まず買うものを追加しましょう。</div>';
      finishBtn.hidden = true;
    } else if (remaining.length === 0) {
      content.innerHTML = '<div class="all-done"><span class="big">🎉</span>買い忘れはありません!<br>全 ' + items.length + ' 点そろいました。</div>';
      finishBtn.hidden = false;
    } else {
      content.innerHTML =
        '<h3>⚠️ まだ買っていないものが ' + remaining.length + ' 点あります</h3>' +
        '<p class="sub">レジに行く前にもう一度確認してください。</p>' +
        '<ul>' + remaining.map(function (it) {
          return '<li>' + (CAT_ICON[it.cat] || '') + ' ' + esc(it.name) +
            (it.qty > 1 ? ' × ' + it.qty : '') + '</li>';
        }).join('') + '</ul>';
      finishBtn.hidden = true;
    }
    overlay.classList.add('show');
  });

  finishBtn.addEventListener('click', function () {
    items = [];
    save();
    render();
    overlay.classList.remove('show');
    showToast('おつかれさまでした!リストをリセットしました');
  });

  $('closeModalBtn').addEventListener('click', function () {
    overlay.classList.remove('show');
  });
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) overlay.classList.remove('show');
  });

  $('clearDoneBtn').addEventListener('click', function () {
    var doneCount = items.filter(function (it) { return it.done; }).length;
    if (doneCount === 0) { showToast('購入済みのものはありません'); return; }
    items = items.filter(function (it) { return !it.done; });
    save();
    render();
    showToast('購入済み ' + doneCount + ' 点を削除しました');
  });

  $('addForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = $('itemInput');
    addItem(input.value, $('catSelect').value);
    input.value = '';
    input.focus();
  });

  render();
})();
</script>
</body>
</html>
