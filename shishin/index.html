<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="四神バトル">
<meta name="theme-color" content="#101733">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>四神まなびバトル</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
/* Layout: 四神の方位盤 — 夜空の盤面の上に、東西南北の守護神が並ぶ。1画面アプリ＋下タブ */
:root{
  --vw:1vw;--vh:1vh;
  --sky:#101733;        /* 夜空（背景） */
  --plate:#1a2350;      /* 盤面パネル */
  --plate2:#243066;     /* 浮き上がり */
  --line:#34407a;       /* 罫線 */
  --ink:#f5f3ff;        /* 文字 */
  --mute:#aab3dc;       /* 補助文字 */
  --gold:#ffcf4a;       /* 金（コイン・★・強調） */
  --good:#3ee08a;
  --bad:#ff5d6c;
  --math:#3ea6ff;       /* 青龍 */
  --japanese:#ff6a3d;   /* 朱雀 */
  --science:#3fd46b;    /* 白虎（翠） */
  --social:#a45cff;     /* 玄武（紫） */
  --all:#ffc83d;        /* 四神の絆 */
  --f-disp:"Dela Gothic One","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-body);font-weight:500;font-size:16px;line-height:1.5;
  background-image:radial-gradient(circle at 20% 10%,rgba(255,255,255,.07) 0 1px,transparent 1.5px),radial-gradient(circle at 70% 30%,rgba(255,255,255,.06) 0 1px,transparent 1.5px),radial-gradient(circle at 40% 70%,rgba(255,255,255,.05) 0 1px,transparent 1.5px);
  background-size:120px 120px,170px 170px,90px 90px;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
rt{font-size:.5em;font-weight:500;color:var(--mute)}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 24px;display:flex;flex-direction:column;gap:14px}
.scroll>*{flex-shrink:0}
.s-math{--c:var(--math)} .s-japanese{--c:var(--japanese)} .s-science{--c:var(--science)} .s-social{--c:var(--social)} .s-all{--c:var(--all)}

/* ヘッダー */
.top{display:flex;align-items:center;gap:8px;padding:10px 16px 6px;min-height:52px}
.top h1{font-family:var(--f-disp);font-weight:400;font-size:22px;margin:0;flex:1;text-wrap:balance;letter-spacing:.02em}
.back{width:44px;height:44px;border-radius:14px;background:var(--plate);font-size:22px;display:grid;place-items:center;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--plate);font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.gold{color:var(--gold)}

/* タブバー */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--plate);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--mute);min-height:58px}
.tabs button .ti{font-size:24px;line-height:1;filter:grayscale(.6);opacity:.8}
.tabs button[aria-current="true"]{color:var(--gold)}
.tabs button[aria-current="true"] .ti{filter:none;opacity:1}

/* 汎用 */
.panel{background:var(--plate);border-radius:20px;padding:14px 16px;border:1px solid var(--line)}
.label{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--mute)}
.h2{font-family:var(--f-disp);font-weight:400;font-size:19px;margin:0}
.muted{color:var(--mute)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--c,var(--gold));transition:width .45s ease}
.big-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:20px;background:var(--plate);border:1px solid var(--line);min-height:76px}
.big-btn .bi{font-size:36px;width:48px;text-align:center;flex:none}
.big-btn b{font-size:19px;display:block;line-height:1.3}
.big-btn small{color:var(--mute);font-size:13px;display:block}
.big-btn.hero{background:linear-gradient(135deg,#2c3a86,#1b2459);border-color:#4b5bb0}
.badge{background:var(--bad);color:#fff;border-radius:99px;font-size:13px;font-weight:800;padding:1px 9px;margin-left:auto;flex:none}
.cta{width:100%;padding:16px;border-radius:18px;background:var(--gold);color:#281d00;font-family:var(--f-disp);font-size:21px;box-shadow:0 5px 0 #b88a0a}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #b88a0a}
.cta:disabled{background:#4a4f6e;color:#8f95b6;box-shadow:none}
.sub-btn{padding:12px 16px;border-radius:14px;background:var(--plate2);font-weight:800;border:1px solid var(--line)}
.linkrow{display:flex;gap:10px}
.linkrow>*{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:800;background:rgba(255,255,255,.08)}
.chip.up{background:rgba(62,224,138,.18);color:var(--good)}
.chip.down{background:rgba(255,93,108,.18);color:#ff9aa4}

/* ホーム：方位盤 */
.compass{position:relative;aspect-ratio:1;max-width:330px;width:100%;margin:4px auto 0}
.compass::before{content:"";position:absolute;inset:14%;border-radius:50%;border:2px dashed var(--line)}
.compass::after{content:"";position:absolute;inset:30%;border-radius:50%;background:radial-gradient(circle,#2a3780,#18204a);border:2px solid #4b5bb0}
.core{position:absolute;inset:30%;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.core .lv{font-family:var(--f-disp);font-size:30px;line-height:1}
.core .lvl{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--mute)}
.core .bar{width:70%;height:7px;margin-top:6px}
.god{position:absolute;width:31%;display:flex;flex-direction:column;align-items:center;gap:0;z-index:3}
.god .orb{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 55%,#fff 0%),color-mix(in srgb,var(--c) 45%,#0c1230));box-shadow:0 0 22px color-mix(in srgb,var(--c) 50%,transparent)}
.god b{font-size:14px;margin-top:2px}
.god small{font-size:11px;color:var(--mute);line-height:1.1}
.god .dir{position:absolute;top:-4px;left:6px;font-family:var(--f-disp);font-size:13px;color:var(--c)}
.g-n{top:0;left:34.5%} .g-s{bottom:0;left:34.5%} .g-e{right:0;top:33%} .g-w{left:0;top:33%}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--plate);border:1px solid var(--line);border-radius:16px;padding:8px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:var(--mute);font-weight:800}

/* 冒険マップ */
.chapter{border-radius:22px;padding:12px 12px 14px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 18%,var(--plate)),var(--plate));border:1px solid color-mix(in srgb,var(--c) 35%,var(--line))}
.chapter-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.chapter-h .ce{font-size:30px}
.node{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:16px;background:rgba(10,14,40,.45);margin-top:8px;min-height:62px}
.node .ni{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:rgba(255,255,255,.08);flex:none}
.node.boss .ni{background:color-mix(in srgb,var(--c) 40%,transparent)}
.node b{display:block;font-size:16px}
.node small{color:var(--mute);font-size:12px}
.node.locked{opacity:.45}
.node .st{margin-left:auto;font-size:22px;flex:none}
.node.next{outline:2px solid var(--gold);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{outline-color:transparent}}

/* ステージ前 */
.foe{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:18px 16px;border-radius:24px;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 35%,var(--plate)),var(--plate));border:1px solid color-mix(in srgb,var(--c) 40%,var(--line))}
.foe .fe{font-size:84px;line-height:1.1}
.foe .ft{font-family:var(--f-disp);font-size:22px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:8px}
.kv div{background:rgba(10,14,40,.4);border-radius:12px;padding:6px}
.kv b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.kv small{font-size:11px;color:var(--mute);font-weight:800}
.deckprev{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{border-radius:16px;padding:8px 6px;text-align:center;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 30%,var(--plate2)),var(--plate2));border:2px solid color-mix(in srgb,var(--c) 45%,transparent);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.mini .me{font-size:30px;line-height:1.1}
.mini b{font-size:12px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.mini small{font-size:11px;color:var(--mute)}

/* カード */
.cardface{position:relative;border-radius:22px;padding:14px;aspect-ratio:.72;max-width:260px;width:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#0c1230),color-mix(in srgb,var(--c) 18%,#0c1230));border:3px solid color-mix(in srgb,var(--c) 70%,#fff);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.cardface.ev{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,207,74,.25),0 10px 30px rgba(0,0,0,.35)}
.cardface .stars{color:var(--gold);font-size:15px;letter-spacing:1px;align-self:flex-start}
.cardface .cg{position:absolute;top:12px;right:14px;font-size:12px;font-weight:800;background:rgba(0,0,0,.3);padding:2px 8px;border-radius:99px}
.cardface .art{flex:1;display:grid;place-items:center;font-size:92px;width:100%;border-radius:16px;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)}
.cardface .cn{font-family:var(--f-disp);font-size:20px;text-align:center;line-height:1.2}
.cardface .cs{display:flex;justify-content:space-between;width:100%;font-weight:800;font-size:14px;background:rgba(0,0,0,.28);border-radius:10px;padding:4px 10px;font-variant-numeric:tabular-nums}
.science-dark{color:#101733}
.dexgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:start}
.dex{border-radius:16px;padding:8px 4px;text-align:center;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 28%,var(--plate2)),var(--plate2));border:2px solid color-mix(in srgb,var(--c) 40%,transparent);min-height:112px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.dex .de{font-size:34px;line-height:1.2}
.dex b{font-size:12px;line-height:1.25;max-width:100%}
.dex small{font-size:11px;color:var(--gold)}
.dex.unknown{background:var(--plate);border:2px dashed var(--line)}
.dex.unknown .de{filter:brightness(0);opacity:.5}
.dex.indeck{outline:3px solid var(--gold)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--plate);border-radius:14px;padding:4px;gap:4px}
.seg button{padding:10px;border-radius:10px;font-weight:800;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--plate2);color:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot-empty{border:2px dashed var(--line);border-radius:16px;display:grid;place-items:center;min-height:96px;color:var(--mute);font-weight:800}
.cardrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:16px;background:var(--plate);border:1px solid var(--line);min-height:66px}
.ce2{font-size:32px;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 30%,transparent);flex:none}
.cardrow b{display:block;font-size:16px}
.cardrow small{color:var(--mute);font-size:12px}
.cardrow .ck{margin-left:auto;font-size:26px;flex:none}
.cardrow.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--plate))}

/* バトル */
.bscreen{height:100%;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 18%,color-mix(in srgb,var(--c) 32%,transparent),transparent 60%),var(--sky);position:relative;overflow:hidden}
.btop{display:flex;align-items:center;gap:8px;padding:8px 12px 4px}
.btop .bt{flex:1;min-width:0}
.btop .bt b{font-family:var(--f-disp);font-weight:400;font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btop .bt small{font-size:12px;color:var(--mute);font-weight:800}
.flee{padding:8px 12px;border-radius:12px;background:var(--plate);font-size:14px;font-weight:800;flex:none}
.arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:4px;padding:6px 12px 4px}
.fighter{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.fighter .fx{font-size:60px;line-height:1.1;height:78px;display:grid;place-items:center}
.fighter .avatar{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;font-size:46px;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--pc) 60%,#fff 0%),color-mix(in srgb,var(--pc) 40%,#0c1230));box-shadow:0 0 24px color-mix(in srgb,var(--pc) 55%,transparent)}
.fighter b{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fighter .bar{width:100%;height:12px}
.fighter .hpn{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--mute)}
.vs{font-family:var(--f-disp);font-size:18px;color:var(--mute);padding-bottom:40px}
.hpbar.low>i{background:var(--bad)!important}
.lunge{animation:lunge .5s ease}
@keyframes lunge{40%{transform:translateX(40px) scale(1.12)}}
.shake{animation:shake .45s ease}
@keyframes shake{20%{transform:translateX(10px) rotate(6deg)}40%{transform:translateX(-8px)}60%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
.recoil{animation:recoil .45s ease}
@keyframes recoil{30%{transform:translateX(-12px);filter:brightness(1.8) saturate(0)}}
.enemy-lunge{animation:elunge .5s ease}
@keyframes elunge{40%{transform:translateX(-40px) scale(1.12)}}
.dmg{position:absolute;z-index:30;left:50%;top:18%;transform:translateX(-50%);font-family:var(--f-disp);font-size:44px;color:#fff;text-shadow:0 3px 0 #b8203a,0 0 20px rgba(255,93,108,.7);pointer-events:none;animation:floatUp 1s ease forwards;white-space:nowrap;text-align:center}
.dmg small{display:block;font-size:18px;color:var(--gold);text-shadow:0 2px 0 #6b4a00}
.dmg.heal{color:#ffd9dd;text-shadow:0 3px 0 #6b0014}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,20px) scale(.5)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
.statusline{display:flex;align-items:center;gap:8px;padding:2px 12px 6px}
.gauge{flex:1;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800}
.gauge .bar{flex:1;height:12px}
.gauge .bar>i{background:linear-gradient(90deg,var(--gold),#ff8a3d)}
.gauge.full .bar{box-shadow:0 0 12px var(--gold)}
.qbox{flex:1;display:flex;flex-direction:column;gap:10px;padding:10px 12px 8px;margin:0 10px;border-radius:22px 22px 0 0;background:var(--plate);border:1px solid var(--line);border-bottom:0;min-height:0;overflow-y:auto}
.qhead{display:flex;align-items:center;gap:8px}
.qtext{font-size:21px;font-weight:800;line-height:1.55;text-wrap:pretty}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices.long{grid-template-columns:1fr}
.choice{min-height:62px;padding:10px 12px;border-radius:16px;background:var(--plate2);border:2px solid var(--line);font-size:19px;font-weight:800;text-align:center;line-height:1.35;display:flex;align-items:center;justify-content:center;gap:6px}
.choices.long .choice{min-height:52px;font-size:17px}
.choice:active{transform:scale(.97)}
.choice.ok{background:color-mix(in srgb,var(--good) 30%,var(--plate2));border-color:var(--good)}
.choice.ng{background:color-mix(in srgb,var(--bad) 30%,var(--plate2));border-color:var(--bad)}
.choice.dim{opacity:.4}
.verdict{position:absolute;z-index:25;left:50%;top:36%;transform:translate(-50%,-50%);font-family:var(--f-disp);font-size:48px;pointer-events:none;animation:pop .8s ease forwards;white-space:nowrap}
.verdict.good{color:var(--good);text-shadow:0 4px 0 #0d5a33}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.explain{border-radius:16px;padding:12px 14px;background:rgba(255,93,108,.12);border:2px solid rgba(255,93,108,.5);display:flex;flex-direction:column;gap:6px}
.explain .ans{font-size:18px;font-weight:800}
.explain .ans em{font-style:normal;color:var(--good)}
.bottombar{display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--plate);margin:0 10px;border-top:1px solid var(--line)}
.dk{flex:1;min-width:0;border-radius:14px;padding:5px 2px;background:var(--plate2);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;min-height:60px}
.dk .de{font-size:24px;line-height:1.2}
.dk b{font-size:11px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk .mu{font-size:10px;font-weight:800}
.dk.active{border-color:var(--c);background:color-mix(in srgb,var(--c) 25%,var(--plate2))}
.spbtn{flex:1.3;border-radius:14px;font-family:var(--f-disp);font-size:16px;background:#3a3f5e;color:#8f95b6;line-height:1.2;padding:4px}
.spbtn.ready{background:linear-gradient(135deg,var(--gold),#ff8a3d);color:#2a1600;animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 18px var(--gold)}}
.cutin{position:absolute;inset:0;z-index:40;display:flex;align-items:center;pointer-events:none;background:rgba(5,8,25,.55);animation:fadeio 1.5s ease forwards}
.cutin .band{width:100%;padding:18px 20px;background:linear-gradient(100deg,color-mix(in srgb,var(--c) 90%,#000),color-mix(in srgb,var(--c) 55%,#000));display:flex;align-items:center;gap:14px;animation:slide 1.5s cubic-bezier(.2,.9,.2,1) forwards;border-block:3px solid var(--gold)}
.cutin .band .ce3{font-size:70px}
.cutin .band small{font-weight:800;letter-spacing:.2em;font-size:12px}
.cutin .band b{display:block;font-family:var(--f-disp);font-size:30px;line-height:1.2}
@keyframes slide{0%{transform:translateX(-110%)}20%{transform:translateX(0)}80%{transform:translateX(0)}100%{transform:translateX(110%)}}
@keyframes fadeio{0%,100%{opacity:0}15%,85%{opacity:1}}
.toastzone{position:fixed;left:0;right:0;top:calc(62px + env(safe-area-inset-top,0px));z-index:100;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}

/* ===== カードフレーム（デザイン画像準拠）。--u で全体を拡大縮小 ===== */
.tc{--u:16px;font-size:var(--u);width:16em;max-width:100%;border-radius:.9em;padding:.28em;position:relative;display:flex;flex-direction:column;gap:.3em;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 30%,#070a1c),#070a1c 55%);
  border:.14em solid color-mix(in srgb,var(--c) 85%,#fff);
  box-shadow:0 0 .7em color-mix(in srgb,var(--c) 70%,transparent),inset 0 0 .6em color-mix(in srgb,var(--c) 40%,transparent);text-align:left}
.tc.ev{border-color:var(--gold);box-shadow:0 0 .9em var(--gold),inset 0 0 .6em rgba(255,200,61,.5)}
.tc-art{position:relative;border-radius:.62em;overflow:hidden;aspect-ratio:300/382;background:#0a0f28;border:.08em solid color-mix(in srgb,var(--c) 60%,transparent)}
.tc.wide .tc-art{aspect-ratio:230/188}
.tc-art>img{width:100%;height:100%;object-fit:cover;display:block}
.tc-fb{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c) 55%,#0a0f28),#0a0f28 75%)}
.tc-fb img{position:absolute;inset:-10%;width:120%;height:120%;object-fit:cover;filter:blur(.35em) brightness(.45) saturate(1.2)}
.tc-fb .emo{position:relative;font-size:5.4em;line-height:1;filter:drop-shadow(0 0 .15em color-mix(in srgb,var(--c) 80%,#fff))}
.tc-badge{position:absolute;top:.35em;left:.35em;width:2.2em;height:2.2em;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-size:1em;color:#fff;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,#fff),color-mix(in srgb,var(--c) 70%,#000));border:.12em solid color-mix(in srgb,var(--c) 40%,#fff);box-shadow:0 0 .4em color-mix(in srgb,var(--c) 70%,transparent)}
.tc-tag{position:absolute;top:.35em;right:.35em;font-family:var(--f-disp);font-style:italic;font-size:.95em;padding:.05em .55em;border-radius:.4em;color:var(--gold);background:rgba(5,8,25,.75);border:.08em solid rgba(255,200,61,.6)}
.tc-name{position:absolute;left:0;right:0;bottom:0;padding:.9em .5em .35em;text-align:center;font-family:var(--f-disp);font-size:1.12em;line-height:1.15;color:#fff;text-shadow:0 .08em .2em #000;
  background:linear-gradient(0deg,rgba(5,8,25,.92) 35%,transparent)}
.tc-name::before{content:"✦";display:block;font-size:.6em;color:var(--gold);margin-bottom:.1em}
.tc-lv{position:absolute;left:.4em;bottom:.4em;font-size:.72em;font-weight:800;padding:.1em .5em;border-radius:99px;background:rgba(5,8,25,.8);color:#fff;z-index:2}
.tc-ev{position:absolute;right:.4em;bottom:.4em;font-size:.72em;font-weight:800;padding:.1em .5em;border-radius:99px;background:var(--gold);color:#2a1a00;z-index:2}
.tc-rib{position:relative;margin:0 .3em;display:flex;justify-content:center;align-items:center;gap:.8em;padding:.22em .5em;font-weight:800;color:#fff;
  background:linear-gradient(90deg,color-mix(in srgb,var(--c) 45%,#000),color-mix(in srgb,var(--c) 80%,#000) 50%,color-mix(in srgb,var(--c) 45%,#000));
  clip-path:polygon(.7em 0,calc(100% - .7em) 0,100% 50%,calc(100% - .7em) 100%,.7em 100%,0 50%);border-block:.06em solid color-mix(in srgb,var(--c) 60%,#fff)}
.tc-rib span{font-size:.72em;opacity:.9}

.tc-desc{margin:0;padding:0 .5em;text-align:center;font-size:.78em;line-height:1.45;color:#e8e9ff;min-height:2.9em;display:flex;align-items:center;justify-content:center}
.tc-stats{display:grid;grid-template-columns:1fr 1fr;gap:.3em}

.unit2 b{font-size:17px}
.unit2 .stars3{font-size:18px}
/* デッキ */
.pickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:start}
.pick{position:relative;padding:0;border-radius:12px}
.pick .tc{width:100%}
.pick.on{outline:3px solid var(--gold);outline-offset:2px}
.pickmark{position:absolute;top:-6px;right:-6px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#2a1600;font-weight:800;font-size:17px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.rlv{font-style:normal;font-weight:800;font-size:.72em;background:rgba(5,8,25,.75);color:var(--gold);border-radius:99px;padding:.05em .55em;white-space:nowrap}
.tc.sm .tc-rib{gap:.4em}
/* ===== オープニング ===== */
.opening{position:fixed;inset:0;z-index:200;background:#03050f;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;transition:opacity .6s ease}
.opening.out{opacity:0;pointer-events:none}
.op-bg{position:absolute;inset:-10%;filter:blur(24px) brightness(.45) saturate(1.3)}
.op-b{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s ease-in-out}
.op-b.on{opacity:1}
.op-stage{position:relative;width:min(calc(100*var(--vw)),560px);aspect-ratio:358/355}
.op-stage{overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(180deg,transparent,#000 8%,#000 92%,transparent)}
.op-f{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s cubic-bezier(.4,0,.2,1);will-change:opacity,transform}
.op-f.on{opacity:1}
.op-f.shown.kb0{animation:kb0 2.6s ease-out forwards}
.op-f.shown.kb1{animation:kb1 2.6s ease-out forwards}
.op-f.shown.kb2{animation:kb2 2.6s ease-out forwards}
.op-f.shown.kb3{animation:kb3 2.6s ease-out forwards}
@keyframes kb0{from{transform:scale(1.14)}to{transform:scale(1.02)}}
@keyframes kb1{from{transform:scale(1.1) translateX(-3%)}to{transform:scale(1.1) translateX(3%)}}
@keyframes kb2{from{transform:scale(1.02)}to{transform:scale(1.14)}}
@keyframes kb3{from{transform:scale(1.1) translate(3%,2%)}to{transform:scale(1.1) translate(-3%,-1%)}}
.opening.final .op-f.on:last-child{animation:opzoom 1.6s cubic-bezier(.2,.9,.3,1) both;transition-duration:.3s}
@keyframes opzoom{0%{transform:scale(1.25);filter:brightness(2.2)}100%{transform:scale(1);filter:none}}
.op-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.opening.final .op-flash{animation:opflash .9s ease-out}
@keyframes opflash{0%{opacity:.7}100%{opacity:0}}
.op-skip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:2;padding:8px 14px;border-radius:99px;background:rgba(0,0,0,.5);color:#fff;font-weight:800;font-size:14px;border:1px solid rgba(255,255,255,.3)}
.opening.final .op-skip{display:none}
.op-tap{position:absolute;bottom:calc(60px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-family:var(--f-disp);font-size:24px;color:#fff;text-shadow:0 0 12px var(--gold),0 2px 0 #000;opacity:0;letter-spacing:.08em}
.opening.final .op-tap{animation:blink 1.4s ease-in-out .9s infinite}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.op-start{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,rgba(3,5,15,.85),rgba(3,5,15,.2) 55%,rgba(3,5,15,.35));color:#fff}
.opening:not(.gate) .op-start{display:none}
.opening.gate .op-skip,.opening.gate .op-tap{display:none}
.opening.gate .op-f:last-child{opacity:1;transform:none;filter:brightness(.8)}
.op-play{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:34px;padding-left:6px;background:linear-gradient(135deg,var(--gold),#ff8a3d);color:#2a1600;box-shadow:0 0 30px var(--gold);animation:glow 1s ease-in-out infinite alternate;margin-bottom:8px}
.op-start b{font-family:var(--f-disp);font-weight:400;font-size:24px;letter-spacing:.06em;text-shadow:0 2px 0 #000}
.op-start small{font-weight:800;opacity:.8}

/* ===== v4：大きな対戦ステージ ===== */
.bscreen .btop{padding:6px 12px 4px}
.arena2{position:relative;height:clamp(250px,calc(42*var(--vh)),380px);margin:0 10px;border-radius:22px;overflow:hidden;border:2px solid color-mix(in srgb,var(--c) 70%,#fff);box-shadow:0 0 24px color-mix(in srgb,var(--c) 50%,transparent),inset 0 0 60px rgba(0,0,0,.6);background:#05071a;flex:none}
.a-bg{position:absolute;inset:-12%}
.a-bg img{width:100%;height:100%;object-fit:cover;filter:blur(10px) brightness(.38) saturate(1.4);transform:scale(1.1)}
.a-lines{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 70% 30%,rgba(255,255,255,.07) 0 2deg,transparent 2deg 9deg);mix-blend-mode:screen;animation:spin 30s linear infinite;opacity:.8}
@keyframes spin{to{transform:rotate(360deg)}}
.a-split{position:absolute;inset:0;background:linear-gradient(135deg,transparent 49.4%,rgba(255,255,255,.55) 49.6%,rgba(255,255,255,.55) 50%,transparent 50.2%);filter:drop-shadow(0 0 6px #fff)}
/* 敵 */
.a-enemy{position:absolute;right:-2%;top:6%;width:62%;height:70%;display:grid;place-items:center;z-index:2}
.a-enemy img{width:100%;height:100%;object-fit:cover;object-position:60% 25%;-webkit-mask-image:radial-gradient(ellipse 70% 70% at 55% 45%,#000 55%,transparent 75%);mask-image:radial-gradient(ellipse 70% 70% at 55% 45%,#000 55%,transparent 75%);filter:drop-shadow(0 0 18px var(--c))}
.eemo{font-size:clamp(110px,calc(24*var(--vh)),170px);line-height:1;filter:drop-shadow(0 0 24px var(--c)) drop-shadow(0 10px 10px rgba(0,0,0,.6));animation:float 2.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) scale(1.03)}}
.a-enemy.hitme{animation:ehit .55s ease}
@keyframes ehit{0%{filter:none}15%{transform:translate(14px,-6px) rotate(4deg);filter:brightness(3) saturate(0)}35%{transform:translate(-10px,4px)}55%{transform:translate(6px,0)}100%{transform:none;filter:none}}
.a-enemy.strike{animation:estrike .5s ease}
@keyframes estrike{40%{transform:translate(-30%,25%) scale(1.15)}}
/* 味方 */
.a-player{position:absolute;left:-3%;bottom:-2%;width:58%;height:78%;z-index:3;display:grid;place-items:end center}
.a-player img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;-webkit-mask-image:radial-gradient(ellipse 62% 70% at 50% 42%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 62% 70% at 50% 42%,#000 55%,transparent 100%)}
.a-player::before{content:"";position:absolute;inset:12% 10% 0;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--pc) 55%,transparent),transparent 70%);filter:blur(8px)}
.a-player>*{position:relative}
.pemo{font-size:clamp(100px,calc(22*var(--vh)),150px);line-height:1;filter:drop-shadow(0 0 24px var(--pc));margin-bottom:12%}
.a-player.dash{animation:pdash .6s cubic-bezier(.3,1.4,.5,1)}
@keyframes pdash{35%{transform:translate(28%,-18%) scale(1.12)}100%{transform:none}}
.a-player.hurt{animation:phurt .5s ease}
@keyframes phurt{25%{transform:translate(-8px,6px);filter:brightness(2) sepia(1) hue-rotate(-50deg) saturate(4)}50%{transform:translate(6px,-2px)}}
.a-player.enter{animation:penter .5s cubic-bezier(.2,1.3,.5,1)}
@keyframes penter{from{transform:translateX(-60%);opacity:0}}
.a-vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg);z-index:4;font-family:var(--f-disp);font-size:34px;color:#fff;-webkit-text-stroke:2px #000;text-shadow:0 0 14px var(--gold),3px 3px 0 #000;pointer-events:none}
/* HP */
.ahp{position:absolute;z-index:5;width:52%;display:flex;flex-direction:column;gap:3px}
.ehp{top:0;right:0;width:100%;padding:10px 10px 22px;align-items:flex-end;background:linear-gradient(180deg,rgba(3,5,15,.8),transparent)}
.ehp .ahp-bar{width:55%}
.ehp .ahp-n{width:auto}
.php{left:0;bottom:0;width:100%;padding:22px 10px 10px;background:linear-gradient(0deg,rgba(3,5,15,.85),transparent)}
.php .ahp-bar{width:55%}
.ahp-n{display:flex;gap:8px;align-items:baseline;width:100%;font-size:12px;text-shadow:0 1px 3px #000}
.ehp .ahp-n{justify-content:flex-end}
.ahp-n b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ahp-n span{font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold);flex:none}
.ahp-bar{width:100%;height:12px;background:rgba(0,0,0,.6);border:1.5px solid rgba(255,255,255,.7);transform:skewX(-20deg);overflow:hidden;box-shadow:0 0 8px rgba(0,0,0,.6)}
.ahp-bar i{display:block;height:100%;transition:width .5s ease;background:linear-gradient(180deg,#ff8a95,#e8203a)}
.php .ahp-bar i{background:linear-gradient(180deg,#7dffb5,#14b85c)}
.php.low .ahp-bar i{background:linear-gradient(180deg,#ffd27d,#ff5d2b);animation:blink 0.8s infinite}
/* 攻撃エフェクト */
.shakeA{animation:shk .4s ease}
.shakeA.big{animation:shk2 .55s ease}
.shakeB{animation:shk .45s ease .1s}
@keyframes shk{20%{transform:translate(6px,-4px)}40%{transform:translate(-5px,3px)}60%{transform:translate(3px,-2px)}80%{transform:translate(-2px,1px)}}
@keyframes shk2{15%{transform:translate(10px,-6px) scale(1.02)}30%{transform:translate(-9px,5px)}45%{transform:translate(7px,-3px)}60%{transform:translate(-4px,2px)}}
.a-slash{position:absolute;z-index:6;right:8%;top:14%;width:62%;height:6px;border-radius:6px;background:linear-gradient(90deg,transparent,#fff,var(--pc),transparent);box-shadow:0 0 18px var(--pc),0 0 40px #fff;transform:rotate(-35deg) scaleX(0);transform-origin:left;animation:slash .45s ease-out .12s forwards;pointer-events:none}
.a-slash.x::after{content:"";position:absolute;inset:0;background:inherit;box-shadow:inherit;transform:rotate(70deg)}
@keyframes slash{0%{transform:rotate(-35deg) translate(-10%,40px) scaleX(0);opacity:1}60%{transform:rotate(-35deg) translate(0,40px) scaleX(1);opacity:1}100%{transform:rotate(-35deg) translate(10%,40px) scaleX(1);opacity:0}}
.a-flash{position:absolute;inset:0;z-index:7;background:radial-gradient(circle at 68% 38%,#fff,transparent 60%);opacity:0;animation:aflash .5s ease .15s;pointer-events:none}
@keyframes aflash{20%{opacity:.85}100%{opacity:0}}
.a-dmg{position:absolute;z-index:8;right:12%;top:22%;font-family:var(--f-disp);font-size:58px;line-height:1;color:#fff;-webkit-text-stroke:2px #8a0f22;text-shadow:0 4px 0 #8a0f22,0 0 24px rgba(255,80,100,.9);animation:dmgpop 1.1s cubic-bezier(.2,1.6,.4,1) forwards;pointer-events:none;text-align:center}
.a-dmg small{display:block;font-size:18px;color:var(--gold);-webkit-text-stroke:0;text-shadow:0 2px 0 #000}
.a-dmg.mine{right:auto;left:16%;top:auto;bottom:30%;font-size:44px;color:#ffd3d8}
@keyframes dmgpop{0%{transform:scale(.2);opacity:0}25%{transform:scale(1.25);opacity:1}45%{transform:scale(1)}80%{opacity:1}100%{transform:translateY(-24px);opacity:0}}
.a-good{position:absolute;z-index:8;left:5%;top:18%;font-family:var(--f-disp);font-size:30px;color:var(--good);-webkit-text-stroke:1.5px #053;text-shadow:0 3px 0 #053;animation:goodpop .9s ease forwards;pointer-events:none}
@keyframes goodpop{0%{opacity:0;transform:rotate(-8deg) scale(.4)}25%{opacity:1;transform:rotate(-8deg) scale(1.15)}80%{opacity:1;transform:rotate(-8deg) scale(1)}100%{opacity:0;transform:rotate(-8deg) translateY(-10px)}}
.a-rel{position:absolute;z-index:8;left:50%;bottom:26%;transform:translateX(-50%);white-space:nowrap;font-weight:800;font-size:13px;padding:3px 12px;border-radius:99px;background:rgba(0,0,0,.65);animation:fadein .3s ease;pointer-events:none}
.a-rel.up{color:var(--good)} .a-rel.down{color:#ff9aa4}
.a-claw{position:absolute;z-index:6;left:8%;bottom:16%;width:46%;height:46%;background:repeating-linear-gradient(115deg,transparent 0 18px,rgba(255,60,80,.95) 18px 22px,transparent 22px 36px);-webkit-mask-image:radial-gradient(circle,#000 40%,transparent 70%);mask-image:radial-gradient(circle,#000 40%,transparent 70%);opacity:0;animation:claw .5s ease .15s;pointer-events:none}
@keyframes claw{30%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(1.1)}}
.a-red{position:absolute;inset:0;z-index:7;box-shadow:inset 0 0 70px rgba(255,30,50,.85);opacity:0;animation:aflash .6s ease .15s;pointer-events:none}
/* 必殺技カットイン（大） */
.cutin2{position:absolute;inset:0;z-index:40;overflow:hidden;pointer-events:none;background:rgba(3,5,15,.7);animation:fadeio 1.5s ease forwards}
.ci-lines{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg at 50% 50%,color-mix(in srgb,var(--c) 70%,#fff) 0 1.5deg,transparent 1.5deg 7deg);opacity:.35;animation:spin 3s linear infinite}
.ci-art{position:absolute;left:0;right:0;top:12%;height:58%;width:100%;object-fit:cover;object-position:50% 15%;border-block:4px solid var(--gold);box-shadow:0 0 40px var(--c);animation:ciart 1.5s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes ciart{0%{transform:translateX(-100%) skewX(-10deg)}18%{transform:translateX(0) skewX(-10deg)}80%{transform:translateX(3%) skewX(-10deg) scale(1.04)}100%{transform:translateX(110%) skewX(-10deg)}}
.ci-emo{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:160px;animation:pop2 .5s ease both}
.ci-text{position:absolute;left:0;right:0;bottom:12%;text-align:center;color:#fff;animation:pop2 .5s ease .15s both}
.ci-text small{display:block;font-weight:800;letter-spacing:.3em;font-size:12px;color:var(--gold)}
.ci-text b{display:block;font-family:var(--f-disp);font-size:36px;line-height:1.2;-webkit-text-stroke:1.5px #000;text-shadow:0 0 18px var(--c),3px 3px 0 #000}
.ci-text span{font-weight:800}
.bscreen .qbox{margin-top:8px}
.bscreen .statusline{padding:8px 12px 0}
.choice{min-height:56px}

/* ===== v5：ガチャ風まなびBOX ===== */
.gacha{--gl:#cfd6ff;position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;overflow:hidden;
  background:radial-gradient(ellipse at 50% 55%,color-mix(in srgb,var(--gl) 22%,#0b1030),#04061a 70%)}
.gacha.g-N{--gl:#dfe4ff} .gacha.g-R{--gl:#4fb4ff} .gacha.g-SR{--gl:#ffcf4a} .gacha.g-SSR{--gl:#ff7ad9}
.gc-top{width:100%;display:flex;align-items:center;gap:10px;padding:10px 16px;z-index:3}
.gc-top b{flex:1;font-family:var(--f-disp);font-weight:400;font-size:20px}
.gc-circle{position:absolute;left:50%;top:44%;width:min(calc(92*var(--vw)),420px);aspect-ratio:1;transform:translate(-50%,-50%);z-index:0}
.gc-ring{position:absolute;border-radius:50%;border:2px solid color-mix(in srgb,var(--gl) 70%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--gl) 50%,transparent),inset 0 0 18px color-mix(in srgb,var(--gl) 30%,transparent)}
.gc-ring.r1{inset:0;border-style:dashed;animation:spin 24s linear infinite}
.gc-ring.r2{inset:12%;border-width:3px;background:repeating-conic-gradient(color-mix(in srgb,var(--gl) 40%,transparent) 0 3deg,transparent 3deg 15deg);-webkit-mask-image:radial-gradient(circle,transparent 62%,#000 63%,#000 70%,transparent 71%);mask-image:radial-gradient(circle,transparent 62%,#000 63%,#000 70%,transparent 71%);animation:spin 14s linear infinite reverse}
.gc-ring.r3{inset:28%;border-style:dotted;animation:spin 9s linear infinite}
.gc-circle.fast .gc-ring{animation-duration:1.4s}
.gc-god{position:absolute;font-size:30px;filter:drop-shadow(0 0 10px var(--gl))}
.gc-god.n{top:-2%;left:50%;transform:translateX(-50%)} .gc-god.s{bottom:-2%;left:50%;transform:translateX(-50%)}
.gc-god.e{right:-2%;top:50%;transform:translateY(-50%)} .gc-god.w{left:-2%;top:50%;transform:translateY(-50%)}
.gc-back{position:absolute;left:50%;top:44%;width:min(calc(44*var(--vw)),190px);aspect-ratio:188/252;transform:translate(-50%,-50%);z-index:2;border-radius:12px;overflow:hidden;border:2px solid #c9a24a;box-shadow:0 0 30px var(--gl)}
.gc-back img{width:100%;height:100%;object-fit:cover;display:block}
.gc-back.float{animation:gfloat 2.4s ease-in-out infinite}
@keyframes gfloat{50%{transform:translate(-50%,-54%) rotate(1.5deg)}}
.gacha:not(.idle) .gc-back.float{animation:gshake .25s linear infinite}
@keyframes gshake{0%,100%{transform:translate(-50%,-50%) rotate(-2deg)}50%{transform:translate(-50%,-51%) rotate(2deg)}}
.gc-pillar{position:absolute;left:50%;top:0;bottom:0;width:46%;transform:translateX(-50%);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--gl) 80%,#fff),#fff,color-mix(in srgb,var(--gl) 80%,#fff),transparent);opacity:.0;filter:blur(6px);animation:pillar 2.1s ease-in forwards;z-index:1}
@keyframes pillar{0%{opacity:0;transform:translateX(-50%) scaleX(.1)}60%{opacity:.6}100%{opacity:1;transform:translateX(-50%) scaleX(1.6)}}
.gacha.g-SSR .gc-pillar{background:linear-gradient(90deg,transparent,#ff5f5f,#ffd84a,#6bff8f,#5fd0ff,#c77dff,transparent)}
.gc-msg{position:absolute;bottom:22%;font-family:var(--f-disp);font-size:24px;color:#fff;text-shadow:0 0 12px var(--gl);animation:blink 1s infinite;z-index:3}
.gc-skip{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:5;padding:8px 14px;border-radius:99px;background:rgba(0,0,0,.5);font-weight:800;font-size:14px;border:1px solid rgba(255,255,255,.3)}
.gc-info{position:absolute;bottom:136px;left:16px;right:16px;text-align:center;font-weight:800;font-size:14px;color:var(--mute);z-index:3}
.gc-info b{color:var(--gold)}
.gc-btns{position:absolute;bottom:62px;left:16px;right:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;z-index:3}
.gc-btn{display:flex;flex-direction:column;align-items:center;padding:12px 6px;border-radius:18px;font-family:var(--f-disp);color:#2a1600;box-shadow:0 5px 0 #8a5a00,0 0 20px rgba(255,190,60,.5);background:linear-gradient(180deg,#ffe07a,#ffad2b)}
.gc-btn.five{background:linear-gradient(180deg,#ffb3ec,#d65cff);color:#2a0030;box-shadow:0 5px 0 #6b1d86,0 0 20px rgba(214,92,255,.5)}
.gc-btn b{font-weight:400;font-size:19px;line-height:1.2}
.gc-btn small{font-family:var(--f-body);font-weight:800;font-size:12px;opacity:.8}
.gc-btn:active{transform:translateY(3px)}
.gc-btn:disabled{background:#3a3f5e;color:#8f95b6;box-shadow:none}
.gc-hint{position:absolute;bottom:166px;left:16px;right:16px;text-align:center;font-size:12px;font-weight:800;color:var(--mute);z-index:3}
.gc-link{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:3;color:var(--mute);font-weight:800;font-size:13px;text-decoration:underline;padding:6px}
/* 発表 */
.gc-burst{position:absolute;left:50%;top:42%;width:160vmax;height:160vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(color-mix(in srgb,var(--gl) 55%,transparent) 0 6deg,transparent 6deg 18deg);-webkit-mask-image:radial-gradient(circle,#000,transparent 55%);mask-image:radial-gradient(circle,#000,transparent 55%);animation:spin 12s linear infinite;z-index:0;opacity:.7}
.gacha.g-N .gc-burst{opacity:.25} .gacha.g-R .gc-burst{opacity:.4}
.gacha.g-SSR .gc-burst{background:repeating-conic-gradient(#ff5f5f 0 6deg,transparent 6deg 12deg,#ffd84a 12deg 18deg,transparent 18deg 24deg,#5fd0ff 24deg 30deg,transparent 30deg 36deg,#c77dff 36deg 42deg,transparent 42deg 48deg)}
.revealing::after{content:"";position:absolute;inset:0;background:#fff;z-index:10;pointer-events:none;animation:wflash .7s ease forwards}
@keyframes wflash{0%{opacity:1}100%{opacity:0}}
.gc-count{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;z-index:4;font-weight:800;color:var(--mute)}
.gc-flip{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:min(calc(60*var(--vw)),250px);z-index:3;perspective:1200px}
.gc-inner{position:relative;transform-style:preserve-3d;animation:flip 1s cubic-bezier(.3,1.3,.5,1) .2s both}
@keyframes flip{0%{transform:rotateY(180deg) scale(.7)}100%{transform:rotateY(0) scale(1)}}
.gc-face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.gc-backface{position:absolute;inset:0;transform:rotateY(180deg);border-radius:14px;overflow:hidden}
.gc-backface img{width:100%;height:100%;object-fit:cover}
.gc-front .tc{width:100%;--u:clamp(12px,calc(3.8*var(--vw)),15.6px)}

// 相性：攻撃側 → 有利な相手（設計書12章）
const ADV = { math:'social', social:'science', science:'japanese', japanese:'math' };
function matchup(att, def){
  if (att === 'all') return 1.1;   // 四神の絆：どの相手にも少し有利
  if (def === 'all') return 1.0;
  if (ADV[att] === def) return 1.25;
  if (ADV[def] === att) return 0.85;
  return 1.0;
}

  try {
    const raw = localStorage.getItem(SAVE_KEY);

}
function readBackup(code){
  code = String(code || '').replace(/\s+/g, '');
  if (code.indexOf(BK_PREFIX) !== 0) throw new Error('form');
  const body = code.slice(BK_PREFIX.length), dot = body.lastIndexOf('.');
  const json = decodeURIComponent(escape(atob(body.slice(0, dot))));
  let sum = 0; for (let i = 0; i < json.length; i++) sum = (sum * 31 + json.charCodeAt(i)) >>> 0;
  if (sum.toString(36) !== body.slice(dot + 1)) throw new Error('sum');
  const d = JSON.parse(json); if (!d || !d.cards) throw new Error('data');

}

}

const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ruby = t => esc(t).replace(/\{([^|}]+)\|([^}]+)\}/g, '<ruby>$1<rt>$2</rt></ruby>');
const plain = t => String(t).replace(/\{([^|}]+)\|([^}]+)\}/g, '$1');
const shuffle = a => { const b = a.slice(); for (let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const stars = r => '★'.repeat(r);
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const cardDef = id => CARDS.find(c => c.id === id);
const owned = id => !!S.cards[id];

function stats(id){
  const d = cardDef(id), st = S.cards[id] || {lv:1,exp:0,ev:false};
  const cap = st.ev ? 20 : 10;
  return {
    ...d, lv:st.lv, exp:st.exp, ev:st.ev, cap,
    maxHP: d.hp + (st.lv-1)*12 + (st.ev?40:0),
    atkV:  d.atk + (st.lv-1)*4 + (st.ev?15:0),
    spV:   d.sp + (st.lv-1)*2 + (st.ev?20:0),
    next:  30 + st.lv*15,
    title: (st.ev ? '覚醒・' : '') + d.name
  };
}
const playerLv = () => Math.floor(S.pexp/100) + 1;

// ---------- 効果音（WebAudio。最初のタップ後に鳴る） ----------
let actx = null;
function sfx(kind){
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const seq = {
      ok:[[660,.08],[880,.12]], ng:[[220,.18],[180,.2]], hit:[[300,.05],[500,.08]],
      sp:[[523,.08],[659,.08],[784,.08],[1047,.22]], win:[[523,.12],[659,.12],[784,.12],[1047,.35]],
      box:[[392,.1],[523,.1],[784,.25]], tap:[[700,.03]], charge:[[220,.25],[262,.25],[330,.25],[392,.25],[440,.3]], up:[[660,.08],[880,.08],[1175,.25]], ssr:[[523,.1],[659,.1],[784,.1],[1047,.1],[1319,.12],[1568,.5]]
    }[kind] || [];
    let t = actx.currentTime;
    seq.forEach(([f,d]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = kind==='ng' ? 'sawtooth' : 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+.02); t += d*.9;
    });
  } catch(e){}
}

// ---------- トースト ----------
function toast(msg){
  let z = document.querySelector('.toastzone');
  if (!z){ z = document.createElement('div'); z.className='toastzone'; document.body.appendChild(z); }
  const t = document.createElement('div'); t.className='toast'; t.textContent = msg; z.appendChild(t);
  setTimeout(() => t.remove(), 2700);
}

// ---------- 成長処理 ----------
function addTickets(n, why){ S.tickets += n; toast('🎫 まなびBOXチケット +' + n + (why ? '（' + why + '）' : '')); }
function addPlayerExp(n){
  const before = playerLv();
  S.pexp += n;
  const after = playerLv();
  if (after > before){ const bonus = (after-before)*30; S.coins += bonus; toast('⭐ プレイヤーLv.' + after + ' に アップ！ 🪙+' + bonus); }
}
function addCardExp(id, n){
  const st = S.cards[id]; if (!st) return {gained:0, from:0, to:0};
  const from = st.lv; let gained = 0;
  const cap = () => st.ev ? 20 : 10;
  if (st.lv >= cap()) return {gained:0, from, to:from, max:true};
  st.exp += n; gained = n;
  while (st.lv < cap() && st.exp >= 30 + st.lv*15){ st.exp -= 30 + st.lv*15; st.lv++; }
  if (st.lv >= cap()) st.exp = 0;
  return {gained, from, to:st.lv};
}

let curStreak = 0;
function today(){ const d = new Date(); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); }
function daily(){
  if (!S.daily || S.daily.date !== today()) S.daily = {date:today(), study:0, wins:0, streak:0, over:0, claimed:{}};
  return S.daily;
}
const MISSIONS = [
  {id:'study',  key:'study',  goal:10, icon:'📜', label:'今日の学習 10問',          reward:{tickets:1}, rtxt:'🎫 1'},
  {id:'win',    key:'wins',   goal:1,  icon:'⚔️', label:'バトルに 1回 勝つ',        reward:{coins:30},  rtxt:'🪙 30'},
  {id:'streak', key:'streak', goal:5,  icon:'🔥', label:'5問 れんぞく正解',          reward:{coins:20},  rtxt:'🪙 20'},
  {id:'over',   key:'over',   goal:1,  icon:'📝', label:'まちがいノートで 1問 こくふく', reward:{coins:20},  rtxt:'🪙 20'}
];
const missionReady = () => MISSIONS.filter(m => !daily().claimed[m.id] && daily()[m.key] >= m.goal).length;
function claimMission(id){
  const m = MISSIONS.find(x => x.id === id), d = daily();
  if (!m || d.claimed[id] || d[m.key] < m.goal) return;
  d.claimed[id] = true;
  if (m.reward.tickets) S.tickets += m.reward.tickets;
  if (m.reward.coins) S.coins += m.reward.coins;
  sfx('box'); toast('🎉 ミッション達成！ ' + m.rtxt + ' ゲット'); persist(); render();
}
function vMission(){
  const d = daily();
  let h = top('ミッション') + '<main class="scroll"><p class="lead">今日の ミッション <small class="muted" style="font-size:13px">（毎日 新しくなるよ）</small></p>';
  MISSIONS.forEach(m => {
    const v = Math.min(d[m.key], m.goal), done = d[m.key] >= m.goal, got = d.claimed[m.id];
    h += '<div class="mis' + (got ? ' got' : done ? ' ready' : '') + '"><span class="mis-i">' + m.icon + '</span><div class="grow"><b>' + m.label + '</b><div class="bar"><i style="width:' + pct(v, m.goal) + '%"></i></div><small>' + v + ' / ' + m.goal + '</small></div>' +
      (got ? '<span class="mis-got">うけとりずみ</span>' : '<button class="mis-btn" data-act="claim" data-id="' + m.id + '"' + (done ? '' : ' disabled') + '><small>ほうしゅう</small>' + m.rtxt + '</button>') + '</div>';
  });
  return h + '<p class="muted" style="margin:0;font-size:13px">チケットや コインは 勉強と バトルで もらえるよ（お金は かかりません）。</p></main>';
}
function dayRec(){ const k = dayKey(); S.days = S.days || {}; return S.days[k] || (S.days[k] = {q:0, c:0, sec:0}); }
function recordAnswer(q, ok){
  const dr = dayRec(); dr.q++; if (ok) dr.c++;
  const dd = daily(); dd.study++;
  curStreak = ok ? curStreak + 1 : 0; dd.streak = Math.max(dd.streak, curStreak);
  S.study++; if (ok) S.right++;
  const uk = q.s + ':' + q.unit;
  const u = S.units[uk] || (S.units[uk] = {a:0,c:0}); u.a++; if (ok) u.c++;
  const sj = S.subj[q.s] || (S.subj[q.s] = {a:0,c:0}); sj.a++; if (ok) sj.c++;
  if (!ok){ const m = S.mistakes[q.id] || (S.mistakes[q.id] = {n:0}); m.n++; }
  if (S.study % 10 === 0) addTickets(1, '学習' + S.study + '問');
}
function subjectCardFor(s){
  const inDeck = S.deck.find(id => cardDef(id).s === s);
  if (inDeck) return inDeck;
  const mine = Object.keys(S.cards).map(Number).filter(id => cardDef(id).s === s);
  mine.sort((a,b) => stats(b).lv - stats(a).lv || cardDef(b).r - cardDef(a).r);
  return mine[0] || null;
}

function dayKey(){ const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth()+1) * 100 + d.getDate(); }
function dailyStage(){
  const k = dayKey(), n = Math.min(S.cleared.length, 12);
  const s = SUBJ_KEYS[k % 4], mon = ['slime','goblin','bat','mori','raijin','samurai'][Math.floor(k / 4) % 6];
  const nm = {slime:'スライム', goblin:'ゴブリン', bat:'コウモリ', mori:'もりのようせい', raijin:'いなずまウサギ', samurai:'サムライゴブリン'}[mon];
  return {id:'daily', code:'今日', title:'今日のバトル', type:'elite', s, reward:60, daily:true,
    enemy:{name:'きょうの ' + nm, e:'⭐', mon, hue:(k * 37) % 360, hp:160 + 40 * n, atk:8 + n}};
}
function makeStage(id, hard){
  const base = id === 'daily' ? dailyStage() : STAGES.find(x => x.id === id);
  const st = Object.assign({}, base, {enemy:Object.assign({}, base.enemy)});
  if (hard){ st.hard = true; st.enemy.hp = Math.round(st.enemy.hp * 1.5); st.enemy.atk = Math.round(st.enemy.atk * 1.3); st.reward = Math.round(st.reward * 1.5); }
  return st;
}

function vStage(p){
  const st = makeStage(p.id, p.hard);
  const s = st.s, best = Object.keys(ADV).find(k => ADV[k] === s);
  const boss = st.type === 'boss';
  const canHard = !st.daily && S.cleared.includes(st.id);
  const tip = s === 'all' ? '💡 いろいろな きょうかの 問題が 出るよ！ 正解を つづけて 必殺技を ねらおう' : '💡 <b>' + SUBJ[best].g + '</b>（' + SUBJ_KANA[best] + '）の カードが つよいよ！';
  return top(st.code + ' ' + st.title) + '<main class="scroll">' +
    (canHard ? '<div class="hardsel"><button data-act="stagehard" data-h="0" aria-pressed="' + !p.hard + '">ふつう</button><button data-act="stagehard" data-h="1" aria-pressed="' + !!p.hard + '">👑 むずかしい' + (hardCleared(st.id) ? ' ✓' : '') + '</button></div>' : '') +
    '<div class="foe2 s-' + s + (st.hard ? ' hard' : '') + '">' + (boss ? '<div class="foeart">' + bossArt(s) + '</div>' : st.enemy.mon ? '<div class="foemon' + (st.type === 'elite' ? ' elite' : '') + '"><img src="' + monImg(st.enemy) + '" alt=""' + monStyle(st.enemy) + '>' + (st.type === 'elite' ? '<span class="elitetag">つよい てき</span>' : '') + '</div>' : '<div class="foeemo">' + st.enemy.e + '</div>') +
      '<b>' + esc(st.enemy.name) + '</b><div class="foestat"><span>❤️ ' + st.enemy.hp + '</span><span>' + SUBJ[s].e + ' ' + SUBJ_KANA[s] + '</span><span style="color:var(--gold)">🪙 ' + st.reward + '</span></div></div>' +
    '<div class="tip s-' + (best || 'all') + '">' + tip + '</div>' + (st.hard ? '<div class="tip s-japanese">👑 むずかしい：敵が つよく、問題も むずかしい。ほうしゅう 1.5倍！</div>' : '') +
    '<div class="row"><b class="grow" style="font-size:17px">つれていく なかま</b><button class="sub-btn" data-act="go" data-v="deck">かえる</button></div>' +
    '<div class="team">' + S.deck.map(id => { const c = stats(id), m = matchup(c.s, s);
      return '<div class="mate">' + artBox(id, 'mateart') + '<b>' + esc(c.name) + '</b><span class="' + (m > 1 ? 'up' : m < 1 ? 'down' : '') + '">' + (m > 1 ? '▲ つよい' : m < 1 ? '▼ にがて' : 'ふつう') + '</span></div>'; }).join('') + '</div>' +
    '<button class="cta big" data-act="battle" data-id="' + st.id + '"' + (st.hard ? ' data-hard="1"' : '') + '>⚔️ たたかう！</button>' +
  '</main>';
}

// ---------- バトル ----------
let B = null;
function startBattle(id, hard){
  const st = makeStage(id, hard);
  const deck = S.deck.filter(owned).slice(0,3);
  const hpMax = Math.round(deck.reduce((a,c) => a + stats(c).maxHP, 0) / deck.length);
  B = { st, deck, active:0, hp:hpMax, hpMax, enemyHP:st.enemy.hp, enemyMax:st.enemy.hp,
        streak:0, best:0, gauge:0, queue:shuffle(qPool(st.s).map(q => q.id)), q:null, choices:[], picked:null,
        phase:'ask', n:0, correct:0, wrong:0, cardExp:{}, five:false, fx:null, buff:0, hidden:[], tray:false };
  // 最初のカードは相性のよいものを自動選択しない（子どもが自分で交代を学ぶ）
  nextQ();
  nav.stack.push({v:'battle'});
  render(true);
}
// 問題の出し方：手作り問題と自動生成問題をまぜる（算数は生成多め）
const GEN_RATE = {math:.6, japanese:.35, science:0, social:0};
function drawQ(s){
  if (s === 'all') s = pick(SUBJ_KEYS);
  const gens = GEN_BY_SUBJ[s] || [];
  if (gens.length && Math.random() < GEN_RATE[s]) return genQ(pick(gens), B && B.st && B.st.hard ? 3 : (S.diff || 2));
  return null;
}
function nextQ(){
  if (!B.queue.length) B.queue = shuffle(qPool(B.st.s).map(q => q.id));
  const g = (B.queue[0] && B.retry === B.queue[0]) ? null : drawQ(B.st.s);
  B.q = g || getQ(B.queue.shift());
  B.choices = shuffle(B.q.choices);
  B.picked = null; B.phase = 'ask'; B.n++; B.hidden = [];
}
// アイテム
function useItem(k){
  if (!B || B.phase !== 'ask' || !(S.items[k] > 0)) return;
  const c = stats(activeId());
  if (k === 'book'){
    if (B.hidden.length){ toast('この問題では もう 使ったよ'); return; }
    B.hidden = shuffle(B.choices.map((x,i) => i).filter(i => B.choices[i] !== B.q.answer)).slice(0,2);
    S.items[k]--; B.tray = false; sfx('box'); toast('📖 学習の書：答えを 2つに しぼった！'); persist(); render(); return;
  }
  if (k === 'potion'){
    if (B.hp >= B.hpMax){ toast('HPは まんたんだよ'); return; }
    const heal = Math.round(B.hpMax * .5); B.hp = Math.min(B.hpMax, B.hp + heal);
    S.items[k]--; B.tray = false; sfx('ok'); toast('🧪 癒しの薬：HPが ' + heal + ' 回復！'); persist(); render(); return;
  }
  if (k === 'blessing'){
    B.buff = 3; S.items[k]--; B.tray = false; sfx('sp'); toast('🌀 四神の加護：つぎの 3回 こうげき 1.5倍！'); persist(); render(); return;
  }
  if (k === 'fire'){
    S.items[k]--; B.tray = false; persist();
    const dmg = Math.round(c.atkV * 2 * matchup(c.s, B.st.s));
    B.enemyHP = Math.max(0, B.enemyHP - dmg); B.phase = 'anim';
    B.fx = {k:'attack', dmg, crit:true, item:true, m:matchup(c.s, B.st.s), id:Date.now()}; sfx('hit'); render();
    setTimeout(() => { if (B.enemyHP <= 0) winBattle(); else { B.phase = 'ask'; B.fx = null; render(); } }, 1150);
  }
}
function buffMul(){ if (B.buff > 0){ B.buff--; return 1.5; } return 1; }
const activeId = () => B.deck[B.active];
function battleAnswer(i){
  if (!B || B.phase !== 'ask') return;
  const ok = B.choices[i] === B.q.answer;
  B.picked = i;
  recordAnswer(B.q, ok);
  const c = stats(activeId());
  if (ok){
    sfx('ok');
    B.correct++; B.streak++; B.best = Math.max(B.best, B.streak);
    if (B.streak >= 5 && !B.five){ B.five = true; addTickets(1, '5問連続正解'); }
    B.gauge = Math.min(100, B.gauge + 25);
    B.cardExp[c.id] = (B.cardExp[c.id] || 0) + 10;
    const m = matchup(c.s, B.st.s), crit = B.streak >= 3;
    const dmg = Math.max(1, Math.round((c.atkV + (B.streak-1)*4) * m * (crit ? 1.2 : 1) * buffMul()));
    B.enemyHP = Math.max(0, B.enemyHP - dmg);
    B.phase = 'anim';
    B.fx = {k:'attack', dmg, crit, m, id:Date.now()};
    render();
    setTimeout(() => sfx('hit'), 250);
    setTimeout(() => { if (B.enemyHP <= 0) winBattle(); else { nextQ(); B.fx = null; render(); } }, 1250);
  } else {
    sfx('ng');
    B.wrong++; B.streak = 0;
    const m = matchup(B.st.s, c.s);
    const dmg = Math.max(1, Math.round(B.st.enemy.atk * m));
    B.hp = Math.max(0, B.hp - dmg);
    // まちがえた問題は少しあとで もう一度出す（再学習）
    B.queue.splice(Math.min(2, B.queue.length), 0, B.q.id); B.retry = B.q.id;
    B.phase = 'wrong';
    B.fx = {k:'counter', dmg, id:Date.now()};
    render();
  }
}
function battleNext(){
  if (!B || B.phase !== 'wrong') return;
  if (B.hp <= 0){ endBattle(false); return; }
  nextQ(); B.fx = null; render();
}
function battleSpecial(){
  if (!B || B.phase !== 'ask' || B.gauge < 100) return;
  const c = stats(activeId());
  const m = matchup(c.s, B.st.s);
  const dmg = Math.round((c.atkV + c.spV) * m * buffMul());
  B.gauge = 0; B.phase = 'anim';
  B.fx = {k:'cutin', id:Date.now()};
  sfx('sp'); render();
  setTimeout(() => {
    B.enemyHP = Math.max(0, B.enemyHP - dmg);
    B.fx = {k:'attack', dmg, crit:true, sp:true, m, id:Date.now()}; sfx('hit'); render();
    setTimeout(() => { if (B.enemyHP <= 0) winBattle(); else { B.phase = 'ask'; B.fx = null; render(); } }, 1150);
  }, 1350);
}
function battleSwitch(i){
  if (!B || B.phase !== 'ask' || i === B.active) return;
  B.active = i; sfx('tap');
  B.fx = {k:'switch', id:Date.now()}; render();
}
function winBattle(){
  B.phase = 'end'; B.fx = {k:'clear', id:Date.now()}; sfx('win'); render();
  setTimeout(() => endBattle(true), 1600);
}
function endBattle(won){
  const st = B.st;
  const first = won && (st.daily ? S.dailyWin !== dayKey() : st.hard ? !hardCleared(st.id) : !S.cleared.includes(st.id));
  const res = { won, st, correct:B.correct, wrong:B.wrong, best:B.best, first, coins:0, pexp:0, cards:[] };
  S.battles++;
  if (won){
    res.coins = st.reward; S.coins += st.reward; daily().wins++;
    if (first){
      if (st.daily){ S.dailyWin = dayKey(); addTickets(1, '今日のバトル'); }
      else if (st.hard){ (S.hard = S.hard || []).push(st.id); addTickets(1, 'むずかしい 初クリア'); }
      else { S.cleared.push(st.id); addTickets(1, 'ステージ初クリア'); }
    }
    if (st.final && first && !st.hard){ ITEM_KEYS.forEach(k => S.items[k]++); res.allItems = true; }
    // ボス初撃破でボスのカード、全ボス撃破で「四神の絆」
    if (st.type === 'boss' && BOSS_CARD[st.s]){ const bid = BOSS_CARD[st.s]; if (!owned(bid)){ S.cards[bid] = {lv:1, exp:0, ev:false}; res.newCards = (res.newCards||[]).concat(bid); } }
    if (!owned(FINAL_CARD) && [3,6,9,12].every(x => S.cleared.includes(x))){ S.cards[FINAL_CARD] = {lv:1, exp:0, ev:false}; res.newCards = (res.newCards||[]).concat(FINAL_CARD); }
    const ik = ITEM_KEYS[Math.floor(Math.random()*ITEM_KEYS.length)]; S.items[ik]++; res.item = ik;
    B.deck.forEach(id => B.cardExp[id] = (B.cardExp[id] || 0) + 20 + (st.type === 'boss' ? 30 : 0));
  }
  res.pexp = B.correct*10 + (won && B.wrong === 0 && B.correct > 0 ? 20 : 0);
  addPlayerExp(res.pexp);
  Object.keys(B.cardExp).forEach(k => { const id = +k; const r = addCardExp(id, B.cardExp[id]); res.cards.push({id, ...r}); });
  persist();
  B = null;
  nav.stack.pop(); // battle
  nav.stack.push({v:'result', res});
  render(true);
}
function vBattle(){

  const st = B.st, c = stats(activeId()), fx = B.fx || {};

    arena2(st, c, fx, hpLow) +
    '<div class="statusline"><span class="chip">🔥 ' + B.streak + '連続</span>' + (B.buff ? '<span class="chip buffchip">🌀×' + B.buff + '</span>' : '') + '<div class="gauge' + (B.gauge>=100?' full':'') + '">⚡<div class="bar"><i style="width:' + B.gauge + '%"></i></div>' + B.gauge + '%</div>' + '<button class="chip" data-act="tray" style="background:var(--plate2);border:1px solid var(--line)">🎒 アイテム</button></div>' +
    '<section class="qbox">';
  if (B.phase === 'wrong'){
    h += '<div class="qtext small">' + ruby(B.q.text) + '</div>' +

      '<button class="cta" data-act="bnext">' + (B.hp <= 0 ? 'けっかを 見る' : 'わかった！ つぎへ') + '</button>';
  } else {
    h += '<div class="qtext"><span class="qunit">' + esc(B.q.unit) + '</span>' + ruby(B.q.text) + '</div>' +
      '<div class="choices' + (longChoices ? ' long' : '') + '">' + B.choices.map((ch, i) => {
        let cls = '';

        if (B.hidden.includes(i)) cls += ' gone';
        return '<button class="choice' + cls + '" data-act="ans" data-i="' + i + '"' + (B.phase!=='ask' || B.hidden.includes(i) ?' disabled':'') + '>' + ruby(ch) + '</button>';
      }).join('') + '</div>';
  }
  h += '</section><div class="bottombar">' + B.deck.map((id, i) => {
      const d = stats(id), m = matchup(d.s, st.s);
      return '<button class="dk s-' + d.s + (i===B.active?' active':'') + '" data-act="sw" data-i="' + i + '" aria-label="' + esc(d.title) + 'に交代">' + (d.img ? '<span class="dimg"><img src="' + ART[d.img] + '" alt=""></span>' : '<span class="de">' + d.e + '</span>') + '<b>' + esc(d.name) + '</b><span class="mu" style="color:' + (m>1?'var(--good)':m<1?'#ff9aa4':'var(--mute)') + '">' + (m>1?'▲有利':m<1?'▼不利':'ふつう') + '</span></button>';
    }).join('') +
    '<button class="spbtn' + (B.gauge>=100 && B.phase==='ask' ? ' ready' : '') + '" data-act="sp">' + (B.gauge>=100 ? '必殺技<br>はつどう！' : '必殺技<br>' + B.gauge + '%') + '</button></div>';
  // 演出

  if (fx.k === 'switch') h += '<div class="switchmsg s-' + c.s + '">交代！ ' + c.e + ' ' + esc(c.title) + '</div>';
  if (fx.k === 'cutin') h += '<div class="cutin2 s-' + c.s + '"><div class="ci-lines"></div>' + (c.img ? '<img class="ci-art" src="' + ART[c.img] + '" alt="">' : '<span class="ci-emo">' + c.e + '</span>') + '<div class="ci-text"><small>SPECIAL ATTACK</small><b>' + esc(c.sk) + '</b><span>' + SUBJ[c.s].g + 'の 必殺技！</span></div></div>';
  if (fx.k === 'clear') h += '<div class="overlay"><div class="clear">CLEAR!<small>' + esc(st.enemy.name) + 'を たおした！</small></div></div>';
  if (B.tray) h += '<div class="itemtray"><div class="row"><b class="grow">アイテムを 使う</b><button class="sub-btn" data-act="tray" style="padding:6px 12px">とじる</button></div>' + itemRow(true) + '<small class="muted">1つ タップで 使うよ。バトルに 勝つと 1つ もらえる。</small></div>';
  if (!S.tut && B.phase === 'ask'){

    ][B.tut || 0];
    h += '<div class="tut ' + T[2] + '"><div class="tut-box"><span class="tut-i">' + T[0] + '</span><b>' + T[1] + '</b><button class="cta" data-act="tutnext">' + ((B.tut || 0) < 2 ? 'つぎへ ▶' : 'わかった！ たたかう') + '</button><small>' + ((B.tut||0)+1) + ' / 3</small></div></div>';

function monStyle(en){ return en.hue ? ' style="filter:hue-rotate(' + en.hue + 'deg) saturate(1.25)"' : ''; }
// 大きな対戦ステージ

function drawOne(){
  const pool = boxPool();

  for (const c of pool){ pick -= BOX_W[c.r]; if (pick <= 0){ got = c; break; } }
  if (owned(got.id)){ const exp = 40 + got.r*10; const r = addCardExp(got.id, exp); return {id:got.id, dup:true, exp, lvup: r.to > r.from}; }
  S.cards[got.id] = {lv:1, exp:0, ev:false}; return {id:got.id, dup:false};
}

function sparkles(tag){

  }

function vRates(){
  const pool = boxPool(), tot = pool.reduce((a,c) => a + BOX_W[c.r], 0);
  const byTag = {};
  pool.forEach(c => { const t = cardTag(c); (byTag[t] = byTag[t] || []).push(c); });
  let h = top('でる カードと でやすさ') + '<main class="scroll"><p class="muted" style="margin:0">いま でる カードは ' + pool.length + 'まい。' + (BOX_POOL.every(c => owned(c.id)) ? '全部 集めたので、同じ カードが 出ると カードEXPに なるよ。' : 'まだ 持っていない カードだけが 出るよ。') + '<br>チケットは 勉強で もらえるよ（お金は かかりません）。</p>';
  ['SSR','SR','R','N'].forEach(t => {

    const p = list.reduce((a,c) => a + BOX_W[c.r], 0) / tot * 100;
    h += '<div class="panel"><div class="row"><b class="gc-rt r-' + t + '">' + t + '</b><span class="grow"></span><b>' + p.toFixed(1) + '%</b></div><div class="rate-list">' +

  });

}
function openBox(n){
  if (S.tickets < n || (boxState && boxState.phase && boxState.phase !== 'rates')) return;
  S.tickets -= n;
  const results = []; for (let k = 0; k < n; k++) results.push(drawOne());
  persist();
  const best = results.reduce((a,r) => Math.max(a, TAG_RANK[cardTag(cardDef(r.id))]), 0);
  const tags = ['N','R','SR','SSR'];
  // 光の色：高レアのときは「青→金」に変わる演出をときどき入れる
  let glow = best >= 2 && Math.random() < .5 ? 'R' : tags[best];
  boxState = {phase:'charge', results, idx:0, glow, best:tags[best]};
  sfx('charge'); render();
  boxState.t1 = setTimeout(() => { if (boxState && boxState.phase === 'charge' && boxState.glow !== boxState.best){ boxState.glow = boxState.best; sfx('up'); render(); } }, 1100);
  boxState.t2 = setTimeout(boxReveal, 2100);
}
function boxReveal(){
  if (!boxState) return; clearTimeout(boxState.t1); clearTimeout(boxState.t2);
  boxState.phase = 'reveal'; boxState.glow = boxState.best;
  const t = cardTag(cardDef(boxState.results[boxState.idx].id));
  sfx(t === 'SSR' ? 'ssr' : t === 'SR' ? 'win' : 'box'); render();
}
function boxNext(){
  if (!boxState) return;
  if (boxState.idx < boxState.results.length - 1){ boxState.idx++; boxReveal(); return; }
  if (boxState.results.length > 1){ boxState.phase = 'summary'; render(true); return; }
  boxState = null; render(true);
}

let P = null;

  let qs;

    const made = []; for (let k = 0; k < 6 && gens.length; k++) made.push(genQ(pick(gens), S.diff || 2));

    qs = gens.length ? shuffle(hand.slice(0, 2).concat(made).filter((q, i, a) => a.findIndex(x => x.id === q.id) === i)).slice(0,5) : hand.slice(0,5);

  res.coins = 10 + P.correct*3 + (acc >= 80 ? 15 : 0);

// ---------- BGM（ホーム・バトル・ボス）WebAudioで合成、ループ再生 ----------
const BGM = (function(){
  const hz = n => 440 * Math.pow(2, (n - 69) / 12);
  // D=62。和音は [ルート, 3度, 5度] 、メロディは 8分音符ごと（null=休み）
  const T = {
    home: { bpm:92, vol:.32, wave:'triangle',
      chords:[[50,53,57],[46,50,53],[48,52,55],[45,49,52]],
      bass:[38,38,45,38, 34,34,41,34, 36,36,43,36, 33,33,40,33],
      mel:[69,null,72,74, 76,null,74,72, 70,null,69,67, 69,null,null,null,
           72,null,74,76, 77,null,76,74, 72,null,74,73, 69,null,null,null],
      drum:'k...h...s...h...k.k.h...s...h.h.' },
    battle: { bpm:138, vol:.3, wave:'square',
      chords:[[50,53,57],[50,53,57],[46,50,53],[48,52,55]],
      bass:[38,50,38,50, 38,50,38,50, 34,46,34,46, 36,48,36,48],
      mel:[74,null,74,72, 74,null,77,null, 76,74,72,null, 69,null,72,null,
           70,null,72,74, 77,null,76,74, 76,null,79,null, 81,null,null,null],
      drum:'k.h.s.h.k.k.s.h.k.h.s.h.k.ksshs' },
    boss: { bpm:150, vol:.32, wave:'sawtooth',
      chords:[[50,53,57],[49,52,56],[46,50,53],[45,49,52]],
      bass:[38,38,50,38, 37,37,49,37, 34,34,46,34, 33,33,45,45],
      mel:[62,65,69,74, null,72,69,null, 61,64,68,73, null,72,68,null,
           70,69,70,74, 77,null,74,null, 73,null,76,null, 79,78,76,73],
      drum:'kkh.s.hkk.h.s.h.kkh.s.hkk.hsssss' }
  };
  let ctx = null, out = null, noise = null, cur = null, timer = null, step = 0, nextT = 0, want = null;
  function init(){
    if (ctx) return true;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return false; }
    out = ctx.createGain(); out.gain.value = 0; out.connect(ctx.destination);
    noise = ctx.createBuffer(1, ctx.sampleRate * .5, ctx.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2-1;
    return true;
  }
  function tone(t, n, dur, type, v, cut){
    const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    o.type = type; o.frequency.value = hz(n); f.type = 'lowpass'; f.frequency.value = cut || 2400;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(out); o.start(t); o.stop(t + dur + .05);
  }
  function drum(t, k){
    if (k === 'k'){ const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(45, t + .12);
      g.gain.setValueAtTime(.55, t); g.gain.exponentialRampToValueAtTime(.001, t + .25); o.connect(g); g.connect(out); o.start(t); o.stop(t + .3); return; }
    const n = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    n.buffer = noise; f.type = k === 'h' ? 'highpass' : 'bandpass'; f.frequency.value = k === 'h' ? 7000 : 1800;
    const v = k === 'h' ? .08 : .22, d = k === 'h' ? .04 : .14;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    n.connect(f); f.connect(g); g.connect(out); n.start(t); n.stop(t + d + .02);
  }
  function tick(){
    if (!cur) return;
    const tr = T[cur], s16 = 60 / tr.bpm / 4;
    while (nextT < ctx.currentTime + .15){
      const st = step % 64, bar = Math.floor(st / 16) % 4;
      const dc = tr.drum[st % tr.drum.length]; if (dc && dc !== '.') drum(nextT, dc);
      if (st % 4 === 0) tone(nextT, tr.bass[(st/4) % tr.bass.length], s16*3.6, 'triangle', .22, 700);
      if (st % 16 === 0) tr.chords[bar].forEach(n => tone(nextT, n + 12, s16*15, 'sawtooth', .025, 1200));
      if (st % 2 === 0){ const m = tr.mel[(st/2) % tr.mel.length]; if (m) tone(nextT, m, s16*1.9, tr.wave, .07, 3000); }
      nextT += s16; step++;
    }
  }
  function play(name){
    want = name;
    if (!S.sound || !name){ stop(); return; }
    if (!init()) return;
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    if (cur === name) return;
    out.gain.cancelScheduledValues(ctx.currentTime);
    out.gain.setTargetAtTime(0, ctx.currentTime, .08);
    setTimeout(() => {
      cur = name; step = 0; nextT = ctx.currentTime + .05;
      out.gain.setTargetAtTime(T[name].vol, ctx.currentTime, .3);
      clearInterval(timer); timer = setInterval(tick, 25);
    }, cur ? 250 : 0);
  }
  function stop(){
    if (!ctx || !cur) { cur = null; return; }
    out.gain.setTargetAtTime(0, ctx.currentTime, .1);
    cur = null; setTimeout(() => { if (!cur) clearInterval(timer); }, 400);
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); else if (want) play(want); });
  // 試聴用：オフラインで書き出す
  async function render(name, secs){
    const save = [ctx, out, cur, step, nextT];
    const off = new OfflineAudioContext(1, 44100 * secs, 44100);
    ctx = off; out = off.createGain(); out.gain.value = T[name].vol; out.connect(off.destination);
    noise = off.createBuffer(1, 22050, 44100); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2-1;
    cur = name; step = 0; nextT = 0;
    const tr = T[name], s16 = 60 / tr.bpm / 4;
    while (nextT < secs - .5){ const st = step % 64, bar = Math.floor(st/16) % 4; const dc = tr.drum[st % tr.drum.length]; if (dc && dc !== '.') drum(nextT, dc);
      if (st % 4 === 0) tone(nextT, tr.bass[(st/4) % tr.bass.length], s16*3.6, 'triangle', .22, 700);
      if (st % 16 === 0) tr.chords[bar].forEach(n => tone(nextT, n + 12, s16*15, 'sawtooth', .025, 1200));
      if (st % 2 === 0){ const m = tr.mel[(st/2) % tr.mel.length]; if (m) tone(nextT, m, s16*1.9, tr.wave, .07, 3000); }
      nextT += s16; step++; }
    const buf = await off.startRendering();
    [ctx, out, cur, step, nextT] = save; noise = null; if (ctx){ noise = ctx.createBuffer(1, 22050, ctx.sampleRate); const e = noise.getChannelData(0); for (let i = 0; i < e.length; i++) e[i] = Math.random()*2-1; }
    return buf.getChannelData(0);
  }
  return { play, stop, render, get want(){ return want; } };
})();

function furigana(root){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode(n){
    if (!FURI_RE.test(n.nodeValue)){ FURI_RE.lastIndex = 0; return NodeFilter.FILTER_REJECT; }

    return NodeFilter.FILTER_ACCEPT; } });

    const span = document.createElement('span');
    span.innerHTML = esc(n.nodeValue).replace(FURI_RE, m => '<ruby>' + m + '<rt>' + FURI_MAP[m] + '</rt></ruby>');

    [-6, 6].forEach(det => {
      const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.value = hz(note); o.detune.value = det; f.type = 'lowpass'; f.frequency.value = 1500;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.06*v, t + .015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(f); f.connect(g); g.connect(dst); o.start(t); o.stop(t + dur + .05);
    });
  }
  function boom(t, v, dst){ // 映画のような重低音
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(28, t + 1.4);
    env(g, t, .01, .9*v, 1.8); o.connect(g); g.connect(dst); o.start(t); o.stop(t + 2);
  }
  function swell(t, dur, dst){ // 逆再生シンバル風
    const n = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    n.buffer = noiseBuf; n.loop = true; f.type = 'highpass'; f.frequency.value = 2500;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.22, t + dur); g.gain.linearRampToValueAtTime(0, t + dur + .02);
    n.connect(f); f.connect(g); g.connect(dst); n.start(t); n.stop(t + dur + .05);
  }

  const INTRO = 1.0, BEAT = 8.25 / 16, HIT = INTRO + 16 * BEAT; // HIT ≒ 9.25秒（タイトル場面）
  let t0 = 0, hitDone = false, loopTimer = null, stopped = false;

  function playMain(){
    t0 = ctx.currentTime + 0.05; const m = main;
    // イントロ：重低音＋合唱が湧き上がる
    boom(t0, 1, m); taiko(t0, 1.1, m);
    choir(t0 + .05, [N.D3, N.A3, N.D4], INTRO + .2, .9, m); swell(t0 + .2, INTRO - .2, m);
    const s = t0 + INTRO, b = BEAT;
    // 和音進行：Dm → B♭ → Gm → A（緊張）→ D（タイトルで長調に解決）
    const chords = [[N.D3,N.F3,N.A3],[N.Bb2,N.D3,N.F3],[N.G2,N.Bb2,N.D3],[N.A2,N.Cs3,N.E3]];
    const bass = [N.D2, N.Bb1, N.G1 + 12, N.A1];
    chords.forEach((c, bar) => {
      const bt = s + bar*4*b;
      choir(bt, c.map(n => n + 12), 4*b, bar < 2 ? .8 : 1.1, m);
      // 低弦：前半は8分、後半は16分で加速
      const sub = bar < 2 ? 2 : 4;
      for (let k = 0; k < 4*sub; k++) strings(bt + k*b/sub, bass[bar] + 12 + (k % 4 === 2 ? 12 : 0), b/sub*.9, bar < 2 ? .8 : 1, m);
      // 太鼓：前半はゆったり大きく、後半は細かく
      if (bar < 2){ taiko(bt, 1.1, m); boom(bt, .45, m); taiko(bt + 2*b, .9, m); taiko(bt + 3.5*b, .5, m); }
      else for (let q = 0; q < 8; q++) taiko(bt + q*b/2, (q % 2 ? .45 : .85) + (bar === 3 ? q*.05 : 0), m);
    });
    // 金管の主旋律（オクターブで重ねる）
    const mel = [
      [N.D4,2],[N.A4,1],[N.G4,.5],[N.F4,.5],
      [N.F4,1.5],[N.G4,.5],[N.D4,2],
      [N.G4,1],[N.Bb4,1],[N.A4,1],[N.G4,1],
      [N.A4,1],[N.Cs5,1],[N.E5,1],[N.A5,1]
    ];
    let pos = 0; mel.forEach(([n, d]) => { brass(s + pos*b, [n - 12, n], d*b*.95, pos >= 8 ? 1.2 : 1, m); pos += d; });
    // 最後の2拍：太鼓ロール＋シンバルの吸い込み
    for (let k = 0; k < 8; k++) taiko(s + 14*b + k*b/4, .5 + k*.08, m);
    swell(s + 14*b, 2*b, m);
  }
  function playHit(at){
    if (hitDone) return; hitDone = true;
    const m = bus(), t = at;
    boom(t, 1.3, m); taiko(t, 1.4, m); taiko(t + .03, 1.2, m); crash(t, m); crash(t + .01, m);
    brass(t, [N.D3, N.A3, N.D4, N.Fs4, N.A4, N.D5], 3.4, 1.4, m);
    choir(t, [N.D4, N.Fs4, N.A4, N.D5], 4.2, 1.3, m);
    lead(t + .1, N.Fs5, 3.2, .7, m);
    for (let k = 0; k < 6; k++) strings(t + k*.07, N.D2 + 12*(k % 3), 1.2, 1, m);
    taiko(t + 1.1, .7, m); taiko(t + 1.6, .9, m);
    // タイトル待ち：合唱と鼓動のような太鼓
    const loop = () => {
      if (stopped) return;
      const lt = ctx.currentTime + 0.05, g = bus(); g.gain.value = 0.5;
      choir(lt, [N.D4, N.A4, N.Fs4], 3.6, .7, g); strings(lt, N.D2 + 12, 3, .5, g);
      taiko(lt, .45, g); taiko(lt + .35, .3, g); taiko(lt + 2, .45, g); taiko(lt + 2.35, .3, g);
      [N.A4, N.D5, N.Fs5, N.A5].forEach((n, k) => koto(lt + 1 + k*.18, n, .5, g));
      loopTimer = setTimeout(loop, 4000);
    };
    loopTimer = setTimeout(loop, Math.max(0, (t - ctx.currentTime) * 1000) + 4200);
  }
  return {
    start(){ try { const r = ctx.resume && ctx.resume(); if (r && r.catch) r.catch(() => {}); } catch(e){} playMain(); playHit(t0 + HIT); },
    skipToHit(){ // スキップ：本編を止めて、すぐにタイトルの一撃へ
      if (hitDone && ctx.currentTime >= t0 + HIT - .05) return;
      main.gain.setTargetAtTime(0, ctx.currentTime, .03); setTimeout(() => main.disconnect(), 300);
      hitDone = false; clearTimeout(loopTimer); playHit(ctx.currentTime + .05);
    },
    stop(){ stopped = true; clearTimeout(loopTimer); out.gain.setTargetAtTime(0, ctx.currentTime, .15); setTimeout(() => { try { out.disconnect(); } catch(e){} }, 900); },
    intro: INTRO, beat: BEAT
  };
}

// ---------- オープニング ----------
(function opening(){
  if (typeof OPENING === 'undefined' || !OPENING.length){ bgmReady = true; return; }
  if (window.claude && window.claude.hot && window.claude.hot.data && window.claude.hot.data.S){ bgmReady = true; return; } // 更新時は出さない
  const ov = document.createElement('div');
  ov.className = 'opening gate';
  ov.innerHTML = '<div class="op-bg">' + OPENING.map((src, i) => '<img class="op-b' + (i === OPENING.length - 1 ? ' on' : '') + '" loading="lazy" src="' + src + '" alt="" style="z-index:' + i + '">').join('') + '</div><div class="op-stage">' +
    OPENING.map((src, i) => '<img class="op-f kb' + (i % 4) + '" ' + (i === OPENING.length - 1 ? 'src' : 'data-src') + '="' + src + '" alt="' + (i === OPENING.length - 1 ? '四神まなびバトル' : '') + '" style="z-index:' + i + '">').join('') +
    '</div><div class="op-flash"></div><button class="op-skip">スキップ ▶▶</button><div class="op-tap">タップして はじめる</div>' +
    '<button class="op-start"><span class="op-play">▶</span><b>タップして スタート</b><small>' + (S.sound ? '🔊 音が でるよ' : '🔇 音は オフ') + '</small></button>';
  document.body.appendChild(ov);
  const frames = ov.querySelectorAll('.op-f'), bgs = ov.querySelectorAll('.op-b');
  // 最初はタイトル絵だけ読み込み、残りの場面はあとから読む（表示を速く）
  setTimeout(() => frames.forEach(f => { if (f.dataset.src){ f.src = f.dataset.src; f.removeAttribute('data-src'); } }), 60);
  let i = -1, timer = null, done = false, started = false, music = null;
  const last = frames.length - 1;
  // 新しい場面を上に重ねてフェードイン → 下の場面はあとで消す（暗くならないクロスフェード）
  function show(n){
    [frames, bgs].forEach(list => {
      list[n].classList.add('on', 'shown');
      list.forEach((f, k) => { if (k !== n && f.classList.contains('on')) setTimeout(() => { if (i !== k) f.classList.remove('on'); }, 900); });
    });
    if (n === last){ ov.classList.add('final'); done = true; }
  }
  // 曲の拍に合わせて場面を切りかえる（最後の場面＝曲の「ドン！」）
  function schedule(){
    const intro = music ? music.intro : 1.0, gap = ((music ? music.beat * 16 : 8.25)) / last;
    const t0 = performance.now();
    show(0);
    (function tick(){
      const el = (performance.now() - t0) / 1000;
      const n = el < intro ? 0 : Math.min(last, 1 + Math.floor((el - intro) / gap));
      if (n !== i){ i = n; show(n); }
      if (n < last) timer = requestAnimationFrame(tick);
    })();
  }
  function begin(){
    started = true; ov.classList.remove('gate');
    if (S.sound){ try { music = OpeningMusic(); music.start(); } catch(e){ music = null; } }
    schedule();
  }
  function toFinal(){ cancelAnimationFrame(timer); if (music) music.skipToHit(); i = last; show(last); }
  function close(){
    if (music) music.stop();
    sfx('tap'); bgmReady = true; render();
    ov.classList.add('out');
    setTimeout(() => ov.remove(), 600);
  }
  ov.addEventListener('click', e => {
    if (!started){ begin(); return; }
    if (e.target.closest('.op-skip') || !done){ toFinal(); return; }
    close();
  });
})();

// テスト用フック
window.__shishin = { BGM, get S(){ return S; }, get B(){ return B; }, get P(){ return P; }, stats, matchup, OpeningMusic };
})();

</script>
