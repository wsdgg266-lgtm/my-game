<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0f16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="バスナビ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<title>バスナビ! - B.LEAGUE / NBA / 日本代表の試合と順位</title>
<style>
  :root {
    --bg: #0c0f16;
    --card: #161c28;
    --card2: #1c2432;
    --text: #eef1f7;
    --text-sub: #909cb2;
    --line: rgba(255,255,255,.08);
    --line2: rgba(255,255,255,.15);
    --or: #ffa63c;
    --or2: #ff6236;
    --grad: linear-gradient(135deg, #ffb03c, #ff5f36);
    --ink-on-grad: #2a1200;
    --cy: #5cc8ff;
    --win: #3ddc84;
    --live: #ff4d6d;
    --amber: #ffc24b;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    background: radial-gradient(900px 480px at 50% -190px, #3a2410 0%, var(--bg) 62%) fixed, var(--bg);
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 92px;
    overflow-x: hidden;
    max-width: 100vw;
  }
  input, select, textarea {
    font-size: 16px !important;
    background: #10151f; color: var(--text);
    border: 1.5px solid var(--line2); border-radius: 10px;
  }
  textarea { line-height: 1.6; }
  button { font-family: inherit; }
  a { color: var(--cy); }

  /* ---------- ヘッダー ---------- */
  header {
    background: rgba(12,15,22,.84);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
    padding: calc(12px + env(safe-area-inset-top)) 14px 0;
    position: sticky; top: 0; z-index: 10;
  }
  .head-row { display: flex; align-items: center; gap: 8px; }
  header h1 { display: flex; align-items: baseline; gap: 9px; flex: 1; font-size: 1rem; }
  .logo {
    font-size: 1.3rem; font-weight: 900; font-style: italic; letter-spacing: .04em;
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    padding-right: 3px;
  }
  .head-date { font-size: .74rem; color: var(--text-sub); font-weight: normal; font-style: normal; }
  #refreshBtn {
    border: 1px solid var(--line2); background: rgba(255,255,255,.06); color: var(--text);
    width: 38px; height: 38px; border-radius: 50%; font-size: 18px; cursor: pointer;
    flex-shrink: 0; line-height: 1;
  }
  #refreshBtn.spin { animation: spin 1s linear infinite; color: var(--or); border-color: var(--or); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .chip-bar {
    display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none; padding: 11px 0 13px;
  }
  .chip-bar::-webkit-scrollbar { display: none; }
  .sp-chip {
    flex-shrink: 0; border: 1px solid var(--line2); background: rgba(255,255,255,.04);
    color: var(--text); border-radius: 999px; padding: 7px 14px; font-size: .87rem; cursor: pointer;
    display: flex; align-items: center; gap: 5px;
  }
  .sp-chip.on {
    background: var(--grad); color: var(--ink-on-grad); border-color: transparent; font-weight: 800;
    box-shadow: 0 2px 14px rgba(255,130,60,.35);
  }
  #focusBanner {
    display: none; align-items: center; gap: 8px;
    background: var(--grad); color: var(--ink-on-grad);
    margin: 0 -14px; padding: 9px 14px; font-size: .9rem; font-weight: 600;
  }
  #focusBanner.show { display: flex; }
  #focusBanner b { flex: 1; }
  #focusBanner button {
    border: none; background: rgba(42,18,0,.22); color: var(--ink-on-grad);
    border-radius: 999px; padding: 4px 13px; font-size: .85rem; cursor: pointer; font-weight: 700;
  }
  #netBanner {
    display: none; background: rgba(255,194,75,.1); color: #ffd47e; font-size: .82rem;
    margin: 0 -14px; padding: 6px 14px; border-bottom: 1px solid rgba(255,194,75,.25);
  }
  #netBanner.show { display: block; }

  /* ---------- 本文 ---------- */
  main { padding: 14px 14px 0; max-width: 640px; margin: 0 auto; }
  .tab-page { display: none; }
  .tab-page.on { display: block; }
  .sec-title {
    font-size: .95rem; font-weight: 800; margin: 20px 2px 9px;
    display: flex; align-items: center; gap: 7px; letter-spacing: .02em;
  }
  .sec-title::before { content: ""; width: 4px; height: 15px; border-radius: 2px; background: var(--grad); }
  .sec-title:first-child { margin-top: 2px; }
  .sec-title small { color: var(--text-sub); font-weight: normal; font-size: .76rem; }
  .date-head {
    font-size: .84rem; font-weight: 700; color: var(--text-sub);
    margin: 18px 2px 7px; display: flex; align-items: center; gap: 6px;
    letter-spacing: .06em;
  }
  .date-head.today { color: var(--or); }
  .empty-note {
    background: rgba(255,255,255,.02); border: 1px dashed var(--line2); border-radius: var(--radius);
    padding: 20px 14px; text-align: center; color: var(--text-sub); font-size: .9rem;
    line-height: 1.8; margin-bottom: 10px;
  }
  .empty-note .g-links { justify-content: center; }

  /* ---------- 試合カード ---------- */
  .game {
    background: linear-gradient(180deg, var(--card2), var(--card));
    border-radius: var(--radius); border: 1px solid var(--line);
    box-shadow: 0 10px 26px rgba(2,4,10,.45);
    padding: 11px 13px; margin-bottom: 10px;
    position: relative; overflow: hidden;
  }
  .game::before {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 3px;
    background: var(--grad); opacity: .9;
  }
  .g-top { display: flex; align-items: center; gap: 8px; font-size: .74rem; color: var(--text-sub); }
  .g-lg { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; letter-spacing: .05em; color: #c3cde0; }
  .g-status { margin-left: auto; }
  .g-status .live { color: var(--live); font-weight: 800; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .4; } }
  .g-status .fin { color: var(--win); font-weight: 700; }
  .g-status .ppd { color: var(--amber); font-weight: 700; }
  .g-main {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: 8px; padding: 9px 0 6px;
  }
  .g-team { font-size: 1.02rem; font-weight: 800; line-height: 1.35; }
  .g-team.home { text-align: right; }
  .g-team.away { text-align: left; }
  .g-team.win { color: var(--win); text-shadow: 0 0 18px rgba(61,220,132,.35); }
  .g-team .rec { display: block; font-size: .68rem; color: var(--text-sub); font-weight: normal; }
  .g-center { text-align: center; min-width: 84px; }
  .g-score { font-size: 1.45rem; font-weight: 900; letter-spacing: 2px; font-variant-numeric: tabular-nums; }
  .g-time {
    font-size: 1.05rem; font-weight: 900; letter-spacing: .04em;
    color: var(--or); text-shadow: 0 0 16px rgba(255,150,60,.4);
    font-variant-numeric: tabular-nums;
  }
  .g-venue { font-size: .72rem; color: var(--text-sub); }
  .g-quarters {
    display: flex; gap: 3px; justify-content: center; margin-top: 4px;
    font-size: .66rem; color: var(--text-sub); font-variant-numeric: tabular-nums;
  }
  .g-quarters span { background: rgba(255,255,255,.05); border-radius: 4px; padding: 1px 5px; }
  .g-bcast {
    display: flex; align-items: flex-start; gap: 6px; font-size: .8rem; color: #ffe0c2;
    background: rgba(255,160,60,.07); border: 1px solid rgba(255,160,60,.16);
    border-radius: 10px; padding: 7px 9px; margin-top: 5px; line-height: 1.5;
  }
  .g-bcast .txt { flex: 1; }
  .g-bcast .memo { color: var(--amber); font-weight: 700; }
  .g-bcast button { border: none; background: none; font-size: 15px; cursor: pointer; padding: 0 2px; flex-shrink: 0; }
  .g-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .g-links a, .g-links button {
    font-size: .75rem; color: #c3cde0; text-decoration: none;
    border: 1px solid var(--line2); border-radius: 999px; padding: 4px 11px;
    background: rgba(255,255,255,.04); cursor: pointer;
  }
  .g-nores { font-size: .76rem; color: var(--text-sub); }

  /* ---------- カード・フォロー ---------- */
  .card-box {
    background: linear-gradient(180deg, var(--card2), var(--card));
    border-radius: var(--radius); border: 1px solid var(--line);
    box-shadow: 0 10px 26px rgba(2,4,10,.45);
    padding: 13px; margin-bottom: 12px;
  }
  .team-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
  .t-chip {
    border: 1px solid var(--line2); background: rgba(255,255,255,.04); color: var(--text);
    border-radius: 999px; padding: 7px 13px; font-size: .86rem; cursor: pointer;
  }
  .t-chip.on {
    border-color: rgba(255,166,60,.55); background: rgba(255,166,60,.13); color: var(--or);
    font-weight: 800; box-shadow: 0 0 12px rgba(255,166,60,.18);
  }
  .btn {
    border: none; border-radius: 12px; padding: 12px 14px; font-size: .95rem;
    background: var(--grad); color: var(--ink-on-grad); cursor: pointer; font-weight: 800;
    letter-spacing: .02em;
  }
  .btn.sub { background: rgba(255,255,255,.08); color: var(--text); }
  .btn.warn { background: rgba(255,77,109,.14); color: var(--live); }
  .btn:disabled { opacity: .5; }
  .add-form { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .add-form input, .add-form select, .add-form textarea { padding: 10px 11px; width: 100%; }
  .follow-mini { font-size: .8rem; color: var(--text-sub); margin-top: 4px; line-height: 1.7; }
  .follow-mini b { color: var(--text); }

  /* ---------- 順位表 ---------- */
  .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -13px; padding: 0 13px; }
  table.rank { width: 100%; border-collapse: collapse; font-size: .84rem; font-variant-numeric: tabular-nums; }
  table.rank th {
    font-size: .7rem; color: var(--text-sub); font-weight: 700; text-align: right;
    padding: 4px 5px; border-bottom: 1px solid var(--line2); white-space: nowrap;
  }
  table.rank th.tm, table.rank td.tm { text-align: left; width: 100%; }
  table.rank td { padding: 7px 5px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.rank tr:last-child td { border-bottom: none; }
  table.rank td.tm { font-weight: 700; display: flex; align-items: center; gap: 6px; }
  table.rank td.no { color: var(--text-sub); font-variant-numeric: tabular-nums; width: 1.6em; }
  table.rank tr.mine td { background: rgba(255,166,60,.08); }
  table.rank tr.mine td.tm { color: var(--or); }
  .rank-line td {
    border-bottom: 2px dashed rgba(255,255,255,.28) !important;
  }
  .rank-note { font-size: .74rem; color: var(--text-sub); margin-top: 8px; line-height: 1.7; }
  .zone { display: inline-block; width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .zone.po { background: var(--win); }
  .zone.pi { background: var(--amber); }
  .zone.out { background: transparent; }
  .streak-w { color: var(--win); }
  .streak-l { color: var(--live); }

  /* ---------- 選手 ---------- */
  .jp-name { font-size: 1.12rem; font-weight: 900; padding: 7px 0 4px; letter-spacing: .02em; }
  .jp-name small { font-size: .72rem; color: var(--text-sub); font-weight: normal; margin-left: 6px; }
  .jp-pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
  .jp-pill {
    display: inline-flex; align-items: baseline; gap: 5px;
    background: rgba(255,255,255,.05); border: 1px solid var(--line2);
    border-radius: 8px; padding: 4px 9px; font-size: .92rem; font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .jp-pill small { font-size: .68rem; color: var(--text-sub); font-weight: normal; }
  .jp-rate { font-size: .84rem; margin: 5px 0 3px; }
  .jp-rate small { color: var(--text-sub); }
  .jp-stars { letter-spacing: 2px; font-size: .95rem; }
  .jp-stars.s5, .jp-stars.s4 { color: var(--amber); text-shadow: 0 0 12px rgba(255,194,75,.45); }
  .jp-stars.s3 { color: #d9c9a0; }
  .jp-stars.s2, .jp-stars.s1 { color: var(--text-sub); }
  .leader-row {
    display: flex; align-items: center; gap: 9px; padding: 8px 2px;
    border-bottom: 1px solid var(--line); font-size: .9rem;
  }
  .leader-row:last-child { border-bottom: none; }
  .leader-row .no { color: var(--text-sub); font-size: .78rem; width: 1.4em; }
  .leader-row .nm { flex: 1; font-weight: 700; }
  .leader-row .nm small { display: block; color: var(--text-sub); font-weight: normal; font-size: .72rem; }
  .leader-row .val { font-weight: 900; font-variant-numeric: tabular-nums; color: var(--or); }

  /* ---------- 設定 ---------- */
  .set-row { display: flex; align-items: center; gap: 10px; padding: 11px 2px; border-bottom: 1px solid var(--line); }
  .set-row:last-child { border-bottom: none; }
  .set-row .grow { flex: 1; }
  .set-row .desc { font-size: .76rem; color: var(--text-sub); margin-top: 2px; line-height: 1.5; }
  .toggle { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle .knob { position: absolute; inset: 0; background: #2c3446; border-radius: 999px; cursor: pointer; transition: background .15s; }
  .toggle .knob::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
    background: #fff; border-radius: 50%; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  .toggle input:checked + .knob { background: linear-gradient(135deg, #ffb03c, #ff5f36); }
  .toggle input:checked + .knob::after { left: 23px; }
  .diag { font-size: .78rem; color: var(--text-sub); line-height: 1.8; }
  .diag b { color: var(--text); }
  .diag .ok { color: var(--win); font-weight: 700; }
  .diag .ng { color: var(--live); font-weight: 700; }

  /* ---------- 下部ナビ ---------- */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    background: rgba(13,17,25,.9);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    display: flex; padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; border: none; background: none; padding: 9px 0 8px; cursor: pointer;
    font-size: .64rem; color: var(--text-sub); display: flex; flex-direction: column;
    align-items: center; gap: 3px; letter-spacing: .04em; position: relative;
  }
  nav button .ic { width: 22px; height: 22px; display: block; }
  nav button .ic svg { width: 100%; height: 100%; }
  nav button.on { color: var(--or); font-weight: 700; }
  nav button.on::before {
    content: ""; position: absolute; top: 0; width: 26px; height: 3px;
    border-radius: 0 0 3px 3px; background: var(--grad);
  }

  /* ---------- モーダル ---------- */
  #modalWrap {
    display: none; position: fixed; inset: 0; z-index: 40;
    background: rgba(4,6,12,.66); align-items: flex-end; justify-content: center;
  }
  #modalWrap.show { display: flex; }
  #modalBox {
    background: var(--card2); border: 1px solid var(--line2); border-bottom: none;
    border-radius: 20px 20px 0 0; width: 100%; max-width: 640px;
    padding: 20px 16px calc(18px + env(safe-area-inset-bottom));
    max-height: 82vh; overflow-y: auto;
  }
  #modalBox::before {
    content: ""; display: block; width: 42px; height: 4px; border-radius: 2px;
    background: var(--line2); margin: -6px auto 14px;
  }
  #modalBox h3 { font-size: 1rem; margin-bottom: 5px; }
  #modalBox .m-sub { font-size: .8rem; color: var(--text-sub); margin-bottom: 10px; line-height: 1.6; }
  .m-btns { display: flex; gap: 8px; margin-top: 15px; }
  .m-btns .btn { flex: 1; }
  .loading-note { text-align: center; color: var(--text-sub); font-size: .85rem; padding: 8px 0 4px; }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <h1><span class="logo">バスナビ</span><span class="head-date" id="headDate"></span></h1>
    <button id="refreshBtn" title="データを再取得">↻</button>
  </div>
  <div id="netBanner"></div>
  <div id="focusBanner">
    <span>🔎</span><b id="focusLabel"></b>
    <button id="focusClear">解除</button>
  </div>
  <div class="chip-bar" id="chipBar"></div>
</header>

<main>
  <div class="tab-page" id="page-home"></div>
  <div class="tab-page" id="page-sched"></div>
  <div class="tab-page" id="page-result"></div>
  <div class="tab-page" id="page-rank"></div>
  <div class="tab-page" id="page-player"></div>
  <div class="tab-page" id="page-set"></div>
</main>

<nav id="navBar">
  <button data-tab="home"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/></svg></span>ホーム</button>
  <button data-tab="sched"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>日程</button>
  <button data-tab="result"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.2 12h17.6M12 3.1c4.6 4.9 4.6 12.9 0 17.8M12 3.1C7.4 8 7.4 16 12 20.9"/></svg></span>結果</button>
  <button data-tab="rank"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11M12 20V4M20 20v-6"/></svg></span>順位</button>
  <button data-tab="player"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/></svg></span>選手</button>
  <button data-tab="set"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.7M12 18.5v2.7M2.8 12h2.7M18.5 12h2.7M5.5 5.5l1.9 1.9M16.6 16.6l1.9 1.9M18.5 5.5l-1.9 1.9M7.4 16.6l-1.9 1.9"/></svg></span>設定</button>
</nav>

<div id="modalWrap"><div id="modalBox"></div></div>

<script>
'use strict';

/* ================= ユーティリティ ================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const sleep = ms => new Promise(r => setTimeout(r, ms));

const JST = 'Asia/Tokyo';
const dateKeyFmt = new Intl.DateTimeFormat('sv-SE', { timeZone: JST, year:'numeric', month:'2-digit', day:'2-digit' });
const timeFmt = new Intl.DateTimeFormat('ja-JP', { timeZone: JST, hour:'2-digit', minute:'2-digit', hour12:false });
const wdFmt = new Intl.DateTimeFormat('ja-JP', { timeZone: JST, weekday:'short' });
function dateKey(d) { return dateKeyFmt.format(d); }               // "2026-10-03"(JST)
function todayKey() { return dateKey(new Date()); }
function keyToLabel(key) {
  const [y,m,d] = key.split('-').map(Number);
  const wd = wdFmt.format(new Date(Date.UTC(y, m-1, d, 3)));       // JST正午相当で曜日を出す
  return `${m}/${d}(${wd})`;
}
function addDaysKey(key, n) {
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d, 3));
  dt.setUTCDate(dt.getUTCDate() + n);
  return dateKey(dt);
}
function daysBetween(a, b) {                                       // b - a(日数)
  const p = k => { const [y,m,d] = k.split('-').map(Number); return Date.UTC(y, m-1, d); };
  return Math.round((p(b) - p(a)) / 86400000);
}
function lsGet(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch(e) { return fb; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
function fmtAgo(ts) {
  if (!ts) return '未取得';
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return 'たった今';
  if (m < 60) return m + '分前';
  const h = Math.floor(m / 60);
  if (h < 24) return h + '時間前';
  return Math.floor(h / 24) + '日前';
}

/* ================= データ取得層 ================= */
async function fetchJson(url, timeoutMs) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), timeoutMs || 12000);
  try {
    const res = await fetch(url, { signal: ctl.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally { clearTimeout(t); }
}

/* --- ESPN(APIキー不要): NBAの日程・結果・ライブスコア --- */
async function espnFetch(lgKey) {
  const path = LEAGUES[lgKey].espn;
  const t = todayKey();
  const from = addDaysKey(t, -7).replace(/-/g, '');
  const to   = addDaysKey(t, 14).replace(/-/g, '');
  const base = `https://site.api.espn.com/apis/site/v2/sports/${path}/scoreboard`;
  let json;
  try {
    json = await fetchJson(`${base}?dates=${from}-${to}&limit=400`);
  } catch(e) {
    json = await fetchJson(base);            // 期間指定が使えない場合は当日分だけでも
  }
  const evs = [];
  for (const e of (json.events || [])) {
    const comp = e.competitions && e.competitions[0];
    if (!comp) continue;
    const home = (comp.competitors || []).find(c => c.homeAway === 'home');
    const away = (comp.competitors || []).find(c => c.homeAway === 'away');
    if (!home || !away) continue;
    const st = (comp.status && comp.status.type) || {};
    let status = 'pre';
    if (st.state === 'in') status = 'in';
    else if (st.state === 'post') status = 'post';
    if (/postpon|cancel/i.test(st.name || '') || /postpon|cancel/i.test(st.description || '')) status = 'ppd';
    const ts = Date.parse(e.date);
    const rec = c => (c.records && c.records[0] && c.records[0].summary) || '';
    const line = c => (c.linescores || []).map(q => Number(q.value)).filter(v => !isNaN(v));
    evs.push({
      id: lgKey + '_' + e.id,
      league: lgKey,
      ts: isNaN(ts) ? null : ts,
      dateJst: isNaN(ts) ? null : dateKey(new Date(ts)),
      timeJst: isNaN(ts) ? null : timeFmt.format(new Date(ts)),
      home: home.team ? (home.team.displayName || home.team.name) : '?',
      away: away.team ? (away.team.displayName || away.team.name) : '?',
      hs: status === 'pre' || status === 'ppd' ? null : Number(home.score),
      as: status === 'pre' || status === 'ppd' ? null : Number(away.score),
      hrec: rec(home), arec: rec(away),
      hline: line(home), aline: line(away),
      detail: status === 'in' ? (comp.status && comp.status.type && comp.status.type.shortDetail) || '' : '',
      status,
      venue: (comp.venue && comp.venue.fullName) || '',
    });
  }
  return { events: evs, note: 'ESPN' };
}

/* --- 取り込み済みJSON(B.LEAGUE・日本代表)。同一オリジンなのでCORSの心配がない --- */
async function localFetch(lgKey) {
  const j = await fetchJson(LEAGUES[lgKey].file + '?t=' + Date.now(), 15000);
  const raw = [].concat(j.games || [], j.manualGames || []);
  const seen = new Set();
  const evs = [];
  for (const g of raw) {
    if (!g || !g.home || !g.away) continue;
    const id = lgKey + '_' + (g.id || (g.dateJst + g.home + g.away));
    if (seen.has(id)) continue;
    seen.add(id);
    const hs = g.hs == null || g.hs === '' ? null : Number(g.hs);
    const as = g.as == null || g.as === '' ? null : Number(g.as);
    let status = g.status || 'pre';
    if (!g.status) {
      if (hs != null && as != null) status = 'post';
      else if (g.ts && g.ts < Date.now() - 4 * 3600 * 1000) status = 'nores';
    }
    evs.push({
      id, league: lgKey,
      ts: g.ts || null,
      dateJst: g.dateJst || (g.ts ? dateKey(new Date(g.ts)) : null),
      timeJst: g.timeJst || null,
      home: g.home, away: g.away, hs, as,
      hrec: g.hrec || '', arec: g.arec || '',
      hline: [], aline: [], detail: '',
      status, venue: g.venue || '', label: g.label || '',
    });
  }
  return {
    events: evs,
    standings: j.standings || [],
    roster: j.roster || [],
    updatedAt: j.updatedAt || null,
    note: (j.source || '自動取り込み') + (j.updatedAt ? '(' + j.updatedAt.slice(0, 10) + '更新)' : ''),
    warn: j.note || '',
  };
}

/* --- NBA順位表。返ってくる形が変わっても拾えるように、entries を再帰的に探す --- */
function walkStandings(node, groupName, out, depth) {
  if (!node || typeof node !== 'object' || depth > 6) return;
  const name = node.name || node.displayName || node.abbreviation || groupName;
  if (node.standings && Array.isArray(node.standings.entries)) {
    const rows = node.standings.entries.map(en => {
      const stat = key => {
        const s = (en.stats || []).find(x => x.name === key || x.abbreviation === key || x.shortDisplayName === key);
        return s ? (s.displayValue != null ? s.displayValue : s.value) : null;
      };
      return {
        team: (en.team && (en.team.displayName || en.team.name)) || '?',
        abbr: (en.team && en.team.abbreviation) || '',
        w: stat('wins'), l: stat('losses'),
        pct: stat('winPercent'), gb: stat('gamesBehind'),
        streak: stat('streak'), l10: stat('lasttengames') || stat('L10'),
        seed: Number(stat('playoffSeed')) || null,
      };
    }).filter(r => r.w != null || r.l != null);
    if (rows.length) out.push({ group: name || '順位表', rows });
  }
  for (const key of ['children', 'groups']) {
    if (Array.isArray(node[key])) for (const ch of node[key]) walkStandings(ch, name, out, depth + 1);
  }
}
async function refreshNbaRank(force) {
  const c = state.cache.nbaRank;
  if (!force && c && c.fetchedAt && Date.now() - c.fetchedAt < 30 * 60 * 1000) return;
  const urls = [
    'https://site.api.espn.com/apis/v2/sports/basketball/nba/standings?level=3',
    'https://site.web.api.espn.com/apis/v2/sports/basketball/nba/standings?level=3',
  ];
  let groups = [], error = null;
  for (const u of urls) {
    try {
      const j = await fetchJson(u, 15000);
      const out = [];
      walkStandings(j, null, out, 0);
      if (out.length) { groups = out; error = null; break; }
      error = '順位表のデータが空でした';
    } catch(e) { error = '取得失敗(' + e.message + ')'; }
  }
  // 各グループを順位順に並べ、勝率が無い場合は勝敗から計算する
  for (const g of groups) {
    for (const r of g.rows) {
      const w = Number(r.w), l = Number(r.l);
      if ((r.pct == null || r.pct === '') && !isNaN(w) && !isNaN(l) && w + l > 0) r.pct = (w / (w + l)).toFixed(3);
    }
    g.rows.sort((a, b) => (a.seed || 99) - (b.seed || 99) || parseFloat(b.pct || 0) - parseFloat(a.pct || 0));
    g.rows.forEach((r, i) => { if (!r.seed) r.seed = i + 1; });
  }
  state.cache.nbaRank = {
    groups: groups.length ? groups : ((c && c.groups) || []),
    fetchedAt: groups.length ? Date.now() : ((c && c.fetchedAt) || null),
    error: groups.length ? null : (error || '取得できませんでした'),
  };
  saveCache();
}

const LEADER_WANT = [

  { keys:['avgRebounds','rebounds'], label:'リバウンド', unit:'本' },

function pickLeaders(json) {
  const cats = (json && (json.categories || (json.leaders && json.leaders.categories))) || [];
  const out = [];
  for (const want of LEADER_WANT) {
    const cat = cats.find(c => want.keys.includes(c.name) || want.keys.includes(c.abbreviation));
    if (!cat) continue;
    const rows = (cat.leaders || []).slice(0, 5).map(ld => ({
      name: (ld.athlete && (ld.athlete.displayName || ld.athlete.fullName)) || '?',
      team: (ld.team && (ld.team.abbreviation || ld.team.displayName)) || '',
      value: ld.displayValue || (ld.value != null ? String(ld.value) : ''),
    })).filter(r => r.name !== '?');
    if (rows.length) out.push({ label: want.label, unit: want.unit, rows });
  }
  return out;
}

// 出場時間あたりの働きから機械的に★をつける(公式の評価ではありません)
function ratePlayer(st) {
  if (!st) return null;
  const ppg = parseFloat(st.ppg), mpg = parseFloat(st.mpg), g = Number(st.games || 0);
  if (isNaN(ppg)) return null;
  const eff = ppg + parseFloat(st.rpg || 0) + parseFloat(st.apg || 0);
  const s = eff >= 30 ? 5 : eff >= 20 ? 4 : eff >= 12 ? 3 : eff >= 6 ? 2 : 1;
  return { stars: s, low: g < 5 || (!isNaN(mpg) && mpg < 8) };
}

function sortByTime(evs) {

function groupByDate(evs) {
  const map = new Map();
  for (const e of evs) {
    const k = e.dateJst || '日程未定';

  return Array.from(map.entries()).sort((a, b) => a[0] < b[0] ? -1 : 1);
}

/* ================= 描画:共通パーツ ================= */
function statusHtml(e) {
  if (e.status === 'in')    return `<span class="live">● LIVE ${esc(e.detail || '')}</span>`;
  if (e.status === 'post')  return `<span class="fin">終了</span>`;
  if (e.status === 'ppd')   return `<span class="ppd">中止・延期</span>`;
  if (e.status === 'nores') return `<span class="ppd">結果待ち</span>`;
  return '';
}
function searchUrl(e) {
  const q = `${jaTeam(e.home, e.league)} ${jaTeam(e.away, e.league)} 中継`;
  return 'https://www.google.com/search?q=' + encodeURIComponent(q);
}
function quartersHtml(e) {
  if (!e.hline || !e.hline.length || e.hline.length !== e.aline.length) return '';
  const cells = e.hline.map((v, i) => `<span>${e.aline[i]}-${v}</span>`).join('');
  return `<div class="g-quarters">${cells}</div>`;
}
function gameCard(e) {
  const lg = LEAGUES[e.league];
  const done = e.hs != null && e.as != null;
  const fin = done && e.status === 'post';                 // 試合中は勝者を色分けしない
  const hWin = fin && e.hs > e.as, aWin = fin && e.as > e.hs;
  const memo = state.bcast.overrides[e.id];
  const bc = memo != null ? memo : bcastPreset(e.league);
  const teamHtml = (side) => {
    const name = e[side];
    const rec = e[side === 'home' ? 'hrec' : 'arec'];
    const win = side === 'home' ? hWin : aWin;
    return `<div class="g-team ${side} ${win ? 'win' : ''}" data-focus-lg="${e.league}" data-focus-team="${esc(name)}">`
      + `${esc(jaTeam(name, e.league))}${rec ? `<span class="rec">${esc(rec)}</span>` : ''}</div>`;
  };
  let center;
  if (done) center = `<div class="g-score">${e.hs} - ${e.as}</div>`;
  else if (e.status === 'ppd') center = `<div class="g-venue">中止</div>`;
  else center = `<div class="g-time">${e.timeJst || '時刻未定'}</div>`;
  return `<div class="game" data-id="${esc(e.id)}">
    <div class="g-top">
      <span class="g-lg">${lg.icon} ${esc(e.label || lg.short)}</span>
      ${e.venue ? `<span class="g-venue">${esc(e.venue)}</span>` : ''}
      <span class="g-status">${statusHtml(e)}</span>
    </div>
    <div class="g-main">
      ${teamHtml('home')}
      <div class="g-center">${center}</div>
      ${teamHtml('away')}
    </div>
    ${quartersHtml(e)}
    ${e.status === 'nores' ? '<div class="g-nores">まだ結果が反映されていません。公式サイトで確認できます</div>' : ''}
    <div class="g-bcast">
      <span>📺</span>
      <span class="txt ${memo != null ? 'memo' : ''}">${esc(bc || '視聴先は未設定')}</span>
      <button class="memo-btn" data-id="${esc(e.id)}" title="この試合の視聴先メモ">✏️</button>
    </div>
    <div class="g-links">
      <a href="${searchUrl(e)}" target="_blank" rel="noopener">中継を探す</a>
      ${lg.links.map(l => `<a href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join('')}
    </div>
  </div>`;
}
function dateSection(key, evs) {
  const isToday = key === todayKey();
  const label = key === '日程未定' ? '日程未定' : keyToLabel(key) + (isToday ? ' 今日' : '');
  return `<div class="date-head ${isToday ? 'today' : ''}">${esc(label)}</div>`
    + sortByTime(evs).map(gameCard).join('');
}
function emptyNote(msg, links) {
  return `<div class="empty-note">${msg}
    ${links ? `<div class="g-links">${links.map(l => `<a href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join('')}</div>` : ''}
  </div>`;
}
function leagueLinksAll() {
  const out = [];
  for (const k of enabledKeys()) for (const l of LEAGUES[k].links) out.push(l);
  return out;
}

/* ================= 描画:ホーム ================= */
function renderHome() {
  const t = todayKey();
  const evs = applyFilter(allEvents());
  let html = '';

  const today = evs.filter(e => e.dateJst === t);
  html += `<div class="sec-title">🏀 今日の試合 <small>${keyToLabel(t)}</small></div>`;
  html += today.length ? sortByTime(today).map(gameCard).join('')
    : emptyNote('今日の試合はありません。<br>「日程」タブで今後の試合を確認できます。');

  // フォロー中のチーム
  const follows = followedList();
  if (follows.length) {
    html += `<div class="sec-title">⭐ フォロー中のチーム</div>`;
    for (const f of follows) {
      const mine = allEvents().filter(e => e.league === f.league && (e.home === f.team || e.away === f.team));
      const next = sortByTime(mine.filter(e => e.status === 'pre' && (e.dateJst || '') >= t))[0];
      const last = sortByTime(mine.filter(e => e.hs != null)).slice(-1)[0];
      const name = jaTeam(f.team, f.league);
      html += `<div class="card-box">
        <div style="display:flex;align-items:center;gap:8px">
          <b style="flex:1">${LEAGUES[f.league].icon} ${esc(name)}</b>
          <button class="t-chip focus-btn" data-lg="${f.league}" data-team="${esc(f.team)}">このチームだけ表示</button>
        </div>`;
      if (next) {
        const d = next.dateJst ? daysBetween(t, next.dateJst) : null;
        const when = d === 0 ? '今日' : d === 1 ? '明日' : d != null ? `あと${d}日` : '';
        html += `<div class="follow-mini">次の試合: <b>${esc(when)}</b> ${esc(keyToLabel(next.dateJst || t))} ${esc(next.timeJst || '')} vs ${esc(jaTeam(next.home === f.team ? next.away : next.home, f.league))}</div>`;
      } else {
        html += `<div class="follow-mini">次の試合は取得できた範囲にありません</div>`;
      }
      if (last) {
        const mineHome = last.home === f.team;
        const my = mineHome ? last.hs : last.as, op = mineHome ? last.as : last.hs;
        const res = my > op ? '<b style="color:var(--win)">○勝ち</b>' : my < op ? '<b style="color:var(--live)">●負け</b>' : '引き分け';
        html += `<div class="follow-mini">直近の結果: ${res} ${my}-${op} vs ${esc(jaTeam(mineHome ? last.away : last.home, f.league))}</div>`;
      }
      html += `</div>`;
    }
  } else {
    html += `<div class="sec-title">⭐ 応援するチームを登録</div>`;
    html += `<div class="card-box"><div class="follow-mini">
      チームをフォローすると、次の試合までの日数と直近の結果がここに出ます。<br>
      試合カードのチーム名をタップ → 「フォロー」でも登録できます。</div></div>`;
  }

  // 日本代表の次戦
  if (state.settings.enabled.jpn) {
    const jp = sortByTime(allEvents().filter(e => e.league === 'jpn' && (e.dateJst || '') >= t))[0];
    html += `<div class="sec-title">🎌 バスケ日本代表</div>`;
    if (jp) {
      const d = jp.dateJst ? daysBetween(t, jp.dateJst) : null;
      html += `<div class="card-box"><div class="follow-mini">次の試合まで <b style="font-size:1.3rem;color:var(--or)">${d != null ? d : '—'}</b> 日</div></div>`;
      html += gameCard(jp);
    } else {
      html += emptyNote('次の代表戦の日程はまだ取り込まれていません。<br>公式サイトで確認できます。', LEAGUES.jpn.links);
    }
  }

  // 取得状況
  const errs = [];
  for (const k of enabledKeys()) {
    const c = state.cache[k];
    if (c && c.error) errs.push(`${LEAGUES[k].icon}${LEAGUES[k].short}: ${c.error}`);
  }
  if (errs.length) {
    html += `<div class="sec-title">🩺 データの状況</div>`;
    html += `<div class="card-box"><div class="diag">${errs.map(e => '・' + esc(e)).join('<br>')}
      <br><br>各リーグの公式サイトでは最新の情報が確認できます。</div>
      <div class="g-links">${leagueLinksAll().map(l => `<a href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join('')}</div></div>`;
  }
  $('#page-home').innerHTML = html;
}

/* ================= 描画:日程 / 結果 ================= */
function renderSched() {
  const t = todayKey();
  const evs = applyFilter(allEvents()).filter(e => (e.dateJst || '9999') >= t && e.status !== 'post');
  const groups = groupByDate(evs).slice(0, 30);
  let html = `<div class="sec-title">📅 これからの試合 <small>${evs.length}試合</small></div>`;
  html += groups.length ? groups.map(([k, v]) => dateSection(k, v)).join('')
    : emptyNote('これからの試合が見つかりませんでした。<br>オフシーズンか、まだデータが取り込まれていない可能性があります。', leagueLinksAll());
  $('#page-sched').innerHTML = html;
}
function renderResult() {
  const evs = applyFilter(allEvents()).filter(e => e.hs != null && e.as != null && e.status !== 'in');
  const groups = groupByDate(evs).reverse().slice(0, 20);
  let html = `<div class="sec-title">🏁 試合結果 <small>新しい順</small></div>`;
  html += groups.length ? groups.map(([k, v]) => dateSection(k, v)).join('')
    : emptyNote('結果のある試合がまだありません。', leagueLinksAll());
  $('#page-result').innerHTML = html;
}

/* ================= 描画:順位表 ================= */
function rankTable(group, lgKey, opts) {
  const rows = group.rows;
  const conf = (opts && opts.playoffLines) && rows.length >= 10;   // カンファレンス形式のときだけ境界線を引く
  let html = `<div class="sec-title">${esc(jaGroup(group.group))}</div><div class="card-box"><div class="tbl-wrap"><table class="rank">
    <tr><th class="no">#</th><th class="tm">チーム</th><th>勝</th><th>敗</th><th>勝率</th><th>GB</th><th>直近10</th><th>連続</th></tr>`;
  rows.forEach((r, i) => {
    const mine = isFollowed(lgKey, r.team) || (state.focus && state.focus.team === r.team);
    const zone = conf ? (i < 6 ? 'po' : i < 10 ? 'pi' : 'out') : 'out';
    const line = conf && (i === 5 || i === 9) ? 'rank-line' : '';
    const st = String(r.streak || '');
    const stCls = /^W|勝/.test(st) ? 'streak-w' : /^L|敗/.test(st) ? 'streak-l' : '';
    html += `<tr class="${mine ? 'mine' : ''} ${line}">
      <td class="no">${i + 1}</td>
      <td class="tm"><span class="zone ${zone}"></span><span data-focus-lg="${lgKey}" data-focus-team="${esc(r.team)}">${esc(jaTeam(r.team, lgKey))}</span></td>
      <td>${esc(r.w != null ? r.w : '-')}</td>
      <td>${esc(r.l != null ? r.l : '-')}</td>
      <td>${esc(r.pct != null ? String(r.pct).replace(/^0/, '') : '-')}</td>
      <td>${esc(r.gb != null && r.gb !== '' ? r.gb : '-')}</td>
      <td>${esc(r.l10 || '-')}</td>
      <td class="${stCls}">${esc(r.streak || '-')}</td>
    </tr>`;
  });
  html += `</table></div>`;
  if (conf) {
    html += `<div class="rank-note">
      <span class="zone po"></span> 上位6チーム = プレーオフ進出圏 /
      <span class="zone pi"></span> 7〜10位 = プレーイン圏</div>`;
  }
  return html + `</div>`;
}
function renderRank() {
  const chips = ['nba', 'b1'].filter(k => state.settings.enabled[k]);
  if (!chips.includes(state.rankLeague)) state.rankLeague = chips[0] || 'nba';
  let html = `<div class="chip-bar" style="padding-top:0">`
    + chips.map(k => `<button class="sp-chip ${state.rankLeague === k ? 'on' : ''}" data-rank-lg="${k}">${LEAGUES[k].icon} ${esc(LEAGUES[k].short)}</button>`).join('')
    + `</div>`;

  if (state.rankLeague === 'nba') {
    const c = state.cache.nbaRank;
    if (c && c.groups && c.groups.length) {
      html += c.groups.map(g => rankTable(g, 'nba', { playoffLines: true })).join('');
      html += `<div class="rank-note" style="margin:0 2px 14px">取得元: ESPN(${esc(fmtAgo(c.fetchedAt))})</div>`;
    } else {
      html += emptyNote('NBAの順位表を取得できませんでした。' + (c && c.error ? '<br><small>' + esc(c.error) + '</small>' : ''), LEAGUES.nba.links);
    }
  } else {
    const c = state.cache.b1;
    const st = (c && c.standings) || [];
    if (st.length) {
      const groups = new Map();
      for (const r of st) {
        const g = r.group || 'B.LEAGUE';
        if (!groups.has(g)) groups.set(g, []);
        groups.get(g).push(r);
      }
      for (const [name, rows] of groups) {
        rows.sort((a, b) => (a.rank || 99) - (b.rank || 99) || parseFloat(b.pct || 0) - parseFloat(a.pct || 0));
        html += rankTable({ group: name, rows }, 'b1', { playoffLines: false });
      }
      html += `<div class="rank-note" style="margin:0 2px 14px">取得元: ${esc((c && c.source) || '自動取り込み')}</div>`;
    } else {
      html += emptyNote('B.LEAGUEの順位表はまだ取り込まれていません。<br>公式サイトの順位表で確認できます。', LEAGUES.b1.links);
    }
  }
  $('#page-rank').innerHTML = html;
}

/* ================= 描画:選手 ================= */
function starHtml(rate) {
  return `<span class="jp-stars s${rate.stars}">${'★'.repeat(rate.stars)}${'☆'.repeat(5 - rate.stars)}</span>`;
}
function jpPlayerCard(p) {
  const st = p.stats || {};
  const rate = ratePlayer(st);
  const pill = (v, label) => v == null || v === '' ? '' : `<span class="jp-pill">${esc(v)}<small>${label}</small></span>`;
  return `<div class="card-box">
    <div class="jp-name">${esc(jaPlayer(p.name))}
      <small>${esc(jaTeam(p.team || '', 'nba'))}${p.pos ? ' / ' + esc(p.pos) : ''}</small></div>
    <div class="jp-pills">
      ${pill(st.ppg, '得点')}${pill(st.rpg, 'リバウンド')}${pill(st.apg, 'アシスト')}
      ${pill(st.mpg, '出場分')}${pill(st.fgPct, 'FG%')}${pill(st.games, '試合')}
    </div>
    ${rate ? `<div class="jp-rate">${starHtml(rate)} <b>${RATE_LABEL[rate.stars]}</b>
      <small>${rate.low ? '(出場が少ないため参考値)' : '(得点+リバウンド+アシストからの自動判定)'}</small></div>` : ''}
    <div class="g-links">
      <button class="focus-btn" data-lg="nba" data-team="${esc(p.team || '')}">チームの試合を見る</button>
      <a href="https://www.google.com/search?q=${encodeURIComponent(jaPlayer(p.name) + ' NBA 成績')}" target="_blank" rel="noopener">検索</a>
    </div>
  </div>`;
}
function renderPlayer() {
  let html = '';

  // NBAの日本人選手
  if (state.settings.enabled.nba) {
    const c = state.cache.jp;
    html += `<div class="sec-title">🇯🇵 NBAの日本人選手 <small>${c && c.players ? c.players.length + '人' : ''}</small></div>`;
    if (c && c.players && c.players.length) {
      html += c.players.map(jpPlayerCard).join('');
    } else {
      html += emptyNote('日本人選手のデータがまだありません。' + (c && c.error ? '<br><small>' + esc(c.error) + '</small>' : '')
        + '<br>この一覧は毎日サーバー側で自動更新されます。', [['NBA公式(選手)', 'https://www.nba.com/players']]);
    }

    // 部門別リーダー
    const l = state.cache.nbaLeaders;
    html += `<div class="sec-title">📈 NBA 部門別リーダー</div>`;
    if (l && l.cats && l.cats.length) {
      for (const cat of l.cats) {
        html += `<div class="card-box"><b style="font-size:.9rem">${esc(cat.label)}</b>`;
        cat.rows.forEach((r, i) => {
          html += `<div class="leader-row"><span class="no">${i + 1}</span>
            <span class="nm">${esc(jaPlayer(r.name))}<small>${esc(r.team)}</small></span>
            <span class="val">${esc(r.value)}</span></div>`;
        });
        html += `</div>`;
      }
    } else {

        [['NBA公式(スタッツ)', 'https://www.nba.com/stats']]);
    }
  }

  // 日本代表メンバー
  if (state.settings.enabled.jpn) {

    html += `<div class="sec-title">🎌 日本代表メンバー</div>`;
    if (roster.length) {
      html += `<div class="card-box">` + roster.map((p, i) => `<div class="leader-row">
        <span class="no">${p.no != null ? esc(p.no) : i + 1}</span>
        <span class="nm">${esc(p.name)}<small>${esc(p.team || '')}${p.pos ? ' / ' + esc(p.pos) : ''}</small></span>
      </div>`).join('') + `</div>`;
    } else {
      html += emptyNote('招集メンバーはまだ取り込まれていません。<br>大会期間に入ると更新されます。', LEAGUES.jpn.links);
    }
  }

  // B.LEAGUE の選手成績は公開APIが無いので公式へ誘導する
  if (state.settings.enabled.b1) {
    html += `<div class="sec-title">🇯🇵 B.LEAGUEの選手成績</div>`;
    html += emptyNote('B.LEAGUEの個人成績は公開APIが無いため、公式サイトのスタッツページで確認できます。',
      [['B.LEAGUE スタッツ', 'https://www.bleague.jp/stats/'], ['選手一覧', 'https://www.bleague.jp/player_list/']]);

  $('#page-player').innerHTML = html;
}

/* ================= 描画:設定 ================= */

    html += `<div class="set-row">

  if (follows.length) {
    html += `<div class="team-chips">` + follows.map(f =>
      `<button class="t-chip on" data-unfollow="${esc(followKey(f.league, f.team))}">${LEAGUES[f.league].icon} ${esc(jaTeam(f.team, f.league))} ✕</button>`).join('') + `</div>`;
  } else {
    html += `<div class="follow-mini">試合カードや順位表のチーム名をタップすると登録できます。</div>`;
  }
  html += `</div>`;

  // 診断
  html += `<div class="sec-title">🩺 診断 <small>データの取得状況</small></div><div class="card-box"><div class="diag">`;
  for (const k of LEAGUE_KEYS) {
    const c = state.cache[k];
    if (!state.settings.enabled[k]) { html += `<div>${LEAGUES[k].icon} <b>${esc(LEAGUES[k].short)}</b>: 非表示</div>`; continue; }
    if (!c || !c.fetchedAt) { html += `<div>${LEAGUES[k].icon} <b>${esc(LEAGUES[k].short)}</b>: <span class="ng">未取得</span></div>`; continue; }
    html += `<div>${LEAGUES[k].icon} <b>${esc(LEAGUES[k].short)}</b>: `
      + (c.error ? `<span class="ng">${esc(c.error)}</span>` : `<span class="ok">${c.events.length}試合</span>`)
      + ` <small>${esc(c.source || '')} / ${fmtAgo(c.fetchedAt)}</small></div>`;
  }
  const nr = state.cache.nbaRank, nl = state.cache.nbaLeaders, jp = state.cache.jp;

    html += `<div>📊 <b>NBA順位表</b>: ` + (nr && nr.groups && nr.groups.length ? `<span class="ok">${nr.groups.length}グループ</span>` : `<span class="ng">${esc((nr && nr.error) || '未取得')}</span>`) + `</div>`;
    html += `<div>📈 <b>NBAリーダー</b>: ` + (nl && nl.cats && nl.cats.length ? `<span class="ok">${nl.cats.length}部門</span>` : `<span class="ng">${esc((nl && nl.error) || '未取得')}</span>`) + `</div>`;
    html += `<div>🇯🇵 <b>日本人選手</b>: ` + (jp && jp.players && jp.players.length ? `<span class="ok">${jp.players.length}人</span>` : `<span class="ng">${esc((jp && jp.error) || '未取得')}</span>`) + `</div>`;
  }
  const rep = state.cache.report;
  if (rep && rep.sources && rep.sources.length) {
    html += `<div style="margin-top:8px"><b>サーバー側の自動取り込み</b>（${esc((rep.ranAt || '').slice(0, 16).replace('T', ' '))}）</div>`;
    for (const s of rep.sources) {
      html += `<div>・${esc(s.name)}: ` + (s.ok ? `<span class="ok">${esc(s.detail || 'OK')}</span>` : `<span class="ng">${esc(s.detail || '失敗')}</span>`) + `</div>`;
    }
  }
  html += `</div></div>`;

  html += `<div class="sec-title">🔗 公式サイト</div><div class="card-box">`;
  for (const k of LEAGUE_KEYS) {
    html += `<div class="set-row"><div class="grow">${LEAGUES[k].icon} ${esc(LEAGUES[k].short)}</div>
      <div class="g-links">${LEAGUES[k].links.map(l => `<a href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join('')}</div></div>`;
  }
  html += `</div>`;

  html += `<div class="card-box">
    <button class="btn sub" id="reloadBtn">データを再取得する</button>
    <button class="btn warn" id="clearBtn" style="margin-top:8px;width:100%">保存データを消す</button>
    <div class="follow-mini">取得したデータは端末内(LocalStorage)にだけ保存されます。</div>
  </div>`;
  $('#page-set').innerHTML = html;
}

/* ================= 描画:全体 ================= */
function renderChips() {
  const keys = enabledKeys();
  let html = `<button class="sp-chip ${state.settings.filter === 'all' ? 'on' : ''}" data-f="all">すべて</button>`;
  for (const k of keys) {
    html += `<button class="sp-chip ${state.settings.filter === k ? 'on' : ''}" data-f="${k}">${LEAGUES[k].icon} ${esc(LEAGUES[k].short)}</button>`;
  }
  $('#chipBar').innerHTML = html;
}
function renderNet() {
  const b = $('#netBanner');
  if (state.fetchNote) { b.textContent = '⏳ ' + state.fetchNote; b.classList.add('show'); }
  else if (!navigator.onLine) { b.textContent = '📴 オフラインです。最後に取得した内容を表示しています'; b.classList.add('show'); }
  else b.classList.remove('show');
}
function renderFocus() {
  const f = $('#focusBanner');
  if (state.focus) {
    $('#focusLabel').textContent = jaTeam(state.focus.team, state.focus.league) + ' だけ表示中';
    f.classList.add('show');
  } else f.classList.remove('show');
}
function render() {
  $('#headDate').textContent = keyToLabel(todayKey());
  renderChips();
  renderFocus();
  renderNet();
  renderHome(); renderSched(); renderResult(); renderRank(); renderPlayer();
  // 設定タブの入力中に描き直すと入力が消えるので、フォーカス中は触らない
  const active = document.activeElement;
  if (!(active && active.closest && active.closest('#page-set'))) renderSet();
  $$('#navBar button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  $$('.tab-page').forEach(p => p.classList.toggle('on', p.id === 'page-' + state.tab));
}

/* ================= モーダル ================= */
function openModal(html) { $('#modalBox').innerHTML = html; $('#modalWrap').classList.add('show'); }
function closeModal() { $('#modalWrap').classList.remove('show'); }
$('#modalWrap').addEventListener('click', e => { if (e.target.id === 'modalWrap') closeModal(); });

function openTeamModal(lg, team) {
  const name = jaTeam(team, lg);
  const followed = isFollowed(lg, team);
  openModal(`<h3>${LEAGUES[lg].icon} ${esc(name)}</h3>
    <div class="m-sub">${esc(LEAGUES[lg].name)}</div>
    <button class="btn ${followed ? 'sub' : ''}" id="mFollow" style="width:100%">
      ${followed ? '⭐ フォローを解除する' : '⭐ このチームをフォローする'}</button>
    <button class="btn sub" id="mFocus" style="width:100%;margin-top:8px">🔎 このチームの試合だけ表示</button>
    <div class="g-links" style="margin-top:10px">
      <a href="https://www.google.com/search?q=${encodeURIComponent(name + ' 試合 日程')}" target="_blank" rel="noopener">日程を検索</a>
      <a href="https://www.google.com/search?q=${encodeURIComponent(name + ' ニュース')}" target="_blank" rel="noopener">ニュース</a>
    </div>
    <div class="m-btns"><button class="btn sub" id="mClose">閉じる</button></div>`);
  $('#mFollow').onclick = () => {
    if (followed) delete state.follow.teams[followKey(lg, team)];
    else state.follow.teams[followKey(lg, team)] = true;
    saveAll(); closeModal(); render();
  };
  $('#mFocus').onclick = () => { state.focus = { league: lg, team }; saveAll(); closeModal(); state.tab = 'sched'; render(); };
  $('#mClose').onclick = closeModal;
}

function openMemoModal(id) {
  const ev = allEvents().find(e => e.id === id);
  if (!ev) return;
  const cur = state.bcast.overrides[id];
  openModal(`<h3>📺 この試合の視聴先メモ</h3>
    <div class="m-sub">${esc(jaTeam(ev.home, ev.league))} vs ${esc(jaTeam(ev.away, ev.league))}<br>
      空欄で保存するとリーグの初期値(${esc(bcastPreset(ev.league))})に戻ります。</div>
    <textarea id="mMemo" rows="3" style="width:100%;padding:10px 11px">${esc(cur != null ? cur : '')}</textarea>
    <div class="m-btns">
      <button class="btn sub" id="mCancel">キャンセル</button>
      <button class="btn" id="mSave">保存</button>
    </div>`);
  $('#mCancel').onclick = closeModal;
  $('#mSave').onclick = () => {
    const v = $('#mMemo').value.trim();
    if (v) state.bcast.overrides[id] = v; else delete state.bcast.overrides[id];
    saveAll(); closeModal(); render();
  };
}

/* ================= 操作 ================= */
$('#navBar').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  state.tab = b.dataset.tab;
  render();
  window.scrollTo({ top: 0 });
});
$('#chipBar').addEventListener('click', e => {
  const b = e.target.closest('[data-f]');
  if (!b) return;
  state.settings.filter = b.dataset.f;
  saveAll(); render();
});
$('#refreshBtn').addEventListener('click', () => refreshAll(true));
$('#focusClear').addEventListener('click', () => { state.focus = null; saveAll(); render(); });

document.addEventListener('click', e => {
  const rankChip = e.target.closest('[data-rank-lg]');
  if (rankChip) { state.rankLeague = rankChip.dataset.rankLg; renderRank(); return; }

  const focusBtn = e.target.closest('.focus-btn');
  if (focusBtn) {
    state.focus = { league: focusBtn.dataset.lg, team: focusBtn.dataset.team };
    saveAll(); state.tab = 'sched'; render(); window.scrollTo({ top: 0 });
    return;
  }
  const memoBtn = e.target.closest('.memo-btn');
  if (memoBtn) { openMemoModal(memoBtn.dataset.id); return; }

  const unfollow = e.target.closest('[data-unfollow]');
  if (unfollow) { delete state.follow.teams[unfollow.dataset.unfollow]; saveAll(); render(); return; }

  const team = e.target.closest('[data-focus-lg]');
  if (team) { openTeamModal(team.dataset.focusLg, team.dataset.focusTeam); return; }

  if (e.target.id === 'reloadBtn') { refreshAll(true); return; }
  if (e.target.id === 'clearBtn') {
    if (confirm('フォロー・視聴先メモ・取得データをすべて消します。よろしいですか?')) {
      ['bnv_settings','bnv_follow','bnv_cache','bnv_bcast','bnv_focus'].forEach(k => localStorage.removeItem(k));
      location.reload();
    }
  }
});
document.addEventListener('change', e => {
  if (e.target.dataset.en) {
    state.settings.enabled[e.target.dataset.en] = e.target.checked;
    if (!state.settings.enabled[state.settings.filter]) state.settings.filter = 'all';
    saveAll(); render(); refreshAll(false);
  }
  if (e.target.dataset.bcast) {
    const lg = e.target.dataset.bcast, v = e.target.value.trim();
    if (v === LEAGUES[lg].bcast || !v) delete state.bcast.presets[lg];
    else state.bcast.presets[lg] = v;
    saveAll(); render();
  }
});
window.addEventListener('online', () => { renderNet(); refreshAll(false); });
window.addEventListener('offline', renderNet);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshAll(false); });

// 試合中は自動で更新する(ライブスコア)
setInterval(() => {
  if (document.hidden || !navigator.onLine) return;
  if (allEvents().some(e => e.status === 'in')) refreshAll(true);
}, 60000);

/* ================= 起動 ================= */
render();
refreshAll(false);
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
