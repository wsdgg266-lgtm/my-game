<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b101c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="スポカレ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<title>スポカレ！ - 試合日程・結果・視聴ガイド</title>
<style>
  :root {
    --bg: #0b101c;
    --card: #131b2e;
    --card2: #17213c;
    --text: #e9eef8;
    --text-sub: #8b96ad;
    --line: rgba(255,255,255,.08);
    --line2: rgba(255,255,255,.14);
    --cy: #3ee6ff;
    --vi: #7b5bff;
    --grad: linear-gradient(135deg, #3ee6ff, #7b5bff);
    --ink-on-grad: #071322;
    --win: #3ddc84;
    --live: #ff4d6d;
    --amber: #ffc24b;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    background: radial-gradient(900px 480px at 50% -180px, #1c2a55 0%, var(--bg) 62%) fixed, var(--bg);
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 92px;
    overflow-x: hidden;
    max-width: 100vw;
  }
  input, select, textarea {
    font-size: 16px !important;
    background: #0e1628; color: var(--text);
    border: 1.5px solid var(--line2); border-radius: 10px;
  }
  textarea { line-height: 1.6; }
  button { font-family: inherit; }
  a { color: var(--cy); }

  /* ---------- ヘッダー ---------- */
  header {
    background: rgba(11,16,28,.82);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
    color: var(--text);
    padding: calc(12px + env(safe-area-inset-top)) 14px 0;
    position: sticky; top: 0; z-index: 10;
  }
  .head-row { display: flex; align-items: center; gap: 8px; }
  header h1 { display: flex; align-items: baseline; gap: 9px; flex: 1; font-size: 1rem; }
  .logo {
    font-size: 1.3rem; font-weight: 900; font-style: italic; letter-spacing: .04em;
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    padding-right: 3px;
  }
  .head-date { font-size: .74rem; color: var(--text-sub); font-weight: normal; font-style: normal; }
  #refreshBtn {
    border: 1px solid var(--line2); background: rgba(255,255,255,.06); color: var(--text);
    width: 38px; height: 38px; border-radius: 50%; font-size: 18px; cursor: pointer;
    flex-shrink: 0; line-height: 1;
  }
  #refreshBtn.spin { animation: spin 1s linear infinite; color: var(--cy); border-color: var(--cy); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .chip-bar {
    display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none; padding: 11px 0 13px;
  }
  .chip-bar::-webkit-scrollbar { display: none; }
  .sp-chip {
    flex-shrink: 0; border: 1px solid var(--line2); background: rgba(255,255,255,.04);
    color: var(--text); border-radius: 999px; padding: 7px 14px; font-size: .87rem; cursor: pointer;
    display: flex; align-items: center; gap: 5px;
  }
  .sp-chip.on {
    background: var(--grad); color: var(--ink-on-grad); border-color: transparent; font-weight: 800;
    box-shadow: 0 2px 14px rgba(62,180,255,.35);
  }
  #focusBanner {
    display: none; align-items: center; gap: 8px;
    background: var(--grad); color: var(--ink-on-grad);
    margin: 0 -14px; padding: 9px 14px; font-size: .9rem; font-weight: 600;
  }
  #focusBanner.show { display: flex; }
  #focusBanner b { flex: 1; }
  #focusBanner button {
    border: none; background: rgba(7,19,34,.25); color: var(--ink-on-grad);
    border-radius: 999px; padding: 4px 13px; font-size: .85rem; cursor: pointer; font-weight: 700;
  }
  #netBanner {
    display: none; background: rgba(255,194,75,.1); color: #ffd47e; font-size: .82rem;
    margin: 0 -14px; padding: 6px 14px; border-bottom: 1px solid rgba(255,194,75,.25);
  }
  #netBanner.show { display: block; }

  /* ---------- 本文 ---------- */
  main { padding: 14px 14px 0; max-width: 640px; margin: 0 auto; }
  .tab-page { display: none; }
  .tab-page.on { display: block; }
  .sec-title {
    font-size: .95rem; font-weight: 800; color: var(--text);
    margin: 20px 2px 9px; display: flex; align-items: center; gap: 7px;
    letter-spacing: .02em;
  }
  .sec-title::before { content: ""; width: 4px; height: 15px; border-radius: 2px; background: var(--grad); }
  .sec-title:first-child { margin-top: 2px; }
  .sec-title small { color: var(--text-sub); font-weight: normal; font-size: .76rem; }
  .date-head {
    font-size: .84rem; font-weight: 700; color: var(--text-sub);
    margin: 18px 2px 7px; display: flex; align-items: center; gap: 6px;
    text-transform: uppercase; letter-spacing: .06em;
  }
  .date-head.today { color: var(--cy); }
  .empty-note {
    background: rgba(255,255,255,.02); border: 1px dashed var(--line2); border-radius: var(--radius);
    padding: 20px 14px; text-align: center; color: var(--text-sub); font-size: .9rem;
    line-height: 1.7; margin-bottom: 10px;
  }
  .empty-note a { color: var(--cy); }

  /* ---------- 試合カード ---------- */
  .game {
    background: linear-gradient(180deg, var(--card2), var(--card));
    border-radius: var(--radius); border: 1px solid var(--line);
    box-shadow: 0 10px 26px rgba(2,6,16,.45);
    padding: 11px 13px; margin-bottom: 10px;
    position: relative; overflow: hidden;
  }
  .game::before {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 3px;
    background: var(--grad); opacity: .9;
  }
  .g-top { display: flex; align-items: center; gap: 8px; font-size: .74rem; color: var(--text-sub); }
  .g-lg { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; letter-spacing: .05em; color: #b9c6e4; }
  .g-status { margin-left: auto; }
  .g-status .live { color: var(--live); font-weight: 800; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .4; } }
  .g-status .fin { color: var(--win); font-weight: 700; }
  .g-status .ppd { color: var(--amber); font-weight: 700; }
  .g-main {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: 8px; padding: 9px 0 6px;
  }
  .g-team { font-size: 1.02rem; font-weight: 800; line-height: 1.35; }
  .g-team.home { text-align: right; }
  .g-team.away { text-align: left; }
  .g-team.win { color: var(--win); text-shadow: 0 0 18px rgba(61,220,132,.35); }
  .g-center { text-align: center; min-width: 80px; }
  .g-score {
    font-size: 1.45rem; font-weight: 900; letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
  }
  .g-time {
    font-size: 1.05rem; font-weight: 900; letter-spacing: .04em;
    color: var(--cy); text-shadow: 0 0 16px rgba(62,230,255,.4);
    font-variant-numeric: tabular-nums;
  }
  .g-venue { font-size: .72rem; color: var(--text-sub); }
  .g-bcast {
    display: flex; align-items: flex-start; gap: 6px; font-size: .8rem; color: #cfe4f2;
    background: rgba(62,230,255,.06); border: 1px solid rgba(62,230,255,.14);
    border-radius: 10px; padding: 7px 9px; margin-top: 5px; line-height: 1.5;
  }
  .g-bcast .txt { flex: 1; }
  .g-bcast .memo { color: var(--amber); font-weight: 700; }
  .g-bcast button {
    border: none; background: none; font-size: 15px; cursor: pointer; padding: 0 2px;
    flex-shrink: 0;
  }
  .g-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .g-links a {
    font-size: .75rem; color: #b9c6e4; text-decoration: none;
    border: 1px solid var(--line2); border-radius: 999px; padding: 4px 11px;
    background: rgba(255,255,255,.04);
  }
  .g-nores { font-size: .76rem; color: var(--text-sub); }

  /* ---------- フォロー ---------- */
  .card-box {
    background: linear-gradient(180deg, var(--card2), var(--card));
    border-radius: var(--radius); border: 1px solid var(--line);
    box-shadow: 0 10px 26px rgba(2,6,16,.45);
    padding: 13px; margin-bottom: 12px;
  }
  .team-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
  .t-chip {
    border: 1px solid var(--line2); background: rgba(255,255,255,.04); color: var(--text);
    border-radius: 999px; padding: 7px 13px; font-size: .86rem; cursor: pointer;
  }
  .t-chip.on {
    border-color: rgba(62,230,255,.55); background: rgba(62,230,255,.12); color: var(--cy);
    font-weight: 800; box-shadow: 0 0 12px rgba(62,230,255,.18);
  }
  .player-row {
    display: flex; align-items: center; gap: 9px; padding: 10px 2px;
    border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .player-row:last-child { border-bottom: none; }
  .player-row .p-name { font-weight: 800; }
  .player-row .p-sub { font-size: .78rem; color: var(--text-sub); }
  .player-row .p-del {
    margin-left: auto; border: none; background: none; color: var(--text-sub);
    font-size: 17px; cursor: pointer; padding: 4px 6px;
  }
  .add-form { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .add-form input, .add-form select, .add-form textarea { padding: 10px 11px; width: 100%; }
  .btn {
    border: none; border-radius: 12px; padding: 12px 14px; font-size: .95rem;
    background: var(--grad); color: var(--ink-on-grad); cursor: pointer; font-weight: 800;
    letter-spacing: .02em;
  }
  .btn.sub { background: rgba(255,255,255,.08); color: var(--text); }
  .btn.warn { background: rgba(255,77,109,.14); color: var(--live); }
  .btn:disabled { opacity: .5; }
  .follow-mini { font-size: .8rem; color: var(--text-sub); margin-top: 4px; line-height: 1.7; }
  .follow-mini b { color: var(--text); }

  /* ---------- 設定 ---------- */
  .set-row { display: flex; align-items: center; gap: 10px; padding: 11px 2px; border-bottom: 1px solid var(--line); }
  .set-row:last-child { border-bottom: none; }
  .set-row .grow { flex: 1; }
  .set-row .desc { font-size: .76rem; color: var(--text-sub); margin-top: 2px; line-height: 1.5; }
  .toggle { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle .knob {
    position: absolute; inset: 0; background: #2a3550; border-radius: 999px; cursor: pointer;
    transition: background .15s;
  }
  .toggle .knob::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
    background: #fff; border-radius: 50%; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  .toggle input:checked + .knob { background: linear-gradient(135deg, #23c9e6, #6a4df0); }
  .toggle input:checked + .knob::after { left: 23px; }
  .diag { font-size: .78rem; color: var(--text-sub); line-height: 1.8; }
  .diag b { color: var(--text); }
  .diag .ok { color: var(--win); font-weight: 700; }
  .diag .ng { color: var(--live); font-weight: 700; }

  /* ---------- 下部ナビ ---------- */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    background: rgba(12,17,30,.88);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    display: flex; padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; border: none; background: none; padding: 9px 0 8px; cursor: pointer;
    font-size: .64rem; color: var(--text-sub); display: flex; flex-direction: column;
    align-items: center; gap: 3px; letter-spacing: .04em; position: relative;
  }
  nav button .ic { width: 22px; height: 22px; display: block; }
  nav button .ic svg { width: 100%; height: 100%; }
  nav button.on { color: var(--cy); font-weight: 700; }
  nav button.on::before {
    content: ""; position: absolute; top: 0; width: 26px; height: 3px;
    border-radius: 0 0 3px 3px; background: var(--grad);
  }

  /* ---------- モーダル ---------- */
  #modalWrap {
    display: none; position: fixed; inset: 0; z-index: 40;
    background: rgba(4,8,16,.66); align-items: flex-end; justify-content: center;
  }
  #modalWrap.show { display: flex; }
  #modalBox {
    background: var(--card2); border: 1px solid var(--line2); border-bottom: none;
    border-radius: 20px 20px 0 0; width: 100%; max-width: 640px;
    padding: 20px 16px calc(18px + env(safe-area-inset-bottom));
    max-height: 82vh; overflow-y: auto;
  }
  #modalBox::before {
    content: ""; display: block; width: 42px; height: 4px; border-radius: 2px;
    background: var(--line2); margin: -6px auto 14px;
  }
  #modalBox h3 { font-size: 1rem; color: var(--text); margin-bottom: 5px; }
  #modalBox .m-sub { font-size: .8rem; color: var(--text-sub); margin-bottom: 10px; line-height: 1.6; }
  .m-btns { display: flex; gap: 8px; margin-top: 15px; }
  .m-btns .btn { flex: 1; }

  .loading-note { text-align: center; color: var(--text-sub); font-size: .85rem; padding: 8px 0 4px; }

  /* ---------- MLB日本人選手 ---------- */
  .jp-name { font-size: 1.12rem; font-weight: 900; padding: 7px 0 4px; letter-spacing: .02em; }
  .jp-name small { font-size: .72rem; color: var(--text-sub); font-weight: normal; margin-left: 6px; }
  .jp-pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
  .jp-pill {
    display: inline-flex; align-items: baseline; gap: 5px;
    background: rgba(255,255,255,.05); border: 1px solid var(--line2);
    border-radius: 8px; padding: 4px 9px; font-size: .92rem; font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .jp-pill small { font-size: .68rem; color: var(--text-sub); font-weight: normal; }
  .jp-rate { font-size: .84rem; margin: 5px 0 3px; color: var(--text); }
  .jp-rate small { color: var(--text-sub); }
  .jp-stars { letter-spacing: 2px; font-size: .95rem; }
  .jp-stars.s5, .jp-stars.s4 { color: var(--amber); text-shadow: 0 0 12px rgba(255,194,75,.45); }
  .jp-stars.s3 { color: #d9c9a0; }
  .jp-stars.s2, .jp-stars.s1 { color: var(--text-sub); }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <h1><span class="logo">スポカレ</span><span class="head-date" id="headDate"></span></h1>
    <button id="refreshBtn" title="データを再取得">↻</button>
  </div>
  <div id="netBanner"></div>
  <div id="focusBanner">
    <span>🔎</span><b id="focusLabel"></b>
    <button id="focusClear">解除</button>
  </div>
  <div class="chip-bar" id="chipBar"></div>
</header>

<main>
  <div class="tab-page" id="page-home"></div>
  <div class="tab-page" id="page-sched"></div>
  <div class="tab-page" id="page-result"></div>
  <div class="tab-page" id="page-jp"></div>
  <div class="tab-page" id="page-follow"></div>
  <div class="tab-page" id="page-set"></div>
</main>

<nav id="navBar">
  <button data-tab="home"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/></svg></span>ホーム</button>
  <button data-tab="sched"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>日程</button>
  <button data-tab="result"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h13l-2.6 4L18 12H5"/></svg></span>結果</button>
  <button data-tab="jp"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/></svg></span>日本人</button>
  <button data-tab="follow"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3.5 2.7 5.6 6.1.8-4.5 4.3 1.2 6L12 17.3l-5.5 2.9 1.2-6L3.2 9.9l6.1-.8Z"/></svg></span>フォロー</button>
  <button data-tab="set"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.7M12 18.5v2.7M2.8 12h2.7M18.5 12h2.7M5.5 5.5l1.9 1.9M16.6 16.6l1.9 1.9M18.5 5.5l-1.9 1.9M7.4 16.6l-1.9 1.9"/></svg></span>設定</button>
</nav>

<div id="modalWrap"><div id="modalBox"></div></div>

<script>
'use strict';

/* ================= ユーティリティ ================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const sleep = ms => new Promise(r => setTimeout(r, ms));

const JST = 'Asia/Tokyo';
const dateKeyFmt = new Intl.DateTimeFormat('sv-SE', { timeZone: JST, year:'numeric', month:'2-digit', day:'2-digit' });
const timeFmt = new Intl.DateTimeFormat('ja-JP', { timeZone: JST, hour:'2-digit', minute:'2-digit', hour12:false });
const wdFmt = new Intl.DateTimeFormat('ja-JP', { timeZone: JST, weekday:'short' });
function dateKey(d) { return dateKeyFmt.format(d); }               // "2026-07-15"(JST)
function todayKey() { return dateKey(new Date()); }
function keyToLabel(key) {
  const [y,m,d] = key.split('-').map(Number);
  const wd = wdFmt.format(new Date(Date.UTC(y, m-1, d, 3)));       // JST正午相当で曜日算出
  return `${m}/${d}(${wd})`;
}
function addDaysKey(key, n) {
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d, 3));
  dt.setUTCDate(dt.getUTCDate() + n);
  return dateKey(dt);
}
function lsGet(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch(e) { return fb; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }

/* ================= リーグ定義 ================= */
const LEAGUES = {
  npb: { name:'プロ野球', short:'NPB', icon:'⚾', tsdbId:'4591', espn:null,
    bcast:'DAZN(広島主催除く) / スカパー！プロ野球セット / パは楽天TV・ベースボールLIVEなども',
    links:[['NPB公式','https://npb.jp/games/'],['スポナビ','https://baseball.yahoo.co.jp/npb/schedule/']] },
  mlb: { name:'MLB', short:'MLB', icon:'⚾', tsdbId:'4424', espn:'baseball/mlb',
    bcast:'SPOTV NOW / NHK BS / ABEMA(一部) など',
    links:[['MLB公式','https://www.mlb.com/schedule'],['スポナビ','https://baseball.yahoo.co.jp/mlb/schedule/']] },
};
const LEAGUE_KEYS = Object.keys(LEAGUES);

/* ================= チーム名の日本語化(表示用・なければ原文) ================= */
const TEAM_JA = {
  // --- NPB ---
  'Yomiuri Giants':'巨人', 'Hanshin Tigers':'阪神', 'Chunichi Dragons':'中日',
  'Hiroshima Toyo Carp':'広島', 'Hiroshima Carp':'広島', 'Tokyo Yakult Swallows':'ヤクルト',
  'Yokohama DeNA BayStars':'DeNA', 'Yokohama BayStars':'DeNA',
  'Fukuoka SoftBank Hawks':'ソフトバンク', 'Softbank Hawks':'ソフトバンク',
  'Saitama Seibu Lions':'西武', 'Seibu Lions':'西武',
  'Tohoku Rakuten Golden Eagles':'楽天', 'Rakuten Golden Eagles':'楽天', 'Rakuten Eagles':'楽天',
  'Chiba Lotte Marines':'ロッテ', 'Lotte Marines':'ロッテ',
  'Orix Buffaloes':'オリックス', 'Hokkaido Nippon-Ham Fighters':'日本ハム', 'Nippon-Ham Fighters':'日本ハム',
};
// MLBはニックネーム(名前の末尾)で日本語化
const NICK_JA = {
  'Dodgers':'ドジャース','Yankees':'ヤンキース','Mets':'メッツ','Cubs':'カブス','Padres':'パドレス',
  'Angels':'エンゼルス','Mariners':'マリナーズ','Giants':'ジャイアンツ','Athletics':'アスレチックス',

/* ================= データ取得層 ================= */
async function fetchJson(url, timeoutMs) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), timeoutMs || 12000);
  try {
    const res = await fetch(url, { signal: ctl.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally { clearTimeout(t); }
}

/* --- ESPN(キー不要): J1 / MLB / NBA --- */
async function espnFetch(lgKey) {
  const path = LEAGUES[lgKey].espn;
  const t = todayKey();
  const from = addDaysKey(t, -7).replace(/-/g, '');
  const to   = addDaysKey(t, 14).replace(/-/g, '');
  const base = `https://site.api.espn.com/apis/site/v2/sports/${path}/scoreboard`;
  let json;
  try {
    json = await fetchJson(`${base}?dates=${from}-${to}&limit=300`);
  } catch(e) {
    json = await fetchJson(base);           // 期間指定が使えない場合は当日分だけでも
  }
  const evs = [];
  for (const e of (json.events || [])) {
    const comp = e.competitions && e.competitions[0];
    if (!comp) continue;
    const home = (comp.competitors || []).find(c => c.homeAway === 'home');
    const away = (comp.competitors || []).find(c => c.homeAway === 'away');
    if (!home || !away) continue;
    const st = (comp.status && comp.status.type) || {};
    let status = 'pre';
    if (st.state === 'in') status = 'in';
    else if (st.state === 'post') status = 'post';
    if (/postpon|cancel/i.test(st.name || '') || /postpon|cancel/i.test(st.description || '')) status = 'ppd';
    const ts = Date.parse(e.date);
    evs.push({
      id: lgKey + '_' + e.id,
      league: lgKey,
      ts: isNaN(ts) ? null : ts,
      dateJst: isNaN(ts) ? null : dateKey(new Date(ts)),
      timeJst: isNaN(ts) ? null : timeFmt.format(new Date(ts)),
      home: home.team ? (home.team.displayName || home.team.name) : '?',
      away: away.team ? (away.team.displayName || away.team.name) : '?',
      hs: status === 'pre' || status === 'ppd' ? null : Number(home.score),
      as: status === 'pre' || status === 'ppd' ? null : Number(away.score),
      status,
      venue: comp.venue && comp.venue.fullName || '',
    });
  }
  return { events: evs, note: 'ESPN' };
}

/* --- TheSportsDB(無料キー123): NPB / B1、他リーグの予備 --- */
const TSDB_BASE = 'https://www.thesportsdb.com/api/v1/json/123/';
const TSDB_INTERVAL = window.SPX_TSDB_INTERVAL || 2200;   // テストから上書き可
let tsdbLast = 0;
async function tsdbJson(path) {                       // 30回/分制限があるので間隔を空ける
  const wait = tsdbLast + TSDB_INTERVAL - Date.now();
  if (wait > 0) await sleep(wait);
  tsdbLast = Date.now();
  return fetchJson(TSDB_BASE + path);
}
function tsdbNormalize(raw, lgKey) {
  let ts = null;
  if (raw.strTimestamp) ts = Date.parse(raw.strTimestamp.includes('T') ? raw.strTimestamp + (raw.strTimestamp.endsWith('Z') ? '' : 'Z') : raw.strTimestamp.replace(' ', 'T') + 'Z');
  if ((ts == null || isNaN(ts)) && raw.dateEvent) {
    ts = Date.parse(raw.dateEvent + 'T' + (raw.strTime && raw.strTime !== '00:00:00' ? raw.strTime : '03:00:00') + 'Z');
  }
  if (isNaN(ts)) ts = null;
  const timeUnknown = !raw.strTimestamp && (!raw.strTime || raw.strTime === '00:00:00');
  const hs = raw.intHomeScore != null && raw.intHomeScore !== '' ? Number(raw.intHomeScore) : null;
  const as = raw.intAwayScore != null && raw.intAwayScore !== '' ? Number(raw.intAwayScore) : null;
  let status = 'pre';
  if (String(raw.strPostponed).toLowerCase() === 'yes') status = 'ppd';
  else if (hs != null && as != null) status = 'post';
  else if (ts && ts < Date.now() - 5 * 3600 * 1000) status = 'nores';   // 終わったはずだが結果未反映
  return {
    id: lgKey + '_' + raw.idEvent,
    league: lgKey,
    ts,
    dateJst: ts ? dateKey(new Date(ts)) : (raw.dateEvent || null),
    timeJst: ts && !timeUnknown ? timeFmt.format(new Date(ts)) : null,
    home: raw.strHomeTeam || '?',
    away: raw.strAwayTeam || '?',
    hs, as, status,
    venue: raw.strVenue || '',
  };
}
async function tsdbFetch(lgKey) {
  const id = LEAGUES[lgKey].tsdbId;
  const map = new Map();
  const parts = [];
  const grab = async (label, path) => {
    try {
      const j = await tsdbJson(path);
      const arr = (j && (j.events || j.results)) || [];
      for (const raw of arr) { if (raw && raw.idEvent) map.set(raw.idEvent, raw); }
      parts.push(label + ':' + arr.length + '件');
      return arr.length;
    } catch(e) {
      parts.push(label + ':失敗');
      return 0;
    }
  };
  await grab('今後', 'eventsnextleague.php?id=' + id);
  await grab('過去', 'eventspastleague.php?id=' + id);
  // 直近の試合が薄い場合は日別APIで前後を補完(リクエスト数は控えめに)
  const t = todayKey();
  const have = new Set(Array.from(map.values()).map(r => r.dateEvent));
  const wantDays = [-1, 0, 1, 2].map(n => addDaysKey(t, n));
  if (wantDays.some(d => !have.has(d))) {
    for (const d of wantDays) {
      if (!have.has(d)) await grab(d.slice(5), 'eventsday.php?d=' + d + '&l=' + id);
    }
  }
  const evs = Array.from(map.values()).map(r => tsdbNormalize(r, lgKey));
  return { events: evs, note: 'TheSportsDB(' + parts.join(' ') + ')' };
}

async function refreshLeague(lgKey, force) {
  const c = state.cache[lgKey];
  if (!force && c && c.fetchedAt && Date.now() - c.fetchedAt < 15 * 60 * 1000) return;
  const lg = LEAGUES[lgKey];
  let result = null, error = null;
  if (lg.espn) {
    try { result = await espnFetch(lgKey); } catch(e) { error = 'ESPN失敗(' + e.message + ')'; }
  }
  if ((!result || result.events.length === 0) && lg.tsdbId) {
    try {
      const r = await tsdbFetch(lgKey);
      if (!result || r.events.length > 0) result = r;
    } catch(e) { error = (error ? error + ' / ' : '') + 'TheSportsDB失敗(' + e.message + ')'; }
  }
  state.cache[lgKey] = {
    events: result ? result.events : (c && c.events || []),
    fetchedAt: result ? Date.now() : (c && c.fetchedAt || null),
    source: result ? result.note : (c && c.source || null),
    error: result && result.events.length ? null : (error || (result ? 'データ0件でした' : '取得できませんでした')),
  };
  saveCache();
}

/* --- MLB StatsAPI(キー不要): 日本出身選手の今季成績 --- */
const seasonYear = () => Number(todayKey().slice(0, 4));
function jpNormalize(p) {
  const pos = (p.primaryPosition && p.primaryPosition.abbreviation) || '';
  const team = (p.currentTeam && p.currentTeam.name) || '';
  let hit = null, pitch = null;
  for (const s of (p.stats || [])) {
    const g = s.group && s.group.displayName;
    const st = s.splits && s.splits[0] && s.splits[0].stat;
    if (!st) continue;
    if (g === 'hitting') hit = { avg: st.avg, hr: st.homeRuns, rbi: st.rbi, ops: st.ops, sb: st.stolenBases, pa: st.plateAppearances, g: st.gamesPlayed };
    if (g === 'pitching') pitch = { era: st.era, w: st.wins, l: st.losses, sv: st.saves, so: st.strikeOuts, ip: st.inningsPitched, whip: st.whip, g: st.gamesPlayed };
  }
  // 投手の「ついでの打撃成績」はノイズなので隠す(大谷ら二刀流TWPは除く)
  if (pos === 'P' && hit && Number(hit.pa || 0) < 30) hit = null;
  return { id: p.id, name: p.fullName, team, pos, hit, pitch };
}
async function refreshJp(force) {
  if (!state.settings.enabled.mlb) return;
  const c = state.cache.jp;
  if (!force && c && c.fetchedAt && Date.now() - c.fetchedAt < 60 * 60 * 1000) return;
  try {
    const y = seasonYear();
    const list = await fetchJson(`https://statsapi.mlb.com/api/v1/sports/1/players?season=${y}&fields=people,id,fullName,birthCountry,primaryPosition,abbreviation`, 25000);
    const jp = (list.people || []).filter(p => p.birthCountry === 'Japan');
    let players = [];
    if (jp.length) {
      const ids = jp.map(p => p.id).join(',');
      const det = await fetchJson(`https://statsapi.mlb.com/api/v1/people?personIds=${ids}&hydrate=stats(group=[hitting,pitching],type=[season],season=${y}),currentTeam`, 25000);
      players = (det.people || []).map(jpNormalize);
    }
    state.cache.jp = { players, fetchedAt: Date.now(), error: players.length ? null : '日本人選手が見つかりませんでした' };
  } catch(e) {
    state.cache.jp = { players: (c && c.players) || [], fetchedAt: (c && c.fetchedAt) || null, error: '取得失敗(' + e.message + ')' };
  }
  saveCache();
}
// 自動評価(★1〜5): 打者はOPS、投手は防御率から機械的に判定
function rateHit(h) {
  const ops = parseFloat(h.ops);
  if (isNaN(ops)) return null;
  const s = ops >= .900 ? 5 : ops >= .800 ? 4 : ops >= .700 ? 3 : ops >= .600 ? 2 : 1;
  return { stars: s, low: Number(h.pa || 0) < 50 };
}
function ratePitch(p) {
  const era = parseFloat(p.era);
  if (isNaN(era)) return null;
  const s = era <= 2.50 ? 5 : era <= 3.30 ? 4 : era <= 4.10 ? 3 : era <= 5.00 ? 2 : 1;
  return { stars: s, low: parseFloat(p.ip || '0') < 20 };
}

function applyFilter(evs) {

  if (state.settings.filter !== 'all') r = r.filter(e => e.league === state.settings.filter);

function followedTeams() {
  const set = [];
  for (const lg in state.follow.teams) {
    for (const t of state.follow.teams[lg]) set.push({ league: lg, team: t });

  for (const p of state.follow.players) {
    if (!set.some(x => x.league === p.league && x.team === p.team)) set.push({ league: p.league, team: p.team, viaPlayer: p.name });
  }
  return set;
}
function teamsInCache(lgKey) {
  const c = state.cache[lgKey];

  html += fetchHints();
  if (!allEvents().length && !refreshing) {
    html = `<div class="empty-note">はじめまして!右上の <b>↻</b> ボタンでデータを取得します。<br>取得状況は「設定 → データ取得の診断」で確認できます。</div>` + html;
  }
  const el = $('#page-home');
  el.innerHTML = html;
  bindCards(el);
}

function renderSched() {
  const t = todayKey();
  const evs = applyFilter(allEvents()).filter(e => e.dateJst && e.dateJst >= t);
  const byDate = {};
  for (const e of evs) (byDate[e.dateJst] = byDate[e.dateJst] || []).push(e);
  const keys = Object.keys(byDate).sort();
  let html = '';
  for (const k of keys) {
    html += `<div class="date-head ${k===t?'today':''}">${k===t?'📌 今日 ':''}${keyToLabel(k)}</div>`;
    html += byDate[k].sort((a,b) => (a.ts||0)-(b.ts||0)).map(gameCard).join('');
  }
  if (!html) html = `<div class="empty-note">今後の試合データがありません。<br><small>↻ボタンで再取得するか、設定の診断を確認してください。</small></div>`;
  html += fetchHints();
  const el = $('#page-sched');
  el.innerHTML = html;
  bindCards(el);
}

function renderResult() {
  const t = todayKey();
  const evs = applyFilter(allEvents()).filter(e => (e.status === 'post' || e.status === 'nores') && e.dateJst && e.dateJst <= t);
  const byDate = {};
  for (const e of evs) (byDate[e.dateJst] = byDate[e.dateJst] || []).push(e);
  const keys = Object.keys(byDate).sort().reverse();
  let html = '';
  for (const k of keys) {
    html += `<div class="date-head ${k===t?'today':''}">${keyToLabel(k)}</div>`;
    html += byDate[k].sort((a,b) => (a.ts||0)-(b.ts||0)).map(gameCard).join('');
  }
  if (!html) html = `<div class="empty-note">結果データがまだありません。</div>`;
  html += fetchHints();
  const el = $('#page-result');
  el.innerHTML = html;
  bindCards(el);
}

function starsHtml(rate) {
  if (!rate) return '';
  const stars = '★'.repeat(rate.stars) + '☆'.repeat(5 - rate.stars);
  return `<span class="jp-stars s${rate.stars}">${stars}</span> <b>${RATE_LABEL[rate.stars]}</b>${rate.low ? '<small>(出場少なめ)</small>' : ''}`;
}
function statPills(pairs) {
  return `<div class="jp-pills">` + pairs
    .filter(p => p[1] != null && p[1] !== '')
    .map(p => `<span class="jp-pill"><small>${p[0]}</small>${esc(String(p[1]))}</span>`).join('') + `</div>`;
}
function jpCard(p, kind) {
  const ja = jaPlayer(p.name);
  const teamJa = jaTeam(p.team, 'mlb');
  const posJa = { 'P':'投手', 'TWP':'二刀流', 'C':'捕手', '1B':'一塁手', '2B':'二塁手', '3B':'三塁手', 'SS':'遊撃手', 'LF':'左翼手', 'CF':'中堅手', 'RF':'右翼手', 'OF':'外野手', 'DH':'DH' }[p.pos] || p.pos;
  let body = '';
  if ((kind === 'hit' || p.pos === 'TWP') && p.hit) {
    const r = rateHit(p.hit);
    body += statPills([['打率', p.hit.avg], ['本塁打', p.hit.hr], ['打点', p.hit.rbi], ['OPS', p.hit.ops], ['盗塁', p.hit.sb], ['試合', p.hit.g]]);
    if (r) body += `<div class="jp-rate">打撃評価: ${starsHtml(r)}</div>`;
  }
  if ((kind === 'pitch' || p.pos === 'TWP') && p.pitch) {
    const r = ratePitch(p.pitch);
    body += statPills([['防御率', p.pitch.era], ['勝-敗', `${p.pitch.w}-${p.pitch.l}`], ['セーブ', Number(p.pitch.sv) ? p.pitch.sv : null], ['奪三振', p.pitch.so], ['投球回', p.pitch.ip], ['WHIP', p.pitch.whip]]);
    if (r) body += `<div class="jp-rate">投球評価: ${starsHtml(r)}</div>`;
  }
  if (!body) body = `<div class="follow-mini">今季のMLB成績はまだありません(マイナー・故障者リスト等)。</div>`;
  const q = encodeURIComponent(ja + ' 成績 速報');
  return `<div class="game jp-card">
    <div class="g-top"><span class="g-lg">⚾ MLB</span>
      <span>${esc(teamJa)}${posJa ? '・' + esc(posJa) : ''}</span></div>
    <div class="jp-name">${esc(ja)}${ja !== p.name ? ` <small>${esc(p.name)}</small>` : ''}</div>
    ${body}
    <div class="g-links">
      <a href="https://www.mlb.com/player/${p.id}" target="_blank" rel="noopener">MLB公式</a>
      <a href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener">🔍 最新情報を検索</a>
      ${p.team ? `<a href="#" class="jp-focus" data-team="${esc(p.team)}" data-label="${esc(ja)}">📅 チームの試合を見る</a>` : ''}
    </div>
  </div>`;
}
function renderJp() {
  const c = state.cache.jp;
  let html = `<div class="sec-title">🇯🇵 MLBの日本人選手 <small>${seasonYear()}年シーズン成績</small></div>`;
  if (!c || !c.players || !c.players.length) {
    html += `<div class="empty-note">${c && c.error ? '⚠️ ' + esc(c.error) + '<br>' : ''}
      まだデータがありません。右上の <b>↻</b> で取得します。</div>`;
  } else {
    const hitters = c.players.filter(p => p.hit && p.pos !== 'P' && Number(p.hit.pa || 0) > 0)
      .sort((a, b) => (parseFloat(b.hit.ops) || 0) - (parseFloat(a.hit.ops) || 0));
    const hitterIds = new Set(hitters.map(p => p.id));
    const pitchers = c.players.filter(p => p.pitch && parseFloat(p.pitch.ip || '0') > 0 && !hitterIds.has(p.id))
      .sort((a, b) => (parseFloat(a.pitch.era) || 99) - (parseFloat(b.pitch.era) || 99));
    const shown = new Set([...hitters, ...pitchers].map(p => p.id));
    const others = c.players.filter(p => !shown.has(p.id));
    if (hitters.length) {
      html += `<div class="sec-title">💥 打者 <small>OPS順(二刀流は投球成績も表示)</small></div>` + hitters.map(p => jpCard(p, 'hit')).join('');
    }
    if (pitchers.length) {
      html += `<div class="sec-title">🎯 投手 <small>防御率順</small></div>` + pitchers.map(p => jpCard(p, 'pitch')).join('');
    }
    if (others.length) {
      html += `<div class="sec-title">📋 今季成績なし <small>マイナー・故障者リスト等</small></div>` + others.map(p => jpCard(p, 'none')).join('');
    }
    if (c.error) html += `<div class="empty-note">⚠️ ${esc(c.error)}</div>`;
    html += `<div class="follow-mini" style="margin:4px 2px 12px">評価(★)はOPS・防御率からアプリが機械的に付けた目安です。
      ${c.fetchedAt ? new Date(c.fetchedAt).toLocaleString('ja-JP', { timeZone: JST, month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }) + ' 時点 / ' : ''}出典: MLB StatsAPI</div>`;
  }
  const el = $('#page-jp');
  el.innerHTML = html;
  el.querySelectorAll('.jp-focus').forEach(a => a.onclick = ev => {
    ev.preventDefault();
    state.focus = { league: 'mlb', team: a.dataset.team, label: a.dataset.label };
    state.tab = 'home'; saveAll(); render();
    window.scrollTo(0, 0);
  });
}

function renderFollow() {
  let html = `<div class="sec-title">⭐ チームをフォロー</div>
    <div class="card-box"><div class="follow-mini">チップをタップするとフォローのオン/オフを切り替えられます。フォローしたチームはホームに「注目」として表示され、下の「絞り込み表示」からそのチームの試合だけを見ることもできます。</div>`;
  for (const k of enabledKeys()) {
    const teams = teamsInCache(k);
    html += `<div class="sec-title" style="margin-top:12px">${LEAGUES[k].icon} ${esc(LEAGUES[k].name)}</div>`;
    if (!teams.length) { html += `<div class="follow-mini">データ未取得です(↻で取得)</div>`; continue; }
    const followed = state.follow.teams[k] || [];
    html += `<div class="team-chips">` + teams.map(tm =>
      `<button class="t-chip ${followed.includes(tm)?'on':''}" data-lg="${k}" data-team="${esc(tm)}">${followed.includes(tm)?'★ ':''}${esc(jaTeam(tm,k))}</button>`
    ).join('') + `</div>`;
  }
  html += `</div>`;

  // フォロー中チームの絞り込みボタン
  const fts = followedTeams();
  if (fts.length) {
    html += `<div class="sec-title">🔎 絞り込み表示</div><div class="card-box">
      <div class="follow-mini">タップするとホーム・日程・結果がそのチームの試合だけになります。</div>
      <div class="team-chips">` + fts.map(ft =>
        `<button class="t-chip focus-btn" data-lg="${ft.league}" data-team="${esc(ft.team)}">${LEAGUES[ft.league].icon} ${esc(jaTeam(ft.team, ft.league))}だけ表示</button>`
      ).join('') + `</div></div>`;
  }

  // 選手
  html += `<div class="sec-title">🧑‍🎽 注目の選手</div><div class="card-box">`;
  if (state.follow.players.length) {
    html += state.follow.players.map(p => `
      <div class="player-row" data-pid="${p.id}">
        <span>🧑‍🎽</span>
        <span><span class="p-name">${esc(p.name)}</span><br>
        <span class="p-sub">${LEAGUES[p.league] ? LEAGUES[p.league].icon + ' ' + esc(jaTeam(p.team, p.league)) : ''} — タップで試合を絞り込み</span></span>
        <button class="p-del" data-pid="${p.id}" title="削除">✕</button>
      </div>`).join('');
  } else {
    html += `<div class="follow-mini">選手を登録すると、その選手の所属チームの試合(日程・結果・放送)をすぐ確認できます。</div>`;
  }
  html += `<div class="add-form">
      <input id="pName" placeholder="選手名(例: 佐藤輝明)">
      <select id="pLeague">${enabledKeys().map(k => `<option value="${k}">${LEAGUES[k].icon} ${esc(LEAGUES[k].name)}</option>`).join('')}</select>
      <select id="pTeam"></select>
      <button class="btn" id="pAdd">選手を追加</button>
    </div></div>`;

  const el = $('#page-follow');
  el.innerHTML = html;

  // ハンドラ
  el.querySelectorAll('.t-chip:not(.focus-btn)').forEach(b => b.onclick = () => {
    const lg = b.dataset.lg, tm = b.dataset.team;
    const arr = state.follow.teams[lg] = state.follow.teams[lg] || [];
    const i = arr.indexOf(tm);
    if (i >= 0) arr.splice(i, 1); else arr.push(tm);
    saveAll(); renderFollow();
  });
  el.querySelectorAll('.focus-btn').forEach(b => b.onclick = () => {
    state.focus = { league: b.dataset.lg, team: b.dataset.team, label: jaTeam(b.dataset.team, b.dataset.lg) };
    state.tab = 'home'; saveAll(); render();
    window.scrollTo(0, 0);
  });
  el.querySelectorAll('.p-del').forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    state.follow.players = state.follow.players.filter(p => String(p.id) !== b.dataset.pid);
    saveAll(); renderFollow();
  });
  el.querySelectorAll('.player-row').forEach(r => r.onclick = () => {
    const p = state.follow.players.find(x => String(x.id) === r.dataset.pid);
    if (!p) return;
    state.focus = { league: p.league, team: p.team, label: p.name + '(' + jaTeam(p.team, p.league) + ')' };
    state.tab = 'home'; saveAll(); render();
    window.scrollTo(0, 0);
  });
  const fillTeams = () => {
    const lg = $('#pLeague').value;
    const teams = teamsInCache(lg);
    $('#pTeam').innerHTML = teams.length
      ? teams.map(tm => `<option value="${esc(tm)}">${esc(jaTeam(tm, lg))}</option>`).join('')
      : `<option value="">(データ未取得 — ↻で取得してください)</option>`;
  };
  $('#pLeague').onchange = fillTeams;
  fillTeams();
  $('#pAdd').onclick = () => {
    const name = $('#pName').value.trim();
    const lg = $('#pLeague').value;
    const tm = $('#pTeam').value;
    if (!name) { alert('選手名を入力してください'); return; }
    if (!tm) { alert('チームのデータがまだありません。↻で取得してから登録してください。'); return; }
    state.follow.players.push({ id: Date.now(), name, league: lg, team: tm });
    saveAll(); renderFollow();
  };
}

function renderSet() {
  let html = `<div class="sec-title">📡 表示するリーグ</div><div class="card-box">`;
  for (const k of LEAGUE_KEYS) {
    html += `<div class="set-row">
      <div class="grow">${LEAGUES[k].icon} <b>${esc(LEAGUES[k].name)}</b></div>
      <label class="toggle"><input type="checkbox" data-lg="${k}" ${state.settings.enabled[k]?'checked':''}><span class="knob"></span></label>
    </div>`;
  }
  html += `</div>`;

  html += `<div class="sec-title">📺 視聴先の初期表示(リーグごと)</div><div class="card-box">
    <div class="follow-mini">試合カードの📺欄に表示する内容です。放映権は年ごとに変わるので、実際と違ったらここで直してください(試合ごとのメモは各カードの✏️から)。</div>`;
  for (const k of LEAGUE_KEYS) {
    html += `<div style="margin-top:10px"><b style="font-size:.85rem">${LEAGUES[k].icon} ${esc(LEAGUES[k].name)}</b>
      <textarea class="bc-preset" data-lg="${k}" rows="2" style="width:100%;padding:8px;margin-top:4px">${esc(bcastPreset(k))}</textarea></div>`;
  }
  html += `<button class="btn" id="bcSave" style="margin-top:10px;width:100%">視聴先の設定を保存</button></div>`;

  html += `<div class="sec-title">🩺 データ取得の診断</div><div class="card-box diag">`;
  for (const k of enabledKeys()) {
    const c = state.cache[k];
    if (!c || !c.fetchedAt) { html += `<div>${LEAGUES[k].icon} <b>${esc(LEAGUES[k].short)}</b>: <span class="ng">未取得</span></div>`; continue; }
    const when = new Date(c.fetchedAt).toLocaleString('ja-JP', { timeZone: JST, month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
    html += `<div>${LEAGUES[k].icon} <b>${esc(LEAGUES[k].short)}</b>: `
      + (c.events && c.events.length ? `<span class="ok">${c.events.length}件</span>` : `<span class="ng">0件</span>`)
      + ` <small>(${when} / ${esc(c.source || '-')})</small>`
      + (c.error ? `<br><span class="ng">⚠ ${esc(c.error)}</span>` : '')
      + `</div>`;
  }
  {
    const j = state.cache.jp;
    if (!j || !j.fetchedAt) html += `<div>🇯🇵 <b>日本人選手</b>: <span class="ng">未取得</span></div>`;
    else {
      const when = new Date(j.fetchedAt).toLocaleString('ja-JP', { timeZone: JST, month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
      html += `<div>🇯🇵 <b>日本人選手</b>: `
        + (j.players && j.players.length ? `<span class="ok">${j.players.length}人</span>` : `<span class="ng">0人</span>`)
        + ` <small>(${when} / MLB StatsAPI)</small>`
        + (j.error ? `<br><span class="ng">⚠ ${esc(j.error)}</span>` : '') + `</div>`;
    }
  }
  html += `<div style="margin-top:10px;display:flex;gap:8px">
      <button class="btn sub" id="reFetch" style="flex:1">今すぐ再取得</button>
      <button class="btn warn" id="clearCache" style="flex:1">キャッシュ削除</button>
    </div></div>`;

  html += `<div class="sec-title">🔗 公式サイト・スポーツナビ</div><div class="card-box">`;
  for (const k of enabledKeys()) {
    html += `<div class="set-row"><div class="grow">${LEAGUES[k].icon} ${esc(LEAGUES[k].short)}</div>
      <div class="g-links">${LEAGUES[k].links.map(l => `<a href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join('')}</div></div>`;
  }
  html += `</div>`;

  html += `<div class="sec-title">ℹ️ このアプリについて</div><div class="card-box follow-mini">
    試合データは ESPN / TheSportsDB、日本人選手の成績は MLB StatsAPI の公開APIから取得しています(TheSportsDBは有志更新のため、NPBは反映が遅れたり抜けたりすることがあります)。
    正確な情報は各リーグの公式サイト・スポーツナビで確認してください。データはこの端末のブラウザにのみ保存されます。</div>`;

  const el = $('#page-set');
  el.innerHTML = html;

  el.querySelectorAll('.toggle input').forEach(i => i.onchange = () => {
    state.settings.enabled[i.dataset.lg] = i.checked;
    if (!i.checked && state.settings.filter === i.dataset.lg) state.settings.filter = 'all';
    saveAll(); render();
    if (i.checked) refreshAll(false);
  });
  $('#bcSave').onclick = () => {
    el.querySelectorAll('.bc-preset').forEach(t => {
      const lg = t.dataset.lg, v = t.value.trim();
      if (v === LEAGUES[lg].bcast) delete state.bcast.presets[lg];
      else state.bcast.presets[lg] = v;
    });
    saveAll(); alert('保存しました'); render();
  };
  $('#reFetch').onclick = () => refreshAll(true);
  $('#clearCache').onclick = () => {
    if (!confirm('取得済みの試合データを削除して取り直しますか?(フォローや設定は消えません)')) return;
    state.cache = {}; saveCache(); render(); refreshAll(true);
  };
}

/* ================= モーダル(視聴メモ) ================= */
function openBcastModal(id) {
  const ev = allEvents().find(e => e.id === id);
  if (!ev) return;
  const cur = state.bcast.overrides[id] || '';
  $('#modalBox').innerHTML = `
    <h3>📺 この試合の視聴メモ</h3>
    <div class="m-sub">${esc(jaTeam(ev.home, ev.league))} vs ${esc(jaTeam(ev.away, ev.league))}(${ev.dateJst ? keyToLabel(ev.dateJst) : ''})<br>
    例: 「地上波○○テレビ 19時〜」「DAZNで見る」など。空にするとリーグの初期表示に戻ります。</div>
    <textarea id="bcMemo" rows="3" style="width:100%;padding:9px">${esc(cur)}</textarea>
    <div class="m-btns">
      <button class="btn sub" id="mCancel">キャンセル</button>
      <button class="btn" id="mSave">保存</button>
    </div>`;
  $('#modalWrap').classList.add('show');
  $('#mCancel').onclick = closeModal;
  $('#mSave').onclick = () => {
    const v = $('#bcMemo').value.trim();
    if (v) state.bcast.overrides[id] = v; else delete state.bcast.overrides[id];
    saveAll(); closeModal(); render();
  };
}
function closeModal() { $('#modalWrap').classList.remove('show'); }
$('#modalWrap').addEventListener('click', e => { if (e.target === $('#modalWrap')) closeModal(); });

/* ================= 初期化 ================= */
$('#navBar').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  state.tab = b.dataset.tab;
  render();
  window.scrollTo(0, 0);
});
$('#refreshBtn').onclick = () => refreshAll(true);
$('#focusClear').onclick = () => { state.focus = null; saveAll(); render(); };
window.addEventListener('online', () => { renderNet(); refreshAll(false); });
window.addEventListener('offline', renderNet);

$('#headDate').textContent = keyToLabel(todayKey());
renderNet();
render();

// 起動時: キャッシュが30分より古ければ自動取得
(() => {
  let newest = 0;
  for (const k of enabledKeys()) newest = Math.max(newest, (state.cache[k] && state.cache[k].fetchedAt) || 0);
  if (Date.now() - newest > 30 * 60 * 1000) refreshAll(false);
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
