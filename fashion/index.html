<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fff6fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ふくらぶ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<title>ふくらぶ！ - 流行・お店・お得がわかるファッションアプリ</title>
<style>
  :root {
    --bg: #fff6fa;
    --card: #ffffff;
    --text: #46323e;
    --text-sub: #a88f9c;
    --line: rgba(214,120,168,.16);
    --line2: rgba(214,120,168,.32);
    --pk: #ff5fa2;
    --pk-deep: #e8438b;
    --vi: #b06ff5;
    --grad: linear-gradient(135deg, #ff8ec0, #b98af7);
    --grad-strong: linear-gradient(135deg, #ff5fa2, #a45ef2);
    --ink-on-grad: #fff;
    --ok: #2fbf8f;
    --warn: #f5a623;
    --sale: #ff4d6d;
    --radius: 18px;
    --shadow: 0 10px 26px rgba(232,67,139,.10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    background: radial-gradient(880px 460px at 50% -170px, #ffe0ef 0%, var(--bg) 62%) fixed, var(--bg);
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 92px;
    overflow-x: hidden;
    max-width: 100vw;
  }
  input, select, textarea {
    font-size: 16px !important;
    background: #fff; color: var(--text);
    border: 1.5px solid var(--line2); border-radius: 12px;
    font-family: inherit;
  }
  input::placeholder, textarea::placeholder { color: #cbb3bf; }
  textarea { line-height: 1.6; }
  button { font-family: inherit; }
  a { color: var(--pk-deep); }

  /* ---------- ヘッダー ---------- */
  header {
    background: rgba(255,246,250,.85);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
    padding: calc(12px + env(safe-area-inset-top)) 14px 11px;
    position: sticky; top: 0; z-index: 10;
  }
  .head-row { display: flex; align-items: center; gap: 8px; }
  header h1 { display: flex; align-items: baseline; gap: 9px; flex: 1; font-size: 1rem; }
  .logo {
    font-size: 1.35rem; font-weight: 900; letter-spacing: .05em;
    background: var(--grad-strong);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    padding-right: 3px;
  }
  .head-date { font-size: .74rem; color: var(--text-sub); font-weight: normal; }
  #refreshBtn {
    border: 1px solid var(--line2); background: #fff; color: var(--pk-deep);
    width: 38px; height: 38px; border-radius: 50%; font-size: 18px; cursor: pointer;
    flex-shrink: 0; line-height: 1; box-shadow: var(--shadow);
  }
  #refreshBtn.spin { animation: spin 1s linear infinite; border-color: var(--pk); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 本文 ---------- */
  main { padding: 14px 14px 0; max-width: 640px; margin: 0 auto; }
  .tab-page { display: none; }
  .tab-page.on { display: block; }
  .sec-title {
    font-size: .95rem; font-weight: 800; color: var(--text);
    margin: 20px 2px 9px; display: flex; align-items: center; gap: 7px;
    letter-spacing: .02em;
  }
  .sec-title::before { content: ""; width: 4px; height: 15px; border-radius: 2px; background: var(--grad-strong); }
  .sec-title:first-child { margin-top: 2px; }
  .sec-title small { color: var(--text-sub); font-weight: normal; font-size: .76rem; }
  .sec-title .spacer { flex: 1; }
  .sec-title .mini-btn {
    border: 1px solid var(--line2); background: #fff; color: var(--pk-deep);
    border-radius: 999px; padding: 4px 12px; font-size: .78rem; cursor: pointer; font-weight: 700;
  }
  .empty-note {
    background: #fff; border: 1.5px dashed var(--line2); border-radius: var(--radius);
    padding: 20px 14px; text-align: center; color: var(--text-sub); font-size: .9rem;
    line-height: 1.7; margin-bottom: 10px;
  }
  .card-box {
    background: var(--card);
    border-radius: var(--radius); border: 1px solid var(--line);
    box-shadow: var(--shadow);
    padding: 13px; margin-bottom: 12px;
  }
  .note-sub { font-size: .76rem; color: var(--text-sub); line-height: 1.6; }

  /* ---------- チップ・ボタン ---------- */
  .chip-bar {
    display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none; padding: 2px 0 10px;
  }
  .chip-bar::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; border: 1px solid var(--line2); background: #fff;
    color: var(--text); border-radius: 999px; padding: 7px 14px; font-size: .87rem; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .chip.on {
    background: var(--grad-strong); color: var(--ink-on-grad); border-color: transparent; font-weight: 800;
    box-shadow: 0 2px 14px rgba(232,67,139,.30);
  }
  .chip-wrap { display: flex; flex-wrap: wrap; gap: 7px; }
  .btn {
    border: none; border-radius: 13px; padding: 12px 14px; font-size: .95rem;
    background: var(--grad-strong); color: var(--ink-on-grad); cursor: pointer; font-weight: 800;
    letter-spacing: .02em;
  }
  .btn.sub { background: #fdeef5; color: var(--pk-deep); }
  .btn.warn { background: rgba(255,77,109,.12); color: var(--sale); }
  .btn:disabled { opacity: .5; }
  .link-pills { display: flex; flex-wrap: wrap; gap: 7px; }
  .link-pills a, .link-pills button {
    font-size: .8rem; color: var(--text); text-decoration: none;
    border: 1px solid var(--line2); border-radius: 999px; padding: 6px 12px;
    background: #fff; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
  }

  /* ---------- セールバナー ---------- */
  .sale-banner {
    display: flex; align-items: center; gap: 9px;
    border-radius: 14px; padding: 10px 13px; margin-bottom: 8px;
    font-size: .9rem; font-weight: 700; text-decoration: none;
  }
  .sale-banner.on-now { background: var(--grad-strong); color: #fff; box-shadow: 0 4px 16px rgba(232,67,139,.35); }
  .sale-banner.soon { background: #fff; color: var(--text); border: 1.5px solid var(--line2); box-shadow: var(--shadow); }
  .sale-banner .st { font-size: .72rem; border-radius: 999px; padding: 2px 9px; flex-shrink: 0; font-weight: 800; }
  .sale-banner.on-now .st { background: rgba(255,255,255,.25); color: #fff; }
  .sale-banner.soon .st { background: #fdeef5; color: var(--pk-deep); }
  .sale-banner .nm { flex: 1; line-height: 1.4; }
  .sale-banner .dt { font-size: .74rem; font-weight: normal; opacity: .85; }

  /* ---------- トレンド商品カード ---------- */
  .rank-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .item-card {
    background: #fff; border: 1px solid var(--line); border-radius: 15px;
    box-shadow: var(--shadow); overflow: hidden; text-decoration: none; color: var(--text);
    display: flex; flex-direction: column; position: relative;
  }
  .item-card .imgbox { width: 100%; aspect-ratio: 1; background: #faf2f6; position: relative; }
  .item-card img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .item-card .rk {
    position: absolute; top: 7px; left: 7px; z-index: 1;
    background: rgba(255,255,255,.92); border-radius: 999px; min-width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    font-size: .82rem; font-weight: 900; color: var(--pk-deep);
    box-shadow: 0 2px 8px rgba(70,50,62,.18); padding: 0 4px;
  }
  .item-card .rk.top { font-size: 1rem; background: #fff; }
  .item-card .info { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 3px; }
  .item-card .nm {
    font-size: .78rem; line-height: 1.45; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    min-height: 2.3em;
  }
  .item-card .pr { font-size: .98rem; font-weight: 900; color: var(--pk-deep); }
  .item-card .pr small { font-size: .7rem; font-weight: 700; }
  .item-card .shop { font-size: .68rem; color: var(--text-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-card .rev { font-size: .68rem; color: var(--warn); font-weight: 700; }
  .pick-scroll {
    display: flex; gap: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none; padding-bottom: 6px;
  }
  .pick-scroll::-webkit-scrollbar { display: none; }
  .pick-scroll .item-card { flex: 0 0 138px; }
  .fetched-note { font-size: .72rem; color: var(--text-sub); text-align: right; margin: 6px 2px 0; }
  .loading-note { text-align: center; color: var(--text-sub); font-size: .85rem; padding: 14px 0; }

  /* ---------- お店・ブランド ---------- */
  .shop-card {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 12px 13px; margin-bottom: 10px;
  }
  .shop-card .s-head { display: flex; align-items: center; gap: 8px; }
  .shop-card .s-name { font-weight: 800; font-size: 1rem; flex: 1; }
  .shop-card .s-place { font-size: .78rem; color: var(--text-sub); margin-top: 2px; }
  .shop-card .s-memo { font-size: .8rem; color: var(--text); background: #fdf4f8; border-radius: 9px; padding: 6px 9px; margin-top: 7px; line-height: 1.5; }
  .shop-card .s-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .shop-card .s-links a, .shop-card .s-links button {
    font-size: .78rem; color: var(--text); text-decoration: none;
    border: 1px solid var(--line2); border-radius: 999px; padding: 5px 11px;
    background: #fff; cursor: pointer;
  }
  .edit-btn { border: none; background: none; font-size: 16px; cursor: pointer; padding: 3px 5px; }

  /* ---------- セールカレンダー ---------- */
  .month-head {
    font-size: .86rem; font-weight: 800; color: var(--text-sub);
    margin: 16px 2px 7px; display: flex; align-items: center; gap: 6px;
  }
  .month-head.now { color: var(--pk-deep); }
  .sale-row {
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 10px 12px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 9px; cursor: pointer;
  }
  .sale-row .ic { font-size: 1.15rem; flex-shrink: 0; }
  .sale-row .grow { flex: 1; min-width: 0; }
  .sale-row .nm { font-weight: 800; font-size: .92rem; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .sale-row .term { display: block; font-size: .76rem; color: var(--text-sub); margin-top: 1px; }
  .sale-row .note { display: block; font-size: .74rem; color: var(--text-sub); margin-top: 2px; }
  .tag { font-size: .66rem; border-radius: 999px; padding: 2px 8px; font-weight: 800; flex-shrink: 0; }
  .tag.on-now { background: var(--grad-strong); color: #fff; }
  .tag.soon { background: #fdeef5; color: var(--pk-deep); }
  .tag.approx { background: #f4eef8; color: #9a7fc0; font-weight: 700; }

  /* ---------- 設定 ---------- */
  .field-label { display: block; font-size: .8rem; font-weight: 700; color: var(--text); margin: 10px 0 5px; }
  .set-note { font-size: .76rem; color: var(--text-sub); line-height: 1.6; margin-top: 6px; }
  .set-note strong { color: var(--pk-deep); }
  .diag { font-size: .78rem; color: var(--text-sub); line-height: 1.9; }
  .diag b { color: var(--text); }
  .diag .ok { color: var(--ok); font-weight: 700; }
  .diag .ng { color: var(--sale); font-weight: 700; }
  .set-row-btns { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }

  /* ---------- 下部ナビ ---------- */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    background: rgba(255,251,253,.9);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    display: flex; padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; border: none; background: none; padding: 9px 0 8px; cursor: pointer;
    font-size: .64rem; color: var(--text-sub); display: flex; flex-direction: column;
    align-items: center; gap: 3px; letter-spacing: .04em; position: relative;
  }
  nav button .ic { width: 22px; height: 22px; display: block; }
  nav button .ic svg { width: 100%; height: 100%; }
  nav button.on { color: var(--pk-deep); font-weight: 700; }
  nav button.on::before {
    content: ""; position: absolute; top: 0; width: 26px; height: 3px;
    border-radius: 0 0 3px 3px; background: var(--grad-strong);
  }

  /* ---------- モーダル ---------- */
  #modalWrap {
    display: none; position: fixed; inset: 0; z-index: 40;
    background: rgba(70,50,62,.42); align-items: flex-end; justify-content: center;
  }
  #modalWrap.show { display: flex; }
  #modalBox {
    background: #fff; border: 1px solid var(--line2); border-bottom: none;
    border-radius: 22px 22px 0 0; width: 100%; max-width: 640px;
    padding: 20px 16px calc(18px + env(safe-area-inset-bottom));
    max-height: 82vh; overflow-y: auto;
  }
  #modalBox::before {
    content: ""; display: block; width: 42px; height: 4px; border-radius: 2px;
    background: var(--line2); margin: -6px auto 14px;
  }
  #modalBox h3 { font-size: 1rem; margin-bottom: 5px; }
  #modalBox .m-sub { font-size: .8rem; color: var(--text-sub); margin-bottom: 10px; line-height: 1.6; }
  .add-form { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .add-form input, .add-form select, .add-form textarea { padding: 10px 11px; width: 100%; }
  .form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .m-btns { display: flex; gap: 8px; margin-top: 15px; }
  .m-btns .btn { flex: 1; }

  /* ---------- 初回設定 ---------- */
  #setupWrap {
    display: none; position: fixed; inset: 0; z-index: 50; overflow-y: auto;
    background: radial-gradient(700px 420px at 50% -120px, #ffe0ef 0%, var(--bg) 60%), var(--bg);
    padding: calc(30px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom));
  }
  #setupWrap.show { display: block; }
  .setup-inner { max-width: 480px; margin: 0 auto; }
  .setup-logo { text-align: center; font-size: 2rem; font-weight: 900; letter-spacing: .05em;
    background: var(--grad-strong); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .setup-sub { text-align: center; color: var(--text-sub); font-size: .86rem; margin: 6px 0 22px; line-height: 1.7; }

  /* ---------- トースト ---------- */
  #toast {
    position: fixed; bottom: calc(96px + env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%) translateY(16px); z-index: 60;
    background: var(--text); color: #fff; font-size: .85rem; font-weight: 700;
    border-radius: 999px; padding: 9px 18px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; max-width: 86vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <h1><span class="logo">ふくらぶ！</span><span class="head-date" id="headDate"></span></h1>
    <button id="refreshBtn" title="トレンドを再取得">↻</button>
  </div>
</header>

<main>
  <div class="tab-page" id="page-home"></div>
  <div class="tab-page" id="page-trend"></div>
  <div class="tab-page" id="page-shop"></div>
  <div class="tab-page" id="page-sale"></div>
  <div class="tab-page" id="page-set"></div>
</main>

<nav id="navBar">
  <button data-tab="home"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/></svg></span>ホーム</button>
  <button data-tab="trend"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5.5-5.5 4 4L21 7"/><path d="M15 7h6v6"/></svg></span>トレンド</button>
  <button data-tab="shop"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 11V6a3 3 0 0 1 6 0v5"/></svg></span>お店</button>
  <button data-tab="sale"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.6 3H20v7.4L11.4 19a2 2 0 0 1-2.8 0L4 14.4a2 2 0 0 1 0-2.8L12.6 3Z"/><circle cx="15.5" cy="7.5" r="1.3"/></svg></span>お得</button>
  <button data-tab="set"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.7M12 18.5v2.7M2.8 12h2.7M18.5 12h2.7M5.5 5.5l1.9 1.9M16.6 16.6l1.9 1.9M18.5 5.5l-1.9 1.9M7.4 16.6l-1.9 1.9"/></svg></span>設定</button>
</nav>

<div id="setupWrap"><div class="setup-inner" id="setupInner"></div></div>
<div id="modalWrap"><div id="modalBox"></div></div>
<div id="toast"></div>

<script>
'use strict';

/* ================= ユーティリティ ================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const escAttr = esc;
const yen = n => '¥' + Number(n || 0).toLocaleString('ja-JP');
function lsGet(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch(e) { return fb; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
const uid = () => 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const WDAYS = ['日','月','火','水','木','金','土'];
function todayParts() {
  const d = new Date();
  return { y: d.getFullYear(), m: d.getMonth() + 1, d: d.getDate(), wd: WDAYS[d.getDay()] };
}
function fmtClock(ts) {
  const d = new Date(ts);
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' +
    String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function gmaps(q) { return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q); }
function gsearch(q) { return 'https://www.google.com/search?q=' + encodeURIComponent(q); }

/* ================= 定義データ ================= */
// 楽天ランキングAPIのジャンル
const TREND_TABS = {
  ladies: { label: 'レディース', icon: '👗', genreId: '100371', cat: 'ladies' },
  mens:   { label: 'メンズ',     icon: '👕', genreId: '551177', cat: 'mens' },
  kids:   { label: 'キッズ',     icon: '🧒', genreId: '100533', cat: 'kids' },
  shoes:  { label: '靴',         icon: '👟', genreId: '558885' },
  bag:    { label: 'バッグ',     icon: '👜', genreId: '216131' },
  age:    { label: '年代別',     icon: '✨', genreId: '' },   // age/sexパラメータで総合ランキング
};

// トレンドの補完リンク集(公開APIが無いサイト)
const TREND_LINKS = [
  ['🛍️', 'ZOZOTOWN ランキング', 'https://zozo.jp/ranking/'],
  ['📸', 'WEAR コーデランキング', 'https://wear.jp/ranking/'],
  ['🎀', '楽天ファッション', 'https://brandavenue.rakuten.co.jp/'],
  ['🧥', 'ユニクロ', 'https://www.uniqlo.com/jp/ja/'],
  ['👖', 'GU', 'https://www.gu-global.com/jp/ja/'],
  ['📷', 'Instagram #今日のコーデ', 'https://www.instagram.com/explore/tags/%E4%BB%8A%E6%97%A5%E3%81%AE%E3%82%B3%E3%83%BC%E3%83%87/'],
];

// 周辺検索のカテゴリボタン
const NEARBY_CATS = [
  ['🏬', 'ファッションビル'], ['👚', '古着屋'], ['🏷️', 'アウトレット'],
  ['🧢', 'セレクトショップ'], ['👟', '靴屋'], ['🧸', '子供服'],
];

// ブランドかんたん追加プリセット(URLが空の項目は検索リンクで補う)
const BRAND_PRESETS = [

function allSaleEvents() {
  const removed = state.sales.removed || [];

    .concat(state.sales.events || []);
}
// 年またぎ(12/20〜1/20など)にも対応した開催判定
function saleStatus(ev) {
  const t = todayParts();
  const cur = t.m * 100 + t.d;
  const s = ev.m1 * 100 + ev.d1, e = ev.m2 * 100 + ev.d2;
  const on = s <= e ? (cur >= s && cur <= e) : (cur >= s || cur <= e);
  if (on) return 'on';
  // 開始まで7日以内なら「まもなく」
  const now = new Date(t.y, t.m - 1, t.d);
  let start = new Date(t.y, ev.m1 - 1, ev.d1);
  if (start < now) start = new Date(t.y + 1, ev.m1 - 1, ev.d1);
  const days = Math.round((start - now) / 86400000);
  return days <= 7 ? 'soon' : '';
}
function saleDaysUntil(ev) {
  const t = todayParts();
  const now = new Date(t.y, t.m - 1, t.d);
  let start = new Date(t.y, ev.m1 - 1, ev.d1);
  if (start < now) start = new Date(t.y + 1, ev.m1 - 1, ev.d1);
  return Math.round((start - now) / 86400000);
}
function saleTermLabel(ev) {
  return ev.m1 + '/' + ev.d1 + ' 〜 ' + ev.m2 + '/' + ev.d2 + (ev.approx ? 'ごろ' : '');
}
function activeSales() {
  const list = allSaleEvents().map(ev => ({ ev, st: saleStatus(ev) })).filter(x => x.st);
  list.sort((a, b) => (a.st === 'on' ? 0 : 1) - (b.st === 'on' ? 0 : 1));
  return list;
}

/* ================= 楽天ランキングAPI ================= */
function rankingUrl(tabKey, opt) {
  const tb = TREND_TABS[tabKey];
  let u = 'https://app.rakuten.co.jp/services/api/IchibaItem/Ranking/20220601?format=json' +
    '&applicationId=' + encodeURIComponent(state.rakutenAppId);
  if (tb.genreId) {
    u += '&genreId=' + tb.genreId;
  } else {
    // 年代別総合ランキング(genreIdとage/sexは併用不可のため総合のみ)
    const c = state.profile.cats;
    if (state.profile.age && !(opt && opt.noAge)) u += '&age=' + state.profile.age;
    if (!(opt && opt.noSex)) {
      if (c.mens && !c.ladies) u += '&sex=1';
      else if (c.ladies && !c.mens) u += '&sex=2';
    }
  }
  return u;
}
async function fetchJson(url, timeoutMs) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), timeoutMs || 12000);
  try {
    const res = await fetch(url, { signal: ctl.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally { clearTimeout(t); }
}
async function fetchRanking(tabKey, force) {
  if (!state.rakutenAppId) return;
  const hit = state.cache[tabKey];
  if (!force && hit && Date.now() - hit.fetchedAt < 60 * 60 * 1000) return;
  if (state.fetching[tabKey]) return;
  state.fetching[tabKey] = true;
  renderIfTrendVisible(tabKey);
  try {
    let json;
    try {
      json = await fetchJson(rankingUrl(tabKey));
    } catch (e1) {
      // 年代別はパラメータの組み合わせで400になる場合があるため段階的に緩めて再試行
      if (tabKey === 'age') {
        try { json = await fetchJson(rankingUrl(tabKey, { noSex: true })); }
        catch (e2) { json = await fetchJson(rankingUrl(tabKey, { noAge: true, noSex: true })); }
      } else { throw e1; }
    }
    const items = (json.Items || []).map(w => {
      const it = w.Item || w;
      const img = ((it.mediumImageUrls || [])[0] || {}).imageUrl || '';
      return {
        rank: it.rank, name: it.itemName, price: it.itemPrice, url: it.itemUrl,
        img: img.replace(/_ex=\d+x\d+/, '_ex=300x300'),
        shop: it.shopName, rvAvg: Number(it.reviewAverage) || 0, rvCnt: it.reviewCount || 0,
      };
    });
    if (!items.length) throw new Error('0件でした');
    state.cache[tabKey] = { fetchedAt: Date.now(), items };
    saveCache();
    state.diag[tabKey] = { ok: true, count: items.length, at: Date.now() };
  } catch (e) {
    state.diag[tabKey] = { ok: false, err: e.message || String(e), at: Date.now() };
  } finally {
    state.fetching[tabKey] = false;
    renderIfTrendVisible(tabKey);
    if (state.tab === 'home') render();
    if (state.tab === 'set') render();
  }
}
function renderIfTrendVisible(tabKey) {
  if (state.tab === 'trend' && state.trendTab === tabKey) render();
}
async function refreshAll(force) {
  if (!state.rakutenAppId) { toast('設定で楽天アプリIDを登録すると売れ筋が見られます'); return; }
  $('#refreshBtn').classList.add('spin');
  await Promise.all(trendTabKeys().map(k => fetchRanking(k, force)));
  $('#refreshBtn').classList.remove('spin');
  render();
}

function catChipsHtml(cats) {
  const defs = [['ladies', '👗 レディース'], ['mens', '👕 メンズ'], ['kids', '🧒 キッズ']];
  return '<div class="chip-wrap">' + defs.map(d =>
    '<button class="chip' + (cats[d[0]] ? ' on' : '') + '" data-cat="' + d[0] + '">' + d[1] + '</button>').join('') + '</div>';
}
function ageSelectHtml(val) {
  const ops = [['', '選択しない'], ['10', '10代'], ['20', '20代'], ['30', '30代'], ['40', '40代'], ['50', '50代以上']];
  return '<select id="ageSel">' + ops.map(o =>
    '<option value="' + o[0] + '"' + (val === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select>';
}
function renderSet(el) {
  let h = '<div class="sec-title">プロフィール</div><div class="card-box" id="profileBox">' +
    '<label class="field-label">見たいカテゴリ(複数OK)</label>' + catChipsHtml(state.profile.cats) +
    '<label class="field-label">年代(年代別ランキングに使います)</label>' + ageSelectHtml(state.profile.age) +
    '</div>';

  h += '<div class="sec-title">好きなブランド<span class="spacer"></span>' +
    '<button class="mini-btn" data-act="add-brand">＋ 追加</button></div><div class="card-box">';
  if (state.brands.length) {
    h += '<div class="chip-wrap" style="margin-bottom:8px">' +
      state.brands.map(b => '<button class="chip" data-edit-brand="' + b.id + '">' + esc(b.name) + ' ✏️</button>').join('') + '</div>';
  }
  const rest = BRAND_PRESETS.filter(p => !state.brands.some(b => b.name === p.name));
  if (rest.length) {
    h += '<div class="note-sub" style="margin-bottom:6px">かんたん追加:</div><div class="chip-wrap">' +
      rest.map(p => '<button class="chip" data-preset-brand="' + escAttr(p.name) + '">＋ ' + esc(p.name) + '</button>').join('') + '</div>';
  }
  h += '<div class="set-note">登録したブランドは「お店」の店舗検索と「お得」のセール・クーポンに表示されます</div></div>';

  h += '<div class="sec-title">楽天アプリID <small>売れ筋ランキング用</small></div><div class="card-box">' +
    '<input type="text" id="rakutenIdInput" style="padding:10px 11px;width:100%" value="' + escAttr(state.rakutenAppId) + '" placeholder="楽天アプリID(無料)" autocomplete="off">' +
    '<div class="set-note">※ <strong>webservice.rakuten.co.jp</strong> で楽天会員なら無料発行できます(「アプリID発行」→ 新規アプリ登録)。' +
    '登録すると楽天市場の売れ筋ランキングがアプリ内に表示されます。かいわすれナシ!と同じIDが使えます。</div>' +
    '<div class="m-btns"><button class="btn" data-act="save-rakuten">保存する</button></div></div>';

  h += '<div class="sec-title">住所 <small>近くのお店の検索用</small></div><div class="card-box">' +
    '<input type="text" id="addrInput" style="padding:10px 11px;width:100%" value="' + escAttr(state.address) + '" placeholder="例: 東京都渋谷区" autocomplete="off">' +
    '<div class="set-note">「お店」タブの周辺検索で使います。空のままなら現在地周辺で検索します。</div>' +
    '<div class="m-btns"><button class="btn" data-act="save-addr">保存する</button></div></div>';

  h += '<div class="sec-title">データ</div><div class="card-box"><div class="set-row-btns">' +
    '<button class="btn sub" data-act="refetch">🔄 トレンドを再取得</button>' +
    '<button class="btn sub" data-act="diag">🩺 データ取得の診断</button>' +
    '<button class="btn warn" data-act="clear-cache">🧹 トレンドのキャッシュを削除</button>' +
    '</div></div>';

  h += '<div class="note-sub" style="text-align:center;padding:4px 0 16px">ふくらぶ！ - 服がもっと好きになる🎀</div>';
  el.innerHTML = h;
}

/* ================= モーダル ================= */
function openModal(html) { $('#modalBox').innerHTML = html; $('#modalWrap').classList.add('show'); }
function closeModal() { $('#modalWrap').classList.remove('show'); }
$('#modalWrap').addEventListener('click', e => { if (e.target === $('#modalWrap')) closeModal(); });

function shopModal(shop) {
  const s = shop || {};
  openModal('<h3>' + (shop ? 'お店を編集' : 'お店を追加') + '</h3>' +
    '<div class="add-form">' +
    '<input id="mShopName" placeholder="お店の名前(例: ○○古着店)" value="' + escAttr(s.name || '') + '">' +
    '<input id="mShopPlace" placeholder="場所(例: 渋谷パルコ 2F)" value="' + escAttr(s.place || '') + '">' +
    '<input id="mShopUrl" type="url" placeholder="公式サイトURL(任意)" value="' + escAttr(s.url || '') + '">' +
    '<input id="mShopSale" type="url" placeholder="セール情報のURL(任意)" value="' + escAttr(s.saleUrl || '') + '">' +
    '<textarea id="mShopMemo" rows="2" style="padding:10px 11px" placeholder="メモ(例: 火曜定休・ポイントカードあり)">' + esc(s.memo || '') + '</textarea>' +
    '</div><div class="m-btns">' +
    (shop ? '<button class="btn warn" data-act="del-shop" data-id="' + s.id + '">削除</button>' : '') +
    '<button class="btn" data-act="save-shop" data-id="' + (s.id || '') + '">保存する</button></div>');
}
function brandModal(brand, presetName) {
  const preset = presetName ? BRAND_PRESETS.find(p => p.name === presetName) : null;
  const b = brand || preset || {};
  openModal('<h3>' + (brand ? 'ブランドを編集' : 'ブランドを追加') + '</h3>' +
    '<div class="m-sub">URLが空の項目は、自動で検索リンクになるので空のままでもOKです🎀</div>' +
    '<div class="add-form">' +
    '<input id="mBrandName" placeholder="ブランド名(例: ユニクロ)" value="' + escAttr(b.name || '') + '">' +
    '<input id="mBrandUrl" type="url" placeholder="公式サイトURL(任意)" value="' + escAttr(b.url || '') + '">' +
    '<input id="mBrandStore" type="url" placeholder="店舗検索ページURL(任意)" value="' + escAttr(b.storeUrl || '') + '">' +
    '<input id="mBrandSale" type="url" placeholder="セールページURL(任意)" value="' + escAttr(b.saleUrl || '') + '">' +
    '<input id="mBrandCoupon" type="url" placeholder="クーポンページURL(任意)" value="' + escAttr(b.couponUrl || '') + '">' +
    '</div><div class="m-btns">' +
    (brand ? '<button class="btn warn" data-act="del-brand" data-id="' + b.id + '">削除</button>' : '') +
    '<button class="btn" data-act="save-brand" data-id="' + (brand ? b.id : '') + '">保存する</button></div>');
}
function saleModal(ev) {
  const s = ev || {};
  const isPreset = ev && String(ev.id).startsWith('ps_');
  openModal('<h3>' + (ev ? 'セールを編集' : 'セールを追加') + '</h3>' +
    (isPreset ? '<div class="m-sub">プリセットのセールです。保存すると自分用のデータとして上書きされます。</div>' : '') +
    '<div class="add-form">' +
    '<input id="mSaleName" placeholder="セール名(例: ○○ファミリーセール)" value="' + escAttr(s.name || '') + '">' +
    '<div class="form-2col">' +
    '<input id="mSaleStart" placeholder="開始 (例: 7/1)" value="' + (s.m1 ? s.m1 + '/' + s.d1 : '') + '">' +
    '<input id="mSaleEnd" placeholder="終了 (例: 7/31)" value="' + (s.m2 ? s.m2 + '/' + s.d2 : '') + '"></div>' +
    '<input id="mSaleUrl" type="url" placeholder="セールページURL(任意)" value="' + escAttr(s.url || '') + '">' +
    '<input id="mSaleNote" placeholder="メモ(任意)" value="' + escAttr(s.note || '') + '">' +
    '</div><div class="m-btns">' +
    (ev ? '<button class="btn warn" data-act="del-sale" data-id="' + escAttr(s.id) + '">削除</button>' : '') +
    '<button class="btn" data-act="save-sale" data-id="' + escAttr(s.id || '') + '">保存する</button></div>');
}
function parseMD(str) {
  const m = String(str || '').trim().match(/^(\d{1,2})\s*[\/月]\s*(\d{1,2})日?$/);
  if (!m) return null;
  const mo = +m[1], da = +m[2];
  if (mo < 1 || mo > 12 || da < 1 || da > 31) return null;
  return [mo, da];
}
function diagModal() {
  const keys = trendTabKeys();
  let h = '<h3>データ取得の診断</h3><div class="m-sub">楽天ランキングAPIの取得状況です。</div><div class="diag">';
  if (!state.rakutenAppId) h += '楽天アプリIDが未登録です。設定から登録してください。';
  keys.forEach(k => {
    const d = state.diag[k], c = state.cache[k];
    h += '<div><b>' + TREND_TABS[k].icon + ' ' + TREND_TABS[k].label + '</b>: ';
    if (d) h += d.ok ? '<span class="ok">OK</span>(' + d.count + '件・' + fmtClock(d.at) + ')' : '<span class="ng">失敗</span>(' + esc(d.err) + ')';
    else if (c) h += 'キャッシュあり(' + c.items.length + '件・' + fmtClock(c.fetchedAt) + ')';
    else h += '未取得';
    h += '</div>';
  });
  h += '</div><div class="m-btns"><button class="btn sub" data-act="close-modal">閉じる</button></div>';
  openModal(h);
}

/* ================= 初回設定 ================= */
function renderSetup() {
  const p = state.profile;
  $('#setupInner').innerHTML =
    '<div class="setup-logo">ふくらぶ！</div>' +
    '<div class="setup-sub">流行・近くのお店・お得情報がわかる<br>あなたのファッションアプリです🎀<br>かんたんな初期設定をどうぞ!</div>' +
    '<div class="card-box"><label class="field-label">見たいカテゴリ(複数OK)</label>' + catChipsHtml(p.cats) +
    '<label class="field-label">年代(任意・年代別ランキングに使います)</label>' + ageSelectHtml(p.age) +
    '<div class="set-note">あとから設定でいつでも変えられます。売れ筋ランキング用の「楽天アプリID」も設定から登録できます。</div></div>' +
    '<button class="btn" style="width:100%" id="setupDone">はじめる 🎀</button>';
  $('#setupWrap').classList.add('show');
  $('#setupInner').onclick = e => {
    const cat = e.target.closest('[data-cat]');
    if (cat) {
      state.profile.cats[cat.dataset.cat] = !state.profile.cats[cat.dataset.cat];
      saveAll(); renderSetup(); return;
    }
    if (e.target.id === 'setupDone') {
      const sel = $('#setupWrap #ageSel');
      if (sel) state.profile.age = sel.value;
      state.profile.setupDone = true;
      saveAll();
      $('#setupWrap').classList.remove('show');
      render();
      refreshAll(false);
    }
  };
  const sel = $('#setupWrap #ageSel');
  if (sel) sel.onchange = () => { state.profile.age = sel.value; saveAll(); };
}

/* ================= トースト ================= */
let toastTimer = null;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ================= 描画ルート ================= */
function render() {
  $$('#navBar button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  $$('.tab-page').forEach(p => p.classList.remove('on'));
  const el = $('#page-' + state.tab);
  el.classList.add('on');
  if (state.tab === 'home') renderHome(el);
  else if (state.tab === 'trend') renderTrend(el);
  else if (state.tab === 'shop') renderShop(el);
  else if (state.tab === 'sale') renderSale(el);
  else if (state.tab === 'set') renderSet(el);
}

/* ================= イベント ================= */
$('#navBar').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  state.tab = b.dataset.tab;
  render();
  window.scrollTo(0, 0);
  if (state.tab === 'trend') fetchRanking(state.trendTab || trendTabKeys()[0], false);
});
$('#refreshBtn').onclick = () => refreshAll(true);

document.body.addEventListener('click', e => {
  const t = e.target;
  const actEl = t.closest('[data-act]');
  const act = actEl ? actEl.dataset.act : null;

  // タブ移動系
  if (act === 'go-set') { state.tab = 'set'; render(); window.scrollTo(0, 0); return; }
  if (act === 'go-trend') { state.tab = 'trend'; render(); window.scrollTo(0, 0); fetchRanking(state.trendTab || trendTabKeys()[0], false); return; }
  if (act === 'go-shop') { state.tab = 'shop'; render(); window.scrollTo(0, 0); return; }
  if (act === 'go-brands') { state.tab = 'set'; render(); window.scrollTo(0, 0); return; }

  // トレンド
  const tt = t.closest('[data-trendtab]');
  if (tt) { state.trendTab = tt.dataset.trendtab; render(); fetchRanking(state.trendTab, false); return; }
  if (act === 'retry-trend') { fetchRanking(state.trendTab, true); render(); return; }

  // お店
  if (act === 'add-shop') { shopModal(null); return; }
  const es = t.closest('[data-edit-shop]');
  if (es) { shopModal(state.shops.find(x => x.id === es.dataset.editShop)); return; }
  if (act === 'save-shop') {
    const name = $('#mShopName').value.trim();
    if (!name) { toast('お店の名前を入れてください'); return; }
    const data = {
      name, place: $('#mShopPlace').value.trim(), url: $('#mShopUrl').value.trim(),
      saleUrl: $('#mShopSale').value.trim(), memo: $('#mShopMemo').value.trim(),
    };
    const id = actEl.dataset.id;
    if (id) Object.assign(state.shops.find(x => x.id === id), data);
    else state.shops.push(Object.assign({ id: uid() }, data));
    saveAll(); closeModal(); render(); toast('保存しました🧸'); return;
  }
  if (act === 'del-shop') {
    state.shops = state.shops.filter(x => x.id !== actEl.dataset.id);
    saveAll(); closeModal(); render(); toast('削除しました'); return;
  }

  // ブランド
  if (act === 'add-brand') { brandModal(null); return; }
  const pb = t.closest('[data-preset-brand]');
  if (pb) { brandModal(null, pb.dataset.presetBrand); return; }
  const eb = t.closest('[data-edit-brand]');
  if (eb) { brandModal(state.brands.find(x => x.id === eb.dataset.editBrand)); return; }
  if (act === 'save-brand') {
    const name = $('#mBrandName').value.trim();
    if (!name) { toast('ブランド名を入れてください'); return; }
    const data = {
      name, url: $('#mBrandUrl').value.trim(), storeUrl: $('#mBrandStore').value.trim(),
      saleUrl: $('#mBrandSale').value.trim(), couponUrl: $('#mBrandCoupon').value.trim(),
    };
    const id = actEl.dataset.id;
    if (id) Object.assign(state.brands.find(x => x.id === id), data);
    else state.brands.push(Object.assign({ id: uid() }, data));
    saveAll(); closeModal(); render(); toast('保存しました💕'); return;
  }
  if (act === 'del-brand') {
    state.brands = state.brands.filter(x => x.id !== actEl.dataset.id);
    saveAll(); closeModal(); render(); toast('削除しました'); return;
  }

  // セール
  if (act === 'add-sale') { saleModal(null); return; }
  const esa = t.closest('[data-edit-sale]');
  if (esa && !t.closest('a')) {
    saleModal(allSaleEvents().find(x => x.id === esa.dataset.editSale)); return;
  }
  if (act === 'save-sale') {
    const name = $('#mSaleName').value.trim();
    const sd = parseMD($('#mSaleStart').value), ed = parseMD($('#mSaleEnd').value);
    if (!name) { toast('セール名を入れてください'); return; }
    if (!sd || !ed) { toast('期間は「7/1」のように入れてください'); return; }
    const id = actEl.dataset.id;
    const old = id ? allSaleEvents().find(x => x.id === id) : null;
    const data = {
      name, m1: sd[0], d1: sd[1], m2: ed[0], d2: ed[1],
      url: $('#mSaleUrl').value.trim(), note: $('#mSaleNote').value.trim(),
      icon: (old && old.icon) || '🏷️', approx: false,
    };
    if (id && id.startsWith('ps_')) {
      // プリセットの編集 → プリセットを隠して自分用コピーを作る
      state.sales.removed.push(id);
      state.sales.events.push(Object.assign({ id: uid() }, data));
    } else if (id) {
      Object.assign(state.sales.events.find(x => x.id === id), data);
    } else {
      state.sales.events.push(Object.assign({ id: uid() }, data));
    }
    saveAll(); closeModal(); render(); toast('保存しました🎉'); return;
  }
  if (act === 'del-sale') {
    const id = actEl.dataset.id;
    if (id.startsWith('ps_')) state.sales.removed.push(id);
    else state.sales.events = state.sales.events.filter(x => x.id !== id);
    saveAll(); closeModal(); render(); toast('削除しました'); return;
  }

  // 設定
  const cat = t.closest('#profileBox [data-cat]');
  if (cat) {
    state.profile.cats[cat.dataset.cat] = !state.profile.cats[cat.dataset.cat];
    saveAll(); render(); return;
  }
  if (act === 'save-rakuten') {
    state.rakutenAppId = $('#rakutenIdInput').value.trim();
    saveAll(); toast(state.rakutenAppId ? '保存しました!トレンドを取得します🎀' : '保存しました');
    if (state.rakutenAppId) refreshAll(true);
    return;
  }
  if (act === 'save-addr') {
    state.address = $('#addrInput').value.trim();
    saveAll(); toast('保存しました📍'); return;
  }
  if (act === 'refetch') { refreshAll(true); toast('再取得しています…'); return; }
  if (act === 'diag') { diagModal(); return; }
  if (act === 'clear-cache') {
    state.cache = {}; saveCache(); state.diag = {};
    render(); toast('キャッシュを削除しました🧹'); return;
  }
  if (act === 'close-modal') { closeModal(); return; }
});

document.body.addEventListener('change', e => {
  if (e.target.id === 'ageSel' && e.target.closest('#page-set')) {
    state.profile.age = e.target.value;
    saveAll(); render();
  }
});

/* ================= 初期化 ================= */
const tp = todayParts();
$('#headDate').textContent = tp.m + '/' + tp.d + '(' + tp.wd + ')';

if (!state.profile.setupDone) {
  renderSetup();
} else {
  render();
  // 起動時: キャッシュが60分より古ければ自動取得
  let newest = 0;
  for (const k of trendTabKeys()) newest = Math.max(newest, (state.cache[k] && state.cache[k].fetchedAt) || 0);
  if (state.rakutenAppId && Date.now() - newest > 60 * 60 * 1000) refreshAll(false);
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
