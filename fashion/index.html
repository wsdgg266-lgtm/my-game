<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ふくらぶ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<title>ふくらぶ - コーデ診断・お店・お得がわかるファッションアプリ</title>
<style>
  :root {
    --bg: #f7f7f9;
    --card: #ffffff;
    --text: #1d1d24;
    --text-sub: #8b8b96;
    --line: #ececf0;
    --line2: #dcdce4;
    --ac: #f5568b;
    --ac-deep: #e63f7a;
    --ac-soft: #fdeef4;
    --ok: #27b98b;
    --warn: #f0a02e;
    --radius: 16px;
    --shadow: 0 1px 3px rgba(20,20,30,.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 88px;
    overflow-x: hidden;
    max-width: 100vw;
  }
  input, select, textarea {
    font-size: 16px !important;
    background: #fff; color: var(--text);
    border: 1.5px solid var(--line2); border-radius: 10px;
    font-family: inherit;
  }
  input::placeholder, textarea::placeholder { color: #b9b9c2; }
  textarea { line-height: 1.6; }
  button { font-family: inherit; }
  a { color: var(--ac-deep); }

  /* ---------- ヘッダー ---------- */
  header {
    background: rgba(255,255,255,.92);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    padding: calc(13px + env(safe-area-inset-top)) 16px 12px;
    position: sticky; top: 0; z-index: 10;
  }
  .head-row { display: flex; align-items: center; gap: 8px; }
  header h1 { display: flex; align-items: center; gap: 8px; flex: 1; font-size: 1rem; }
  .logo-mark { width: 26px; height: 26px; flex-shrink: 0; display: block; }
  .logo { font-size: 1.15rem; font-weight: 800; letter-spacing: .03em; color: var(--text); }
  .head-date { font-size: .74rem; color: var(--text-sub); font-weight: normal; margin-left: 2px; }

  /* ---------- 本文 ---------- */
  main { padding: 16px 16px 0; max-width: 640px; margin: 0 auto; }
  .tab-page { display: none; }
  .tab-page.on { display: block; }
  .sec-title {
    font-size: .92rem; font-weight: 700; color: var(--text);
    margin: 22px 2px 10px; display: flex; align-items: center; gap: 7px;
    letter-spacing: .02em;
  }
  .sec-title:first-child { margin-top: 2px; }
  .sec-title small { color: var(--text-sub); font-weight: normal; font-size: .75rem; }
  .sec-title .spacer { flex: 1; }
  .sec-title .mini-btn {
    border: none; background: var(--ac-soft); color: var(--ac-deep);
    border-radius: 999px; padding: 5px 13px; font-size: .78rem; cursor: pointer; font-weight: 700;
  }
  .empty-note {
    background: var(--card); border: 1.5px dashed var(--line2); border-radius: var(--radius);
    padding: 20px 14px; text-align: center; color: var(--text-sub); font-size: .88rem;
    line-height: 1.7; margin-bottom: 10px;
  }
  .card-box {
    background: var(--card);
    border-radius: var(--radius); border: 1px solid var(--line);
    box-shadow: var(--shadow);
    padding: 14px; margin-bottom: 12px;
  }
  .note-sub { font-size: .76rem; color: var(--text-sub); line-height: 1.6; }

  /* ---------- チップ・ボタン ---------- */
  .chip-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    flex-shrink: 0; border: none; background: #f1f1f5;
    color: var(--text); border-radius: 999px; padding: 8px 14px; font-size: .86rem; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .chip.on { background: var(--ac); color: #fff; font-weight: 700; }
  .btn {
    border: none; border-radius: 12px; padding: 13px 14px; font-size: .95rem;
    background: var(--ac); color: #fff; cursor: pointer; font-weight: 700;
    letter-spacing: .02em;
  }
  .btn:active { background: var(--ac-deep); }
  .btn.sub { background: #f1f1f5; color: var(--text); }
  .btn.soft { background: var(--ac-soft); color: var(--ac-deep); }
  .btn.warn { background: #fdeef0; color: #e05555; }
  .btn:disabled { opacity: .5; }
  .link-pills { display: flex; flex-wrap: wrap; gap: 7px; }
  .link-pills a, .link-pills button {
    font-size: .8rem; color: var(--text); text-decoration: none;
    border: 1px solid var(--line2); border-radius: 999px; padding: 7px 13px;
    background: #fff; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
  }

  /* ---------- セールバナー ---------- */
  .sale-banner {
    display: flex; align-items: center; gap: 9px;
    border-radius: 13px; padding: 11px 13px; margin-bottom: 8px;
    font-size: .88rem; font-weight: 700; text-decoration: none;
  }
  .sale-banner.on-now { background: var(--ac); color: #fff; }
  .sale-banner.soon { background: var(--card); color: var(--text); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .sale-banner .st { font-size: .7rem; border-radius: 999px; padding: 3px 9px; flex-shrink: 0; font-weight: 700; }
  .sale-banner.on-now .st { background: rgba(255,255,255,.22); color: #fff; }
  .sale-banner.soon .st { background: var(--ac-soft); color: var(--ac-deep); }
  .sale-banner .nm { flex: 1; line-height: 1.4; }
  .sale-banner .dt { font-size: .73rem; font-weight: normal; opacity: .8; }

  /* ---------- 診断 ---------- */
  .diag-hero {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 26px 16px; text-align: center; margin-bottom: 12px;
  }
  .diag-hero .cam-ic { width: 54px; height: 54px; margin: 0 auto 10px; color: var(--ac); }
  .diag-hero .cam-ic svg { width: 100%; height: 100%; }
  .diag-hero h2 { font-size: 1.05rem; margin-bottom: 6px; }
  .diag-hero p { font-size: .8rem; color: var(--text-sub); line-height: 1.7; margin-bottom: 14px; }
  .diag-hero .btn { width: 100%; margin-bottom: 8px; }
  .photo-frame {
    border-radius: var(--radius); overflow: hidden; background: #111;
    max-height: 340px; display: flex; align-items: center; justify-content: center;
    margin-bottom: 12px;
  }
  .photo-frame img { max-width: 100%; max-height: 340px; display: block; }
  .field-label { display: block; font-size: .8rem; font-weight: 700; color: var(--text); margin: 12px 0 7px; }
  .score-wrap { display: flex; align-items: center; gap: 16px; }
  .score-ring {
    width: 92px; height: 92px; border-radius: 50%; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; background: var(--ac);
  }
  .score-ring b { font-size: 1.9rem; line-height: 1; }
  .score-ring small { font-size: .62rem; opacity: .85; margin-top: 2px; }
  .score-title { font-size: 1rem; font-weight: 800; line-height: 1.5; }
  .score-sub { font-size: .76rem; color: var(--text-sub); margin-top: 3px; }
  .palette-row { display: flex; gap: 8px; margin-top: 12px; }
  .pal {
    flex: 1; border-radius: 10px; height: 44px; border: 1px solid rgba(0,0,0,.08);
    position: relative; overflow: hidden;
  }
  .pal small {
    position: absolute; bottom: 0; left: 0; right: 0; text-align: center;
    font-size: .62rem; background: rgba(255,255,255,.85); color: #444; padding: 1px 0;
  }
  .advice-list { margin-top: 6px; }
  .advice-row {
    display: flex; gap: 9px; padding: 10px 2px; border-bottom: 1px solid var(--line);
    font-size: .86rem; line-height: 1.6;
  }
  .advice-row:last-child { border-bottom: none; }
  .advice-row .mk { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: .72rem; font-weight: 800; color: #fff; margin-top: 1px; }
  .advice-row.good .mk { background: var(--ok); }
  .advice-row.tip .mk { background: var(--warn); }
  .hist-row {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 9px 11px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 11px; cursor: pointer;
  }
  .hist-row img { width: 46px; height: 46px; object-fit: cover; border-radius: 9px; background: #eee; flex-shrink: 0; }
  .hist-row .grow { flex: 1; min-width: 0; }
  .hist-row .h-top { font-size: .86rem; font-weight: 700; }
  .hist-row .h-sub { font-size: .73rem; color: var(--text-sub); margin-top: 1px; }
  .hist-row .h-score { font-size: 1.05rem; font-weight: 800; color: var(--ac-deep); flex-shrink: 0; }
  .rec-item { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .rec-item:last-of-type { border-bottom: none; }
  .rec-item .rec-name { font-size: .86rem; font-weight: 700; margin-bottom: 7px; }
  .prod-scroll {
    display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none; padding: 2px 0 8px;
  }
  .prod-scroll::-webkit-scrollbar { display: none; }
  .prod-card {
    flex: 0 0 110px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    text-decoration: none; color: var(--text); background: #fff; box-shadow: var(--shadow);
    display: flex; flex-direction: column;
  }
  .prod-card img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #f7f7f9; display: block; }
  .prod-card .p-nm {
    font-size: .66rem; line-height: 1.4; padding: 5px 7px 0;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    min-height: 2em;
  }
  .prod-card .p-pr { font-size: .8rem; font-weight: 800; color: var(--ac-deep); padding: 3px 7px 7px; display: block; }

  /* ---------- お店・ブランド ---------- */
  .shop-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 13px 14px; margin-bottom: 10px;
  }
  .shop-card .s-head { display: flex; align-items: center; gap: 8px; }
  .shop-card .s-name { font-weight: 700; font-size: .98rem; flex: 1; }
  .shop-card .s-place { font-size: .77rem; color: var(--text-sub); margin-top: 2px; }
  .shop-card .s-memo { font-size: .8rem; color: var(--text); background: #f7f7f9; border-radius: 9px; padding: 7px 10px; margin-top: 8px; line-height: 1.5; }
  .shop-card .s-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .shop-card .s-links a {
    font-size: .78rem; color: var(--text); text-decoration: none;
    border: 1px solid var(--line2); border-radius: 999px; padding: 6px 12px; background: #fff;
  }
  .edit-btn { border: none; background: none; font-size: 15px; cursor: pointer; padding: 3px 5px; color: var(--text-sub); }

  /* ---------- セールカレンダー ---------- */
  .month-head {
    font-size: .82rem; font-weight: 700; color: var(--text-sub);
    margin: 16px 2px 7px;
  }
  .month-head.now { color: var(--ac-deep); }
  .sale-row {
    background: var(--card); border: 1px solid var(--line); border-radius: 13px;
    box-shadow: var(--shadow); padding: 11px 13px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 10px; cursor: pointer;
  }
  .sale-row .ic { font-size: 1.05rem; flex-shrink: 0; }
  .sale-row .grow { flex: 1; min-width: 0; }
  .sale-row .nm { font-weight: 700; font-size: .9rem; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .sale-row .term { display: block; font-size: .75rem; color: var(--text-sub); margin-top: 2px; }
  .sale-row .note { display: block; font-size: .73rem; color: var(--text-sub); margin-top: 2px; }
  .tag { font-size: .64rem; border-radius: 999px; padding: 2px 8px; font-weight: 700; flex-shrink: 0; }
  .tag.on-now { background: var(--ac); color: #fff; }
  .tag.soon { background: var(--ac-soft); color: var(--ac-deep); }
  .tag.approx { background: #f1f1f5; color: var(--text-sub); }

  /* ---------- 設定 ---------- */
  .set-note { font-size: .76rem; color: var(--text-sub); line-height: 1.6; margin-top: 6px; }
  .set-row-btns { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }

  /* ---------- 下部ナビ ---------- */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    background: rgba(255,255,255,.94);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
    display: flex; padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; border: none; background: none; padding: 9px 0 8px; cursor: pointer;
    font-size: .62rem; color: #a5a5b0; display: flex; flex-direction: column;
    align-items: center; gap: 3px; letter-spacing: .04em;
  }
  nav button .ic { width: 22px; height: 22px; display: block; }
  nav button .ic svg { width: 100%; height: 100%; }
  nav button.on { color: var(--ac-deep); font-weight: 700; }

  /* ---------- モーダル ---------- */
  #modalWrap {
    display: none; position: fixed; inset: 0; z-index: 40;
    background: rgba(25,25,32,.45); align-items: flex-end; justify-content: center;
  }
  #modalWrap.show { display: flex; }
  #modalBox {
    background: #fff;
    border-radius: 20px 20px 0 0; width: 100%; max-width: 640px;
    padding: 20px 16px calc(18px + env(safe-area-inset-bottom));
    max-height: 84vh; overflow-y: auto;
  }
  #modalBox::before {
    content: ""; display: block; width: 40px; height: 4px; border-radius: 2px;
    background: var(--line2); margin: -6px auto 14px;
  }
  #modalBox h3 { font-size: 1rem; margin-bottom: 5px; }
  #modalBox .m-sub { font-size: .8rem; color: var(--text-sub); margin-bottom: 10px; line-height: 1.6; }
  .add-form { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .add-form input, .add-form select, .add-form textarea { padding: 11px 12px; width: 100%; }
  .form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .m-btns { display: flex; gap: 8px; margin-top: 15px; }
  .m-btns .btn { flex: 1; }

  /* ---------- トースト ---------- */
  #toast {
    position: fixed; bottom: calc(94px + env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%) translateY(16px); z-index: 60;
    background: #24242c; color: #fff; font-size: .84rem; font-weight: 700;
    border-radius: 999px; padding: 10px 18px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; max-width: 86vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <h1>
      <svg class="logo-mark" viewBox="0 0 24 24" fill="none" stroke="#f5568b" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.2c0-1.6 2.4-1.9 2.4-3.4 0-.9-.9-1.6-2.4-1.6s-2.3.7-2.3 1.5"/><path d="M12 6.2 3.2 11.6a1.5 1.5 0 0 0 .8 2.8h16a1.5 1.5 0 0 0 .8-2.8L12 6.2Z"/><path d="M12 22.3c-1.8-1.5-3.4-2.9-3.4-4.5 0-1.2 1-2 2-2 .7 0 1.1.3 1.4.8.3-.5.7-.8 1.4-.8 1 0 2 .8 2 2 0 1.6-1.6 3-3.4 4.5Z" fill="#f5568b" stroke="none"/></svg>
      <span class="logo">ふくらぶ</span><span class="head-date" id="headDate"></span>
    </h1>
  </div>
</header>

<main>
  <div class="tab-page" id="page-home"></div>
  <div class="tab-page" id="page-diag"></div>
  <div class="tab-page" id="page-shop"></div>
  <div class="tab-page" id="page-sale"></div>
  <div class="tab-page" id="page-set"></div>
</main>

<nav id="navBar">
  <button data-tab="home"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/></svg></span>ホーム</button>
  <button data-tab="diag"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13.5" r="3.4"/></svg></span>診断</button>
  <button data-tab="shop"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 11V6a3 3 0 0 1 6 0v5"/></svg></span>お店</button>
  <button data-tab="sale"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.6 3H20v7.4L11.4 19a2 2 0 0 1-2.8 0L4 14.4a2 2 0 0 1 0-2.8L12.6 3Z"/><circle cx="15.5" cy="7.5" r="1.3"/></svg></span>お得</button>
  <button data-tab="set"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.7M12 18.5v2.7M2.8 12h2.7M18.5 12h2.7M5.5 5.5l1.9 1.9M16.6 16.6l1.9 1.9M18.5 5.5l-1.9 1.9M7.4 16.6l-1.9 1.9"/></svg></span>設定</button>
</nav>

<div id="modalWrap"><div id="modalBox"></div></div>
<div id="toast"></div>
<input type="file" id="camInput" accept="image/*" capture="environment" hidden>
<input type="file" id="pickInput" accept="image/*" hidden>

<script>
'use strict';

/* ================= ユーティリティ ================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const escAttr = esc;
function lsGet(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch(e) { return fb; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
const uid = () => 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const WDAYS = ['日','月','火','水','木','金','土'];
function todayParts() {
  const d = new Date();
  return { y: d.getFullYear(), m: d.getMonth() + 1, d: d.getDate(), wd: WDAYS[d.getDay()] };
}
function fmtDate(ts) {
  const d = new Date(ts);
  return (d.getMonth()+1) + '/' + d.getDate() + '(' + WDAYS[d.getDay()] + ')';
}
function gmaps(q) { return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q); }
function gsearch(q) { return 'https://www.google.com/search?q=' + encodeURIComponent(q); }

/* ================= 定義データ ================= */
const TREND_LINKS = [
  ['ZOZOTOWN ランキング', 'https://zozo.jp/ranking/'],
  ['WEAR コーデランキング', 'https://wear.jp/ranking/'],
  ['楽天ファッション', 'https://brandavenue.rakuten.co.jp/'],
  ['ユニクロ', 'https://www.uniqlo.com/jp/ja/'],
  ['GU', 'https://www.gu-global.com/jp/ja/'],
  ['Instagram #今日のコーデ', 'https://www.instagram.com/explore/tags/%E4%BB%8A%E6%97%A5%E3%81%AE%E3%82%B3%E3%83%BC%E3%83%87/'],
];

const NEARBY_CATS = [
  'ファッションビル', '古着屋', 'アウトレット', 'セレクトショップ', '靴屋', '子供服',
];

const BRAND_PRESETS = [
  { name: 'ユニクロ', url: 'https://www.uniqlo.com/jp/ja/', storeUrl: 'https://map.uniqlo.com/jp/ja/', saleUrl: 'https://www.uniqlo.com/jp/ja/feature/limited-offers' },
  { name: 'GU', url: 'https://www.gu-global.com/jp/ja/', storeUrl: 'https://map.gu-global.com/jp/ja/' },
  { name: 'しまむら', url: 'https://www.shimamura.gr.jp/shimamura/' },
  { name: '無印良品', url: 'https://www.muji.com/jp/ja/store' },
  { name: 'ZARA', url: 'https://www.zara.com/jp/' },
  { name: 'H&M', url: 'https://www2.hm.com/ja_jp/index.html' },
  { name: 'WEGO', url: 'https://wego.jp/' },
  { name: 'GLOBAL WORK', url: 'https://www.dot-st.com/globalwork/' },

function saleStatus(ev) {
  const t = todayParts();
  const cur = t.m * 100 + t.d;
  const s = ev.m1 * 100 + ev.d1, e = ev.m2 * 100 + ev.d2;
  const on = s <= e ? (cur >= s && cur <= e) : (cur >= s || cur <= e);
  if (on) return 'on';
  const now = new Date(t.y, t.m - 1, t.d);
  let start = new Date(t.y, ev.m1 - 1, ev.d1);
  if (start < now) start = new Date(t.y + 1, ev.m1 - 1, ev.d1);
  const days = Math.round((start - now) / 86400000);
  return days <= 7 ? 'soon' : '';
}

  const t = todayParts();

  let start = new Date(t.y, ev.m1 - 1, ev.d1);
  if (start < now) start = new Date(t.y + 1, ev.m1 - 1, ev.d1);
  return Math.round((start - now) / 86400000);

/* ================= コーデ診断(端末内で色解析・写真は送信しない) ================= */
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  const l = (mx + mn) / 2;
  if (mx === mn) return [0, 0, l];
  const d = mx - mn;
  const s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
  let h;
  if (mx === r) h = ((g - b) / d + (g < b ? 6 : 0));
  else if (mx === g) h = (b - r) / d + 2;
  else h = (r - g) / d + 4;
  return [h * 60, s, l];
}
function hex(r, g, b) {
  const p = n => Math.round(n).toString(16).padStart(2, '0');
  return '#' + p(r) + p(g) + p(b);
}
// 写真から主要カラーを抽出(中央を重視して周辺の背景の影響を弱める)
function extractPalette(imgEl) {
  const MAXW = 64;
  const iw = imgEl.naturalWidth || imgEl.width, ih = imgEl.naturalHeight || imgEl.height;
  const sc = Math.min(MAXW / iw, MAXW / ih, 1);
  const w = Math.max(1, Math.round(iw * sc)), h = Math.max(1, Math.round(ih * sc));
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const cx = cv.getContext('2d');
  cx.drawImage(imgEl, 0, 0, w, h);
  const data = cx.getImageData(0, 0, w, h).data;
  const bins = {};
  let total = 0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      if (data[i + 3] < 128) continue;
      const r = data[i], g = data[i + 1], b = data[i + 2];
      const [hu, s, l] = rgbToHsl(r, g, b);
      // 中央重み(コーデ本体が写っていることが多い)
      const dx = x / w - 0.5, dy = y / h - 0.5;
      const wt = Math.exp(-(dx * dx + dy * dy) / (2 * 0.28 * 0.28));
      let key;
      // ベージュ・アイボリーもベーシックカラー(無彩色相当)として扱う
      const beige = hu >= 20 && hu < 70 && s < 0.42 && l > 0.55;
      const neutral = s < 0.14 || l > 0.93 || l < 0.09 || beige;
      if (neutral) {
        key = l > 0.8 ? 'n-white' : l < 0.22 ? 'n-black' : l < 0.5 ? 'n-dgray' : 'n-lgray';
      } else {
        key = Math.floor(hu / 30) + '-' + (s < 0.45 ? 0 : 1) + '-' + (l < 0.35 ? 0 : l < 0.65 ? 1 : 2);
      }
      const bin = bins[key] || (bins[key] = { w: 0, r: 0, g: 0, b: 0, neutral });
      bin.w += wt; bin.r += r * wt; bin.g += g * wt; bin.b += b * wt;
      total += wt;
    }
  }
  const list = Object.values(bins).sort((a, b) => b.w - a.w);
  const out = [];
  for (const bin of list) {
    const share = bin.w / total;
    if (share < 0.06 || out.length >= 5) break;
    const r = bin.r / bin.w, g = bin.g / bin.w, b = bin.b / bin.w;
    const [hu, s, l] = rgbToHsl(r, g, b);
    out.push({ hex: hex(r, g, b), share, h: hu, s, l, neutral: bin.neutral });
  }
  return out;
}
// 抽出した色 × 季節 × シチュエーションからアドバイスを作る
function judgeOutfit(palette, seasonKey, situKey) {
  const advice = [];
  const items = [];
  const good = t => advice.push({ kind: 'good', text: t });
  // tipにおすすめアイテム(名前と検索キーワード)を紐づけられる
  const tip = (t, itName, itQuery) => {
    advice.push({ kind: 'tip', text: t });
    if (itName && items.length < 3 && !items.some(i => i.name === itName)) {
      items.push({ name: itName, query: itQuery });
    }
  };
  const colors = palette.filter(c => !c.neutral);
  const n = palette.length;
  const tw = palette.reduce((a, c) => a + c.share, 0) || 1;
  const avgL = palette.reduce((a, c) => a + c.l * c.share, 0) / tw;
  const avgS = palette.reduce((a, c) => a + c.s * c.share, 0) / tw;
  const warmShare = colors.filter(c => c.h < 70 || c.h >= 330).reduce((a, c) => a + c.share, 0) / tw;
  const coolShare = colors.filter(c => c.h >= 150 && c.h < 300).reduce((a, c) => a + c.share, 0) / tw;

  // 配色の数(3色ルール)
  if (n <= 3) good('色数は' + n + '色。3色以内にまとまっていてスッキリ見えます');
  else tip('色数が多め(' + n + '色)。メイン・サブ・差し色の3色以内に絞るとまとまります');

  // ベーシックカラー中心かどうか
  if (!colors.length) {
    good('定番カラー中心で、落ち着いた大人っぽいコーデです');
    const ACCENT_ITEM = {
      spring: ['ピンク系の小物', 'ピンク 小物 春'],
      summer: ['ブルー系の小物', 'ブルー 小物 夏'],
      autumn: ['テラコッタ・マスタードの小物', 'テラコッタ 小物'],
      winter: ['ボルドーのマフラー・小物', 'ボルドー マフラー'],
    }[seasonKey];
    tip(SEASONS[seasonKey].accent + 'を小物で1点足すと、ぐっと季節感が出ます', ACCENT_ITEM[0], ACCENT_ITEM[1]);
  }

  // 季節
  if (seasonKey === 'summer') {
    if (avgL < 0.4) tip('全体が暗めのトーン。夏は白や淡い色を1点入れると涼しげに見えます', '白・淡色のトップス', '白 トップス 夏');
    else good('明るいトーンで夏らしい爽やかさがあります');
  } else if (seasonKey === 'winter') {
    if (avgL > 0.75) tip('淡い色メインの冬コーデは、濃い色を1点「締め色」にすると引き締まります', '濃色のニット・アウター', 'ダークカラー ニット');
    else good('落ち着いたトーンで冬らしい深みがあります');
  } else if (seasonKey === 'spring') {
    if (avgL < 0.35) tip('春は明るいトーンや軽やかな色を入れると季節感が出ます', '明るい色のカーディガン', '明るい色 カーディガン 春');
    else good('春らしい軽やかなトーンです');
  } else if (seasonKey === 'autumn') {
    if (colors.length && coolShare > warmShare && avgS > 0.4) tip('ブラウン・カーキなどの「こっくり色」を合わせると秋らしさが増します', 'ブラウン・カーキのトップス', 'ブラウン カーキ トップス');
    else good('あたたかみのあるトーンで秋らしい雰囲気です');
  }

  // シチュエーション
  if (situKey === 'work') {
    if (avgS > 0.45 && colors.length) tip('鮮やかな色は面積を小さめにすると、オフィスでも悪目立ちしません', 'ベーシック色のジャケット', 'きれいめ ジャケット ベーシック');
    else good('落ち着いた配色で、仕事の場でも好印象です');
  } else if (situKey === 'date') {
    if (avgL < 0.35) tip('顔まわり(トップスやストール)に明るい色があると、表情まで明るく見えます', '明るい色のトップス・ストール', '明るい色 トップス');
    else good('明るさのバランスがよく、やわらかい印象です');
  } else if (situKey === 'formal') {
    if (n >= 4) tip('フォーマルな場は色数控えめが上品。ベースカラー+1色くらいが安心です', 'ベーシックカラーの小物', 'フォーマル 小物 ベーシック');
    else good('色数が抑えられていて、きちんと感があります');
  } else if (situKey === 'active') {
    tip('外での活動は日差し・気温差に注意。羽織り物が1枚あると安心です', '軽く羽織れるアウター', '軽量 羽織り パーカー');
  } else if (situKey === 'outing') {
    good('お出かけにちょうどいいバランスです');
  } else if (situKey === 'casual') {
    good('肩の力が抜けたリラックス感がいいですね');
  }

  // 暖色と寒色のバランス
  if (warmShare > 0.28 && coolShare > 0.28) {
    tip('暖色と寒色が同じくらいの分量。どちらかを主役にすると統一感が出ます');
  }

  // 今シーズンのトレンドに照らす
  const tr = TRENDS[seasonKey];
  const matched = tr.colors.filter(def =>
    palette.some(c => hueIn(c.h, def.h1, def.h2) && c.s >= def.sMin && c.l >= def.lMin && c.l <= def.lMax));
  const trendMatch = matched.length > 0;
  if (trendMatch) {
    good('今シーズン流行中の「' + matched.map(m => m.name).join('・') + '」が入っていて、今っぽさがあります');
  } else {
    tip('今シーズンのトレンドカラーは「' + tr.colors.map(c => c.name).join('・') + '」。小物でも1点入れると今っぽくなります',
      '流行中: ' + tr.colors[0].name + 'のアイテム', tr.colors[0].name);
  }
  // トレンドアイテムもおすすめに1つ入れる
  const trIt = tr.items[0];
  if (items.length < 3 && !items.some(i => i.name === trIt[0])) {
    items.push({ name: '流行中: ' + trIt[0], query: trIt[1] });
  }

  // おすすめが無いとき(全部good)は季節の新作をすすめる
  if (!items.length) {
    const DEFAULT_ITEM = {
      spring: ['春の新作アイテム', '春 新作 服'],
      summer: ['夏の新作アイテム', '夏 新作 服'],
      autumn: ['秋の新作アイテム', '秋 新作 服'],
      winter: ['冬の新作アイテム', '冬 新作 服'],
    }[seasonKey];
    items.push({ name: DEFAULT_ITEM[0], query: DEFAULT_ITEM[1] });
  }

  // 採点(やや厳しめ): 指摘1件ごとに減点、色数超過は追加減点、トレンド一致は加点
  const tips = advice.filter(a => a.kind === 'tip').length;
  let score = 85 - tips * 8 + (n <= 3 ? 4 : -5) + (trendMatch ? 6 : 0);
  score = Math.max(40, Math.min(98, score));
  const title = score >= 92 ? '完璧!今日のコーデ、最高です'
    : score >= 84 ? 'とてもいいバランス!'
    : score >= 72 ? 'いいカンジです!'
    : score >= 58 ? 'あと少し!調整してみよう'
    : '今日は思い切って変えてみるのもアリ';
  return { score, title, advice, palette, items };
}
// 履歴用サムネイル(小さく圧縮して保存)
function makeThumb(imgEl) {
  const S = 96;
  const iw = imgEl.naturalWidth || imgEl.width, ih = imgEl.naturalHeight || imgEl.height;
  const sc = Math.max(S / iw, S / ih);
  const cv = document.createElement('canvas');
  cv.width = S; cv.height = S;
  const cx = cv.getContext('2d');
  cx.drawImage(imgEl, (S - iw * sc) / 2, (S - ih * sc) / 2, iw * sc, ih * sc);
  try { return cv.toDataURL('image/jpeg', 0.6); } catch(e) { return ''; }
}

function loadPhotoFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    state.photo = reader.result;
    state.photoResult = null;
    state.tab = 'diag';
    render();
    window.scrollTo(0, 0);
  };
  reader.readAsDataURL(file);
}

function runDiagnosis() {
  const imgEl = $('#diagPhoto');
  if (!imgEl || !imgEl.complete) { toast('写真の読み込み中です'); return; }
  let palette;
  try { palette = extractPalette(imgEl); } catch(e) { palette = []; }
  if (!palette.length) { toast('色を読み取れませんでした。別の写真で試してください'); return; }
  const res = judgeOutfit(palette, state.season, state.situ);
  state.photoResult = res;
  // 履歴に保存(最新20件)
  state.diagLog.unshift({
    id: uid(), at: Date.now(), situ: state.situ, season: state.season,
    score: res.score, title: res.title,
    palette: palette.map(c => c.hex),
    advice: res.advice, items: res.items, thumb: makeThumb(imgEl),
  });
  state.diagLog = state.diagLog.slice(0, 20);
  saveAll();
  render();
}

/* ================= おすすめ商品の取得(楽天商品検索API・任意) ================= */
async function fetchJson(url, timeoutMs) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), timeoutMs || 12000);
  try {
    const res = await fetch(url, { signal: ctl.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally { clearTimeout(t); }
}
function ensureRecProducts(query) {
  if (!state.rakutenAppId || state.recCache[query]) return;
  state.recCache[query] = { status: 'loading' };
  const url = 'https://app.rakuten.co.jp/services/api/IchibaItem/Search/20220601?format=json' +
    '&applicationId=' + encodeURIComponent(state.rakutenAppId) +
    '&keyword=' + encodeURIComponent(query) + '&hits=3&imageFlag=1';
  fetchJson(url).then(json => {
    const items = (json.Items || []).map(w => {
      const it = w.Item || w;
      const img = ((it.mediumImageUrls || [])[0] || {}).imageUrl || '';
      return {
        name: it.itemName, price: it.itemPrice, url: it.itemUrl,
        img: String(img).replace(/_ex=\d+x\d+/, '_ex=300x300'),
        shop: it.shopName,
      };
    });
    state.recCache[query] = items.length ? { status: 'ok', items } : { status: 'err' };
  }).catch(() => {
    state.recCache[query] = { status: 'err' };
  }).finally(() => {
    if (state.tab === 'diag') render();
  });
}
function recProductsHtml(query) {
  if (!state.rakutenAppId) return '';
  const c = state.recCache[query];
  if (!c || c.status === 'loading') return '<div class="note-sub" style="margin-bottom:6px">商品をさがしています…</div>';
  if (c.status === 'err') return '<div class="note-sub" style="margin-bottom:6px">商品を取得できませんでした(下のボタンから探せます)</div>';
  return '<div class="prod-scroll">' + c.items.map(p =>
    '<a class="prod-card" target="_blank" rel="noopener" href="' + escAttr(p.url) + '">' +
    (p.img ? '<img loading="lazy" src="' + escAttr(p.img) + '" alt="">' : '') +
    '<span class="p-nm">' + esc(p.name) + '</span>' +
    '<span class="p-pr">¥' + Number(p.price || 0).toLocaleString('ja-JP') + '</span></a>').join('') + '</div>';
}

}
function brandModal(brand, presetName) {
  const preset = presetName ? BRAND_PRESETS.find(p => p.name === presetName) : null;
  const b = brand || preset || {};
  openModal('<h3>' + (brand ? 'ブランドを編集' : 'ブランドを追加') + '</h3>' +
    '<div class="m-sub">URLが空の項目は、自動で検索リンクになるので空のままでもOKです</div>' +
    '<div class="add-form">' +
    '<input id="mBrandName" placeholder="ブランド名(例: ユニクロ)" value="' + escAttr(b.name || '') + '">' +
    '<input id="mBrandUrl" type="url" placeholder="公式サイトURL(任意)" value="' + escAttr(b.url || '') + '">' +
    '<input id="mBrandStore" type="url" placeholder="店舗検索ページURL(任意)" value="' + escAttr(b.storeUrl || '') + '">' +
    '<input id="mBrandSale" type="url" placeholder="セールページURL(任意)" value="' + escAttr(b.saleUrl || '') + '">' +
    '<input id="mBrandCoupon" type="url" placeholder="クーポンページURL(任意)" value="' + escAttr(b.couponUrl || '') + '">' +
    '</div><div class="m-btns">' +
    (brand ? '<button class="btn warn" data-act="del-brand" data-id="' + b.id + '">削除</button>' : '') +
    '<button class="btn" data-act="save-brand" data-id="' + (brand ? b.id : '') + '">保存する</button></div>');
}
function saleModal(ev) {
  const s = ev || {};
  const isPreset = ev && String(ev.id).startsWith('ps_');
  openModal('<h3>' + (ev ? 'セールを編集' : 'セールを追加') + '</h3>' +
    (isPreset ? '<div class="m-sub">プリセットのセールです。保存すると自分用のデータとして上書きされます。</div>' : '') +
    '<div class="add-form">' +
    '<input id="mSaleName" placeholder="セール名(例: ○○ファミリーセール)" value="' + escAttr(s.name || '') + '">' +
    '<div class="form-2col">' +
    '<input id="mSaleStart" placeholder="開始 (例: 7/1)" value="' + (s.m1 ? s.m1 + '/' + s.d1 : '') + '">' +
    '<input id="mSaleEnd" placeholder="終了 (例: 7/31)" value="' + (s.m2 ? s.m2 + '/' + s.d2 : '') + '"></div>' +
    '<input id="mSaleUrl" type="url" placeholder="セールページURL(任意)" value="' + escAttr(s.url || '') + '">' +
    '<input id="mSaleNote" placeholder="メモ(任意)" value="' + escAttr(s.note || '') + '">' +
    '</div><div class="m-btns">' +
    (ev ? '<button class="btn warn" data-act="del-sale" data-id="' + escAttr(s.id) + '">削除</button>' : '') +
    '<button class="btn" data-act="save-sale" data-id="' + escAttr(s.id || '') + '">保存する</button></div>');
}
function histModal(d) {
  openModal('<h3>' + esc(d.title) + ' <span style="color:var(--ac-deep)">' + d.score + '点</span></h3>' +
    '<div class="m-sub">' + fmtDate(d.at) + ' ・ ' + SEASONS[d.season].label + ' × ' + SITUATIONS[d.situ].label + '</div>' +
    (d.thumb ? '<img src="' + escAttr(d.thumb) + '" style="width:72px;height:72px;border-radius:10px;object-fit:cover" alt="">' : '') +
    paletteRowHtml(d.palette) +
    adviceListHtml(d.advice) +
    recItemsHtml(d.items) +
    '<div class="m-btns"><button class="btn warn" data-act="del-hist" data-id="' + d.id + '">この履歴を削除</button>' +
    '<button class="btn sub" data-act="close-modal">閉じる</button></div>');
}
function parseMD(str) {
  const m = String(str || '').trim().match(/^(\d{1,2})\s*[\/月]\s*(\d{1,2})日?$/);
  if (!m) return null;
  const mo = +m[1], da = +m[2];
  if (mo < 1 || mo > 12 || da < 1 || da > 31) return null;
  return [mo, da];
}

/* ================= トースト ================= */
let toastTimer = null;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ================= 描画ルート ================= */
function render() {
  $$('#navBar button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  $$('.tab-page').forEach(p => p.classList.remove('on'));
  const el = $('#page-' + state.tab);
  el.classList.add('on');
  if (state.tab === 'home') renderHome(el);
  else if (state.tab === 'diag') renderDiag(el);
  else if (state.tab === 'shop') renderShop(el);
  else if (state.tab === 'sale') renderSale(el);
  else if (state.tab === 'set') renderSet(el);
}

/* ================= イベント ================= */
$('#navBar').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  state.tab = b.dataset.tab;
  render();
  window.scrollTo(0, 0);
});
$('#camInput').addEventListener('change', e => { loadPhotoFile(e.target.files[0]); e.target.value = ''; });
$('#pickInput').addEventListener('change', e => { loadPhotoFile(e.target.files[0]); e.target.value = ''; });

document.body.addEventListener('click', e => {
  const t = e.target;
  const actEl = t.closest('[data-act]');
  const act = actEl ? actEl.dataset.act : null;

  // タブ移動系
  if (act === 'go-diag') { state.tab = 'diag'; render(); window.scrollTo(0, 0); return; }
  if (act === 'go-shop') { state.tab = 'shop'; render(); window.scrollTo(0, 0); return; }
  if (act === 'go-brands') { state.tab = 'set'; render(); window.scrollTo(0, 0); return; }

  // 診断
  if (act === 'cam') { $('#camInput').click(); return; }
  if (act === 'pick') { $('#pickInput').click(); return; }
  if (act === 'retake') { state.photo = null; state.photoResult = null; render(); return; }
  if (act === 'run-diag') { runDiagnosis(); return; }
  const situ = t.closest('[data-situ]');
  if (situ) { state.situ = situ.dataset.situ; render(); return; }
  const sea = t.closest('[data-season]');
  if (sea) { state.season = sea.dataset.season; render(); return; }
  const hist = t.closest('[data-hist]');
  if (hist) {
    const d = state.diagLog.find(x => x.id === hist.dataset.hist);
    if (d) histModal(d);
    return;
  }
  if (act === 'del-hist') {
    state.diagLog = state.diagLog.filter(x => x.id !== actEl.dataset.id);
    saveAll(); closeModal(); render(); toast('削除しました'); return;
  }
  if (act === 'clear-diaglog') {
    state.diagLog = [];
    saveAll(); render(); toast('診断の履歴を消しました'); return;
  }

  // お店
  if (act === 'add-shop') { shopModal(null); return; }
  const es = t.closest('[data-edit-shop]');
  if (es) { shopModal(state.shops.find(x => x.id === es.dataset.editShop)); return; }
  if (act === 'save-shop') {
    const name = $('#mShopName').value.trim();
    if (!name) { toast('お店の名前を入れてください'); return; }
    const data = {
      name, place: $('#mShopPlace').value.trim(), url: $('#mShopUrl').value.trim(),
      saleUrl: $('#mShopSale').value.trim(), memo: $('#mShopMemo').value.trim(),
    };
    const id = actEl.dataset.id;
    if (id) Object.assign(state.shops.find(x => x.id === id), data);
    else state.shops.push(Object.assign({ id: uid() }, data));
    saveAll(); closeModal(); render(); toast('保存しました'); return;
  }
  if (act === 'del-shop') {
    state.shops = state.shops.filter(x => x.id !== actEl.dataset.id);
    saveAll(); closeModal(); render(); toast('削除しました'); return;
  }

  // ブランド
  if (act === 'add-brand') { brandModal(null); return; }
  const pb = t.closest('[data-preset-brand]');
  if (pb) { brandModal(null, pb.dataset.presetBrand); return; }
  const eb = t.closest('[data-edit-brand]');
  if (eb) { brandModal(state.brands.find(x => x.id === eb.dataset.editBrand)); return; }
  if (act === 'save-brand') {
    const name = $('#mBrandName').value.trim();
    if (!name) { toast('ブランド名を入れてください'); return; }
    const data = {
      name, url: $('#mBrandUrl').value.trim(), storeUrl: $('#mBrandStore').value.trim(),
      saleUrl: $('#mBrandSale').value.trim(), couponUrl: $('#mBrandCoupon').value.trim(),
    };
    const id = actEl.dataset.id;
    if (id) Object.assign(state.brands.find(x => x.id === id), data);
    else state.brands.push(Object.assign({ id: uid() }, data));
    saveAll(); closeModal(); render(); toast('保存しました'); return;
  }
  if (act === 'del-brand') {
    state.brands = state.brands.filter(x => x.id !== actEl.dataset.id);
    saveAll(); closeModal(); render(); toast('削除しました'); return;
  }

  // セール
  if (act === 'add-sale') { saleModal(null); return; }
  const esa = t.closest('[data-edit-sale]');
  if (esa && !t.closest('a')) {
    saleModal(allSaleEvents().find(x => x.id === esa.dataset.editSale)); return;
  }
  if (act === 'save-sale') {
    const name = $('#mSaleName').value.trim();
    const sd = parseMD($('#mSaleStart').value), ed = parseMD($('#mSaleEnd').value);
    if (!name) { toast('セール名を入れてください'); return; }
    if (!sd || !ed) { toast('期間は「7/1」のように入れてください'); return; }
    const id = actEl.dataset.id;
    const old = id ? allSaleEvents().find(x => x.id === id) : null;
    const data = {
      name, m1: sd[0], d1: sd[1], m2: ed[0], d2: ed[1],
      url: $('#mSaleUrl').value.trim(), note: $('#mSaleNote').value.trim(),
      icon: (old && old.icon) || '🏷️', approx: false,
    };
    if (id && id.startsWith('ps_')) {
      // プリセットの編集 → プリセットを隠して自分用コピーを作る
      state.sales.removed.push(id);
      state.sales.events.push(Object.assign({ id: uid() }, data));
    } else if (id) {
      Object.assign(state.sales.events.find(x => x.id === id), data);
    } else {
      state.sales.events.push(Object.assign({ id: uid() }, data));
    }
    saveAll(); closeModal(); render(); toast('保存しました'); return;
  }
  if (act === 'del-sale') {
    const id = actEl.dataset.id;
    if (id.startsWith('ps_')) state.sales.removed.push(id);
    else state.sales.events = state.sales.events.filter(x => x.id !== id);
    saveAll(); closeModal(); render(); toast('削除しました'); return;
  }

  // 設定
  const rs = t.closest('[data-recshop]');
  if (rs) {
    const id = rs.dataset.recshop;
    if (state.recShops.includes(id)) state.recShops = state.recShops.filter(x => x !== id);
    else state.recShops.push(id);
    saveAll(); render(); return;
  }
  if (act === 'save-rakuten') {
    state.rakutenAppId = $('#rakutenIdInput').value.trim();
    state.recCache = {};
    saveAll();
    toast(state.rakutenAppId ? '保存しました!診断結果におすすめ商品が出ます' : '保存しました');
    return;
  }
  if (act === 'save-addr') {
    state.address = $('#addrInput').value.trim();
    saveAll(); toast('保存しました'); return;
  }
  if (act === 'close-modal') { closeModal(); return; }
});

/* ================= 初期化 ================= */
const tp = todayParts();
$('#headDate').textContent = tp.m + '/' + tp.d + '(' + tp.wd + ')';
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
